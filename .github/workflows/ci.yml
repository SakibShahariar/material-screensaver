name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install lint tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq shellcheck desktop-file-utils
          python3 -m pip install --user ruff

      - name: Bash syntax + shellcheck
        run: |
          bash -n install.sh uninstall.sh
          shellcheck -x install.sh uninstall.sh

      - name: Python lint (Ruff)
        run: |
          "$HOME/.local/bin/ruff" check --select E9,F63,F7,F82 bin/*.py tests/*.py

      - name: Desktop file validation
        run: |
          desktop-file-validate applications/material-screensaver-settings.desktop

      - name: Systemd unit sanity
        run: |
          grep -q 'ExecStart=.*material-screensaver-ctl.py daemon' systemd/material-screensaver.service
          grep -q 'WantedBy=graphical-session.target' systemd/material-screensaver.service

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node (JS syntax checks in test suite)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-webkit-6.0 \
            gir1.2-gdkpixbuf-2.0

      - name: Python syntax + GI import smoke test
        run: |
          python3 -m py_compile bin/*.py
          /usr/bin/python3 -c "
          import gi
          gi.require_version('Gtk', '4.0')
          gi.require_version('Adw', '1')
          gi.require_version('WebKit', '6.0')
          from gi.repository import Gtk, Adw, WebKit, Gio, GLib, Gdk
          print('GI imports OK')
          "

      - name: Run test suite (static, theme, JS syntax, config edge cases)
        run: |
          # Use Ubuntu's system Python so apt-installed PyGObject is importable;
          # otherwise GUI logic tests silently skip under setup-python.
          /usr/bin/python3 -m unittest discover -s tests -v