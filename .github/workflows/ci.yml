name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python for linting
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Install lint tools
        run: |
          # Bound apt networking so a stalled package mirror fails with useful logs.
          timeout 6m sudo apt-get update -qq \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          timeout 6m sudo apt-get install -y -qq \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            shellcheck desktop-file-utils
          python -m pip install ruff

      - name: Bash syntax + shellcheck
        run: |
          bash -n install.sh uninstall.sh
          shellcheck -x install.sh uninstall.sh

      - name: Python lint (Ruff)
        run: |
          ruff check --select E9,F63,F7,F82 bin/*.py tests/*.py

      - name: JavaScript lint (ESLint)
        run: |
          npx --yes eslint@9 screensavers/clock-shared.js extensions/material-screensaver-gestures@io.github.sakib/extension.js

      - name: Desktop file validation
        run: |
          desktop-file-validate applications/material-screensaver-settings.desktop

      - name: Systemd unit validation
        run: |
          mkdir -p "$HOME/.local/bin"
          install -D -m 755 bin/material-screensaver-ctl.py "$HOME/.local/bin/material-screensaver-ctl.py"
          systemd-analyze --user verify systemd/material-screensaver.service

  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up Node (JS syntax checks in test suite)
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install system dependencies
        run: |
          # Bound apt networking so a stalled package mirror fails with useful logs.
          timeout 6m sudo apt-get update -qq \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30
          timeout 6m sudo apt-get install -y -qq \
            -o Acquire::Retries=3 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            python3-gi \
            gir1.2-gtk-4.0 \
            gir1.2-adw-1 \
            gir1.2-webkit-6.0 \
            gir1.2-gdkpixbuf-2.0 \
            xvfb

      - name: Python syntax + GI import smoke test
        run: |
          python3 -m py_compile bin/*.py
          /usr/bin/python3 -c "
          import gi
          gi.require_version('Gtk', '4.0')
          gi.require_version('Adw', '1')
          gi.require_version('WebKit', '6.0')
          from gi.repository import Gtk, Adw, WebKit, Gio, GLib, Gdk
          print('GI imports OK')
          "

      - name: Validate built-in scene packages
        run: python3 scripts/validate-scenes.py

      - name: Run test suite (static, theme, JS syntax, config edge cases)
        run: |
          # Use Ubuntu's system Python so apt-installed PyGObject is importable;
          # otherwise GUI logic tests silently skip under setup-python.
          /usr/bin/python3 -m unittest discover -s tests -v

      - name: WebKit CSP resource-policy integration test
        env:
          # The hosted runner forbids the network namespaces WebKit's bwrap sandbox needs.
          # Disable that sandbox only for this isolated CSP test; the WebKit file-access
          # settings and Content-Security-Policy behavior remain under test.
          WEBKIT_DISABLE_SANDBOX_THIS_IS_DANGEROUS: "1"
          GTK_A11Y: "none"
        run: |
          xvfb-run -a /usr/bin/python3 -m unittest discover -s tests -p test_webkit_csp.py -v
