<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' data:; connect-src 'none';">
<title>Material Screensaver — Abyssal Drift</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --primary_container_rgb: 0 75 111;
  --secondary_rgb: 180 199 233;
  --secondary_container_rgb: 53 72 99;
  --tertiary_rgb: 186 196 250;
  --tertiary_container_rgb: 58 68 114;
  --inverse_primary_rgb: 0 100 145;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }
#clock {
  position: fixed;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(40px, 4.5vw, 56px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow: 0 0 40px rgb(var(--primary_rgb) / .4), 0 2px 16px rgba(0,0,0,.6);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock .ampm {
  font-size: .26em; margin-left: 10px; opacity: .7;
  vertical-align: 22%; letter-spacing: 2px; font-weight: 400;
}
#date {
  position: fixed;
  left: clamp(30px, 3.1vw, 50px);
  bottom: clamp(18px, 2.2vw, 28px);
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px; text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 10px rgba(0,0,0,.5);
  pointer-events: none; transition: opacity .7s ease;
}
#clock.hidden, #date.hidden { opacity: 0; }
#hint {
  position: fixed; right: 28px; bottom: 24px;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase; pointer-events: none;
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00<span class="ampm">AM</span></div>
<div id="date">MON, JAN 1</div>
<div id="hint">C · toggle clock</div>
<script>

"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");

let W = 0, H = 0, DPR = 1;
let theme = {};
let roleList = [];
let start = performance.now();
let lastT = 0;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
function loadTheme() {
  theme = {
    surface:   readRGB("--surface_rgb", [12, 20, 27]),
    primary:   readRGB("--primary_rgb", [138, 206, 255]),
    secondary: readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:  readRGB("--tertiary_rgb", [186, 196, 250]),
    container: readRGB("--tertiary_container_rgb", [58, 68, 114]),
    outline:   readRGB("--outline_rgb", [137, 146, 154])
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary];
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.97);
  dateEl.style.color = rgba(theme.secondary, 0.88);
  hintEl.style.color = rgba(theme.outline, 0.6);
}
function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });
addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockEl.classList.toggle("hidden");
    dateEl.classList.toggle("hidden");
  }
});
function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}
addEventListener("load", () => {
  loadTheme();
  resize();
  initScene();
  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);
  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);
  requestAnimationFrame(frame);
});


const SNOW = 220;
let snow = [], jelly = [], flashes = [];
const speedMul = reduceMotion ? 0.25 : 0.9;

function initScene() {
  snow = Array.from({ length: SNOW }, () => ({
    x: Math.random() * W, y: Math.random() * H,
    r: 0.5 + Math.random() * 1.8,
    v: 6 + Math.random() * 18, phase: Math.random() * 6.28
  }));
  jelly = Array.from({ length: 6 }, (_, i) => ({
    x: Math.random() * W, y: H * (0.2 + Math.random() * 0.7),
    r: 22 + Math.random() * 38, phase: Math.random() * 6.28,
    v: 5 + Math.random() * 10, color: roleList[i % roleList.length]
  }));
  flashes = [];
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT || 0.016);
  lastT = t;
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  const water = ctx.createLinearGradient(0, 0, 0, H);
  water.addColorStop(0, rgba(theme.primary, 0.07));
  water.addColorStop(0.35, rgba(theme.tertiary, 0.03));
  water.addColorStop(1, rgba(theme.surface, 1));
  ctx.fillStyle = water;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = "lighter";
  for (let i = 0; i < 5; i++) {
    const x = W * (0.1 + i * 0.2) + Math.sin(t * 0.15 + i) * W * 0.04;
    const shaft = ctx.createLinearGradient(x, 0, x, H * 0.9);
    shaft.addColorStop(0, rgba(theme.primary, 0.018));
    shaft.addColorStop(1, rgba(theme.primary, 0));
    ctx.fillStyle = shaft;
    ctx.beginPath();
    ctx.moveTo(x - W * 0.06, 0);
    ctx.lineTo(x + W * 0.06, 0);
    ctx.lineTo(x + W * 0.16, H * 0.9);
    ctx.lineTo(x - W * 0.16, H * 0.9);
    ctx.fill();
  }
  for (const j of jelly) {
    j.y -= j.v * dt;
    if (j.y < -60) { j.y = H + 60; j.x = Math.random() * W; }
    const r = j.r * (0.85 + Math.sin(t * 1.2 + j.phase) * 0.15);
    const glow = ctx.createRadialGradient(j.x, j.y, 0, j.x, j.y, r * 1.6);
    glow.addColorStop(0, rgba(j.color, 0.22));
    glow.addColorStop(1, rgba(j.color, 0));
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(j.x, j.y, r * 1.6, 0, Math.PI * 2);
    ctx.fill();
    ctx.strokeStyle = rgba(j.color, 0.25);
    ctx.lineWidth = 1.2;
    for (let k = -2; k <= 2; k++) {
      ctx.beginPath();
      ctx.moveTo(j.x + k * r * 0.3, j.y + r * 0.2);
      ctx.quadraticCurveTo(
        j.x + k * r * 0.4 + Math.sin(t * 2 + k + j.phase) * 8, j.y + r * 1.4,
        j.x + k * r * 0.3 + Math.sin(t * 1.5 + k) * 10, j.y + r * 2.6);
      ctx.stroke();
    }
  }
  if (Math.random() < 0.003) {
    flashes.push({ x: Math.random() * W, y: Math.random() * H, age: 0,
                   color: roleList[Math.floor(Math.random() * roleList.length)] });
  }
  for (let i = flashes.length - 1; i >= 0; i--) {
    const f = flashes[i];
    f.age += dt;
    ctx.strokeStyle = rgba(f.color, Math.max(0, 0.18 - f.age * 0.18));
    ctx.lineWidth = 2;
    ctx.beginPath();
    ctx.arc(f.x, f.y, f.age * 90, 0, Math.PI * 2);
    ctx.stroke();
    if (f.age > 1) flashes.splice(i, 1);
  }
  ctx.globalCompositeOperation = "source-over";

  const wx = ((t * 12) % (W + 400)) - 200;
  ctx.fillStyle = rgba(theme.container, 0.2);
  ctx.beginPath();
  ctx.ellipse(wx, H * 0.55, 90, 18, 0, 0, Math.PI * 2);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(wx + 80, H * 0.55);
  ctx.lineTo(wx + 130, H * 0.48);
  ctx.lineTo(wx + 125, H * 0.62);
  ctx.closePath();
  ctx.fill();

  for (const s of snow) {
    s.y += s.v * dt;
    s.x += Math.sin(t * 0.4 + s.phase) * 4 * dt;
    if (s.y > H) { s.y = -5; s.x = Math.random() * W; }
    ctx.fillStyle = rgba(theme.outline, 0.2);
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fill();
  }
  requestAnimationFrame(frame);
}

</script>
</body>
</html>
