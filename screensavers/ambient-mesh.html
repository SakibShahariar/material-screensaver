<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Ambient Mesh</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --surface_rgb: 8 12 18;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
  user-select: none;
  cursor: none;
}
body.show-cursor { cursor: default; }

canvas {
  position: absolute; inset: 0;
  width: 100vw; height: 100vh;
  z-index: 1;
}

#ui {
  position: absolute; inset: 0; z-index: 2;
  display: flex; flex-direction: column; justify-content: flex-end;
  padding: clamp(36px, 5vw, 72px);
  pointer-events: none;
  transition: opacity .65s cubic-bezier(0.16, 1, 0.3, 1),
              transform .65s cubic-bezier(0.16, 1, 0.3, 1);
}
#ui.hidden {
  opacity: 0;
  transform: translateY(12px);
}

#clock {
  font-size: clamp(56px, 8.5vw, 124px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -3.5px;
  line-height: 0.95;
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 48px rgb(var(--primary_rgb) / .3),
    0 2px 20px rgba(0,0,0,.45);
}
#clock .ampm {
  font-size: .22em;
  margin-left: 14px;
  font-weight: 400;
  letter-spacing: 2px;
  vertical-align: super;
  opacity: .68;
}
#date {
  margin-top: 16px;
  font-size: clamp(12px, 1.15vw, 15px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 12px rgba(0,0,0,.4);
}

#hint {
  position: fixed;
  right: clamp(28px, 4vw, 56px);
  top: clamp(28px, 4vw, 56px);
  z-index: 10;
  font-size: 11px;
  letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0;
  transition: opacity .8s ease;
  text-transform: uppercase;
  pointer-events: none;
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle UI</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const ui      = document.getElementById("ui");

let W = 0, H = 0, DPR = 1;
let theme = {};
let start = performance.now();
let cursorTimer;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.18 : 0.28;

function readRGB(name, fb) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:   readRGB("--surface_rgb", [8, 12, 18]),
    primary:   readRGB("--primary_rgb", [138, 206, 255]),
    secondary: readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:  readRGB("--tertiary_rgb", [186, 196, 250]),
    outline:   readRGB("--outline_rgb", [137, 146, 154])
  };
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.97);
  dateEl.style.color  = rgba(theme.secondary, 0.88);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });

/* Floating organic glow nodes */
const nodes = [
  { x: 0.22, y: 0.28, vx: 0.36, vy: 0.26, r: 0.74, key: "primary" },
  { x: 0.78, y: 0.68, vx: -0.26, vy: -0.34, r: 0.8,  key: "secondary" },
  { x: 0.48, y: 0.48, vx: 0.24, vy: -0.2,  r: 0.92, key: "tertiary" },
  { x: 0.12, y: 0.72, vx: 0.3,  vy: -0.16, r: 0.58, key: "primary" },
  { x: 0.86, y: 0.2,  vx: -0.2, vy: 0.28,  r: 0.52, key: "secondary" },
  { x: 0.62, y: 0.35, vx: 0.18, vy: 0.22,  r: 0.48, key: "tertiary" },
];

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = "screen";

  for (let i = 0; i < nodes.length; i++) {
    const n = nodes[i];
    const cx = W * n.x + Math.sin(t * n.vx + i * 1.4) * (W * 0.2);
    const cy = H * n.y + Math.cos(t * n.vy + i * 1.15) * (H * 0.2);
    const radius = Math.max(W, H) * n.r * (0.84 + 0.16 * Math.sin(t * 0.4 + i * 0.7));

    const col = theme[n.key] || theme.primary;
    const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radius);
    grad.addColorStop(0, rgba(col, 0.2));
    grad.addColorStop(0.35, rgba(col, 0.08));
    grad.addColorStop(0.7, rgba(col, 0.025));
    grad.addColorStop(1, "transparent");

    ctx.fillStyle = grad;
    ctx.fillRect(0, 0, W, H);
  }

  ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    ui.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 3800);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
