<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Autumn Leaves</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --tertiary_container_rgb: 58 68 114;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock {
  position: fixed;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(40px, 4.5vw, 56px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 40px rgb(var(--primary_rgb) / .4),
    0 2px 16px rgba(0,0,0,.6);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .7;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  position: fixed;
  left: clamp(30px, 3.1vw, 50px);
  bottom: clamp(18px, 2.2vw, 28px);
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 10px rgba(0,0,0,.5);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock.hidden, #date.hidden { opacity: 0; }

#hint {
  position: fixed; right: 28px; bottom: 24px;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00<span class="ampm">AM</span></div>
<div id="date">MON, JAN 1</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");

let W = 0, H = 0, DPR = 1;
let theme = {};
let leaves = [];
let pile = [];
let start = performance.now();
let lastT = 0;
let lastPileReset = 0;
let cursorTimer;

const PILE_RES = 80;
const LEAF_COUNT = 65;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.28 : 0.85;

const AUTUMN = [
  [196, 92, 40], [214, 140, 45], [168, 60, 38],
  [220, 170, 60], [180, 110, 50], [145, 72, 36]
];

/* —— Natural gust state —— */
const gust = {
  active: false,
  t0: 0,           // start time
  duration: 3.5,   // total length (s)
  peak: 2.0,       // time of peak strength
  dir: 1,          // +1 right, -1 left
  x: 0,            // center of wind front
  width: 0.35,     // band width as fraction of W
  speed: 0,        // how fast the front moves across screen
  strength: 0      // peak horizontal push
};

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
function blend(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];
}
function smoothstep(e0, e1, x) {
  const t = Math.max(0, Math.min(1, (x - e0) / (e1 - e0)));
  return t * t * (3 - 2 * t);
}

function loadTheme() {
  theme = {
    surface:           readRGB("--surface_rgb", [12, 20, 27]),
    primary:           readRGB("--primary_rgb", [138, 206, 255]),
    secondary:         readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:          readRGB("--tertiary_rgb", [186, 196, 250]),
    tertiaryContainer: readRGB("--tertiary_container_rgb", [58, 68, 114]),
    outline:           readRGB("--outline_rgb", [137, 146, 154])
  };
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.97);
  dateEl.style.color  = rgba(theme.secondary, 0.88);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });

function spawnLeaf(l, fromTop = true) {
  l.x = Math.random() * W * 1.2 - W * 0.1;
  l.y = fromTop ? (-40 - Math.random() * 160) : Math.random() * H;
  l.size = 8 + Math.random() * 11;
  l.fallSpeed = 20 + Math.random() * 28;
  l.swayAmp = 28 + Math.random() * 50;
  l.swayFreq = 0.4 + Math.random() * 0.65;
  l.phase = Math.random() * Math.PI * 2;
  l.rot = Math.random() * Math.PI * 2;
  l.rotSpeed = (Math.random() - 0.5) * 2.6;
  l.rotWobble = 0.45 + Math.random() * 1.3;
  // Mass proxy: larger = less gust response
  l.mass = 0.55 + (l.size / 20) * 0.7;

  const base = AUTUMN[Math.floor(Math.random() * AUTUMN.length)];
  const roles = [theme.primary, theme.secondary, theme.tertiary];
  l.color = blend(base, roles[Math.floor(Math.random() * roles.length)] || base, 0.26);
}

function initLeaves() {
  leaves = [];
  pile = new Array(PILE_RES).fill(0);
  for (let i = 0; i < LEAF_COUNT; i++) {
    const l = {};
    spawnLeaf(l, false);
    leaves.push(l);
  }
}

function startGust(t) {
  gust.active = true;
  gust.t0 = t;
  gust.duration = 3.2 + Math.random() * 1.8;
  gust.peak = gust.duration * (0.25 + Math.random() * 0.2);
  gust.dir = Math.random() < 0.5 ? 1 : -1;
  gust.width = 0.28 + Math.random() * 0.18;
  gust.strength = 90 + Math.random() * 70;
  // Front starts just off-screen on the incoming side
  gust.x = gust.dir > 0 ? -gust.width * W : W + gust.width * W;
  gust.speed = (W * (1 + gust.width * 2)) / gust.duration;
}

/** Smooth attack → peak → long decay */
function gustEnvelope(t) {
  if (!gust.active) return 0;
  const age = t - gust.t0;
  if (age >= gust.duration) {
    gust.active = false;
    return 0;
  }
  if (age <= gust.peak) {
    return smoothstep(0, gust.peak, age);
  }
  return 1 - smoothstep(gust.peak, gust.duration, age);
}

/** How much this leaf feels the current wind front */
function leafGustFactor(l, env) {
  if (env <= 0.001) return 0;

  // Spatial band around the moving front
  const band = gust.width * W;
  const dist = Math.abs(l.x - gust.x);
  const spatial = 1 - smoothstep(band * 0.15, band, dist);

  // Stronger high up, weak near ground
  const height = 1 - Math.max(0, Math.min(1, l.y / H));
  const heightF = 0.2 + height * 0.8;

  // Heavier leaves resist more
  const massF = 1 / l.mass;

  return env * spatial * heightF * massF;
}

function drawLeaf(l) {
  ctx.save();
  ctx.translate(l.x, l.y);
  ctx.rotate(l.rot);

  ctx.beginPath();
  ctx.moveTo(0, -l.size);
  ctx.bezierCurveTo(l.size * 1.15, -l.size * 0.32, l.size * 0.85, l.size * 0.55, 0, l.size);
  ctx.bezierCurveTo(-l.size * 0.85, l.size * 0.55, -l.size * 1.15, -l.size * 0.32, 0, -l.size);
  ctx.closePath();
  ctx.fillStyle = rgba(l.color, 0.9);
  ctx.fill();

  ctx.beginPath();
  ctx.moveTo(0, -l.size * 0.82);
  ctx.lineTo(0, l.size * 0.82);
  ctx.strokeStyle = rgba(l.color.map(v => v * 0.55), 0.5);
  ctx.lineWidth = 0.9;
  ctx.stroke();

  ctx.restore();
}

function pileIndex(x) {
  return Math.max(0, Math.min(PILE_RES - 1, Math.floor((x / W) * PILE_RES)));
}

let nextGustAt = 4 + Math.random() * 4;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT || 0.016);
  lastT = t;

  if (t - lastPileReset > 150) {
    pile = new Array(PILE_RES).fill(0);
    lastPileReset = t;
  }

  // Schedule gusts
  if (!gust.active && t >= nextGustAt) {
    startGust(t);
    nextGustAt = t + 9 + Math.random() * 8;
  }

  // Advance wind front
  if (gust.active) {
    gust.x += gust.dir * gust.speed * dt;
  }
  const env = gustEnvelope(t);

  // Soft continuous breeze (always on)
  const breeze = Math.sin(t * 0.35) * 8 + Math.sin(t * 0.17 + 1.2) * 5;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  // Pile
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i < PILE_RES; i++) {
    const x = (i / (PILE_RES - 1)) * W;
    ctx.lineTo(x, H - pile[i]);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = rgba(theme.tertiaryContainer || [58, 68, 114], 0.48);
  ctx.fill();

  for (const l of leaves) {
    const gf = leafGustFactor(l, env);
    const gustPush = gust.dir * gust.strength * gf;

    // Base sway + breeze + gust
    const sway = Math.sin(t * l.swayFreq + l.phase) * l.swayAmp * 0.34;
    l.x += (sway + breeze + gustPush) * dt;
    l.y += l.fallSpeed * dt;

    // Extra tumble in the wind
    const spinBoost = 1 + gf * 1.8;
    l.rot += l.rotSpeed * dt * (0.5 + Math.sin(t * l.rotWobble + l.phase) * 0.4) * spinBoost;

    const idx = pileIndex(l.x);
    const floorY = H - (pile[idx] || 0);

    if (l.y >= floorY) {
      pile[idx] = Math.min(H * 0.1, (pile[idx] || 0) + 0.5);
      spawnLeaf(l, true);
      continue;
    }
    if (l.x > W + 60 || l.x < -60) {
      spawnLeaf(l, true);
      continue;
    }

    drawLeaf(l);
  }

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockEl.classList.toggle("hidden");
    dateEl.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();
  initLeaves();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
