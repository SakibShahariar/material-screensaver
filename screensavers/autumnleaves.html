<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Autumn Leaves</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233; --tertiary_rgb: 186 196 250; --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27; --outline_rgb: 137 146 154;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none; }
  body.show-cursor { cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock { position: fixed; left: 32px; bottom: 28px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; font-size: clamp(28px,4vw,56px); text-shadow: 0 0 24px rgba(0,0,0,0.4); pointer-events: none; transition: opacity 0.6s ease; }
  #clock .ampm { font-size: 0.36em; margin-left: 6px; opacity: 0.82; vertical-align: middle; }
  #date { position: fixed; left: 34px; bottom: 14px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: clamp(12px,1.2vw,16px); letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; transition: opacity 0.6s ease; }
  #hint { position: fixed; right: 28px; bottom: 26px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: 13px; letter-spacing: 0.5px; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>
<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let cursorTimeout;
window.addEventListener('pointermove', () => {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
});

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.25 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return fallback;
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }
function blendColor(a, b, t) { return [a[0]+(b[0]-a[0])*t, a[1]+(b[1]-a[1])*t, a[2]+(b[2]-a[2])*t]; }

let theme = {};
let roleList = [];
const AUTUMN_TONES = [[196, 92, 40], [214, 140, 45], [168, 60, 38], [220, 170, 60]];

async function loadMatugenColors() {
  try {
    const res = await fetch('file:///home/sakib/.config/matugen/matugen-colors.css');
    if (res.ok) {
      const cssText = await res.text();
      const styleTag = document.createElement('style');
      styleTag.textContent = cssText;
      document.head.appendChild(styleTag);
    }
  } catch (e) {}
  applyTheme();
}

function applyTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary];
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;

  leaves.forEach((l, i) => {
    const autumnBase = AUTUMN_TONES[i % AUTUMN_TONES.length];
    l.color = blendColor(autumnBase, roleList[i % roleList.length], 0.3);
  });
}

let leaves = [];
let pile = [];
const PILE_RES = 70;

function spawnLeaf(l) {
  l.x = Math.random() * W * 1.15 - W * 0.075;
  l.y = -20 - Math.random() * 120;
  l.size = 9 + Math.random() * 9;
  l.fallSpeed = 24 + Math.random() * 26;
  l.swayAmp = 40 + Math.random() * 60;
  l.swayFreq = 0.5 + Math.random() * 0.7;
  l.phase = Math.random() * Math.PI * 2;
  l.rot = Math.random() * Math.PI * 2;
  l.rotSpeed = (Math.random() - 0.5) * 3.2;
  l.rotWobble = 0.5 + Math.random() * 1.5;
  const autumnBase = AUTUMN_TONES[Math.floor(Math.random() * AUTUMN_TONES.length)];
  l.color = blendColor(autumnBase, roleList[Math.floor(Math.random() * roleList.length)] || [200, 130, 60], 0.3);
}

function initLeaves() {
  leaves = [];
  pile = new Array(PILE_RES).fill(0);
  for (let i = 0; i < 55; i++) {
    const l = {};
    spawnLeaf(l);
    l.y = Math.random() * H;
    leaves.push(l);
  }
}

function drawLeaf(l) {
  ctx.save();
  ctx.translate(l.x, l.y);
  ctx.rotate(l.rot);
  ctx.beginPath();
  ctx.moveTo(0, -l.size);
  ctx.bezierCurveTo(l.size * 1.1, -l.size * 0.4, l.size * 0.8, l.size * 0.6, 0, l.size);
  ctx.bezierCurveTo(-l.size * 0.8, l.size * 0.6, -l.size * 1.1, -l.size * 0.4, 0, -l.size);
  ctx.closePath();
  ctx.fillStyle = rgba(l.color, 0.85);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, -l.size * 0.9);
  ctx.lineTo(0, l.size * 0.9);
  ctx.strokeStyle = rgba(l.color.map(v => v * 0.6), 0.6);
  ctx.lineWidth = 0.8;
  ctx.stroke();
  ctx.restore();
}

function pileIndex(x) { return Math.max(0, Math.min(PILE_RES - 1, Math.floor((x / W) * PILE_RES))); }

let start = performance.now();
let lastT = 0;
let lastPileReset = 0;
let nextGust = 3 + Math.random() * 5;
let gustStrength = 0;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  if (t - lastPileReset > 150) {
    pile = new Array(PILE_RES).fill(0);
    lastPileReset = t;
  }
  if (t >= nextGust) {
    gustStrength = 70 + Math.random() * 90;
    nextGust = t + 5 + Math.random() * 8;
  }
  gustStrength *= 0.95;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const surf = theme.surface || [12, 20, 27];
  ctx.fillStyle = `rgb(${surf.join(',')})`;
  ctx.fillRect(0, 0, W, H);

  // Draw bottom leaf pile
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i < PILE_RES; i++) {
    const x = (i / (PILE_RES - 1)) * W;
    ctx.lineTo(x, H - pile[i]);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = rgba(theme.tertiaryContainer || [58, 68, 114], 0.55);
  ctx.fill();

  for (const l of leaves) {
    l.y += l.fallSpeed * dt * speedMul;
    l.x += (Math.sin(t * l.swayFreq + l.phase) * l.swayAmp * 0.4 + gustStrength) * dt * speedMul;
    l.rot += l.rotSpeed * dt * speedMul * (0.6 + Math.sin(t * l.rotWobble + l.phase) * 0.4);

    const idx = pileIndex(l.x);
    const floorY = H - (pile[idx] || 0);
    if (l.y >= floorY) {
      pile[idx] = Math.min(H * 0.12, (pile[idx] || 0) + 0.6);
      spawnLeaf(l);
      continue;
    }
    if (l.x > W + 40 || l.x < -40) spawnLeaf(l);
    drawLeaf(l);
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});
hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', async () => {
  initLeaves();
  await loadMatugenColors();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
