<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver</title>
<style>
  :root {
    /* fallback palette — overridden by the matugen stylesheet below if it loads */
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_rgb: 219 227 237;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: rgb(var(--surface_rgb));
    cursor: none;
  }
  canvas {
    display: block;
    width: 100vw;
    height: 100vh;
  }
  #clock {
    position: fixed;
    left: 32px;
    bottom: 28px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-weight: 400;
    font-variant-numeric: tabular-nums;
    letter-spacing: 0.5px;
    color: rgb(var(--primary_rgb) / 0.92);
    font-size: clamp(28px, 4vw, 56px);
    text-shadow: 0 0 24px rgba(0,0,0,0.4);
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #clock .ampm {
    font-size: 0.36em;
    margin-left: 6px;
    opacity: 0.82;
    vertical-align: middle;
  }
  #date {
    position: fixed;
    left: 34px;
    bottom: 14px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: clamp(12px, 1.2vw, 16px);
    letter-spacing: 1.5px;
    text-transform: uppercase;
    color: rgb(var(--secondary_rgb) / 0.85);
    pointer-events: none;
    transition: opacity 0.6s ease;
  }
  #hint {
    position: fixed;
    right: 28px;
    bottom: 26px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 13px;
    letter-spacing: 0.5px;
    color: rgb(var(--outline_rgb) / 0.9);
    pointer-events: none;
    opacity: 0;
    transition: opacity 0.8s ease;
  }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.12 : 1;

// ---- read matugen theme from computed CSS custom properties ----
function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}

let theme = {};
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'),
    surfaceBright: readRGB('--surface_bright_rgb'),
    primary: readRGB('--primary_rgb'),
    primaryContainer: readRGB('--primary_container_rgb'),
    secondary: readRGB('--secondary_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'),
    tertiary: readRGB('--tertiary_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'),
    inversePrimary: readRGB('--inverse_primary_rgb'),
    outline: readRGB('--outline_rgb'),
  };
  // set text colors directly in JS — sidesteps browsers that don't parse
  // the CSS Color 4 rgb(r g b / a) slash syntax used in the stylesheet
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

function rgba(rgb, a) {
  return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`;
}

const EASE = t => t < 0.5 ? 2 * t * t : 1 - Math.pow(-2 * t + 2, 2) / 2;

// ---- Blob definition, mapped to matugen roles instead of a rotating hue ----
function makeBlob(opts) {
  const points = 7 + Math.floor(Math.random() * 3);
  const phases = Array.from({ length: points }, () => Math.random() * Math.PI * 2);
  const freqs = Array.from({ length: points }, () => 0.15 + Math.random() * 0.25);
  return {
    ...opts,
    points,
    phases,
    freqs,
    orbitPhase: Math.random() * Math.PI * 2,
    orbitFreqX: 0.02 + Math.random() * 0.03,
    orbitFreqY: 0.017 + Math.random() * 0.03,
    orbitAmpX: 0.14 + Math.random() * 0.12,
    orbitAmpY: 0.14 + Math.random() * 0.12,
  };
}

const roleDefs = [
  { role: 'primary',            r: 0.30 },
  { role: 'primaryContainer',   r: 0.26 },
  { role: 'secondary',          r: 0.24 },
  { role: 'secondaryContainer', r: 0.20 },
  { role: 'tertiary',           r: 0.22 },
  { role: 'tertiaryContainer',  r: 0.18 },
  { role: 'inversePrimary',     r: 0.15 },
];

const blobs = roleDefs.map((def, i) => makeBlob({
  role: def.role,
  baseR: def.r,
  cx: 0.15 + Math.random() * 0.7,
  cy: 0.15 + Math.random() * 0.7,
  seed: i * 13.7,
}));

function drawBlob(blob, t) {
  const cx = (blob.cx + Math.sin(t * blob.orbitFreqX + blob.orbitPhase) * blob.orbitAmpX) * W;
  const cy = (blob.cy + Math.cos(t * blob.orbitFreqY + blob.orbitPhase * 1.3) * blob.orbitAmpY) * H;
  const baseR = blob.baseR * Math.min(W, H);

  const pts = [];
  for (let i = 0; i < blob.points; i++) {
    const angle = (i / blob.points) * Math.PI * 2;
    const wob = 1 + 0.22 * Math.sin(t * blob.freqs[i] + blob.phases[i]);
    const rad = baseR * wob;
    pts.push([cx + Math.cos(angle) * rad, cy + Math.sin(angle) * rad]);
  }

  ctx.beginPath();
  const mid0 = [(pts[0][0] + pts[pts.length - 1][0]) / 2, (pts[0][1] + pts[pts.length - 1][1]) / 2];
  ctx.moveTo(mid0[0], mid0[1]);
  for (let i = 0; i < pts.length; i++) {
    const next = pts[(i + 1) % pts.length];
    const mid = [(pts[i][0] + next[0]) / 2, (pts[i][1] + next[1]) / 2];
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mid[0], mid[1]);
  }
  ctx.closePath();

  const rgb = theme[blob.role] || [200, 200, 200];
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 1.35);
  grad.addColorStop(0, rgba(rgb, 0.85));
  grad.addColorStop(0.65, rgba(rgb, 0.4));
  grad.addColorStop(1, rgba(rgb, 0));
  ctx.fillStyle = grad;
  ctx.fill();
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  const breathe = (Math.sin(t * 0.05) + 1) / 2;
  const bg = theme.surface || [23, 17, 26];
  const bgBright = theme.surfaceBright || bg;
  const bgMix = bg.map((c, i) => Math.round(c + (bgBright[i] - c) * breathe * 0.15));

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgb(${bgMix[0]}, ${bgMix[1]}, ${bgMix[2]})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'screen';
  for (const blob of blobs) drawBlob(blob, t);
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}

// ---- Clock ----
startClock(clockEl, dateEl);

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
