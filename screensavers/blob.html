<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Ambient Screensaver</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_rgb: 219 227 237;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    cursor: none;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  /* Sharp, distinct liquid blend instead of dynamic smudge */
  #canvas-container {
    position: absolute; inset: 0;
    filter: blur(12px) saturate(115%);
  }
  canvas { display: block; width: 100%; height: 100%; }

  /* Subtle noise to prevent color banding without looking fuzzy */
  #grain {
    position: fixed; inset: 0;
    pointer-events: none; z-index: 2;
    opacity: 0.012;
    mix-blend-mode: overlay;
  }

  /* Sleek, clean UI overlay */
  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.8s ease;
  }
  #ui-container.hidden { opacity: 0; }

  .glass-panel {
  background: radial-gradient(circle at center, rgba(12, 20, 27, 0.5) 0%, rgba(12, 20, 27, 0) 75%);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border: none;
  border-radius: 0;
  padding: 24px 36px;
  width: fit-content;
  box-shadow: none;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
  }

  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<div id="canvas-container">
  <canvas id="c"></canvas>
</div>
<canvas id="grain"></canvas>

<div id="ui-container">
  <div class="glass-panel">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint" class="glass-panel">Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const grainCanvas = document.getElementById('grain');
const grainCtx = grainCanvas.getContext('2d');

const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  grainCanvas.width = W * 0.25;
  grainCanvas.height = H * 0.25;
  generateGrain();
}
window.addEventListener('resize', resize);

function generateGrain() {
  const w = grainCanvas.width, h = grainCanvas.height;
  if (w === 0 || h === 0) return;
  const imgData = grainCtx.createImageData(w, h);
  const buf = new Uint32Array(imgData.data.buffer);
  for (let i = 0; i < buf.length; i++) {
    const v = (Math.random() * 255) | 0;
    buf[i] = (255 << 24) | (v << 16) | (v << 8) | v;
  }
  grainCtx.putImageData(imgData, 0, 0);
}

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.12 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : [200, 200, 200];
}

function rgba(rgb, a) {
  return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`;
}

let theme = {};
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'),
    surfaceBright: readRGB('--surface_bright_rgb'),
    primary: readRGB('--primary_rgb'),
    primaryContainer: readRGB('--primary_container_rgb'),
    secondary: readRGB('--secondary_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'),
    tertiary: readRGB('--tertiary_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'),
    inversePrimary: readRGB('--inverse_primary_rgb'),
    outline: readRGB('--outline_rgb'),
  };
  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

function makeBlob(opts) {
  const points = 7 + Math.floor(Math.random() * 3);
  const phases = Array.from({ length: points }, () => Math.random() * Math.PI * 2);
  const freqs = Array.from({ length: points }, () => 0.15 + Math.random() * 0.2);
  return {
    ...opts,
    points,
    phases,
    freqs,
    orbitPhase: Math.random() * Math.PI * 2,
    orbitFreqX: 0.015 + Math.random() * 0.02,
    orbitFreqY: 0.012 + Math.random() * 0.02,
    orbitAmpX: 0.16 + Math.random() * 0.12,
    orbitAmpY: 0.16 + Math.random() * 0.12,
  };
}

const roleDefs = [
  { role: 'primary',           r: 0.26 },
  { role: 'primaryContainer',   r: 0.22 },
  { role: 'secondary',         r: 0.20 },
  { role: 'secondaryContainer', r: 0.18 },
  { role: 'tertiary',           r: 0.19 },
  { role: 'tertiaryContainer',  r: 0.16 },
];

const blobs = roleDefs.map((def, i) => makeBlob({
  role: def.role,
  baseR: def.r,
  cx: 0.25 + Math.random() * 0.5,
  cy: 0.25 + Math.random() * 0.5,
  seed: i * 13.7,
}));

function drawBlob(blob, t) {
  const cx = (blob.cx + Math.sin(t * blob.orbitFreqX + blob.orbitPhase) * blob.orbitAmpX) * W;
  const cy = (blob.cy + Math.cos(t * blob.orbitFreqY + blob.orbitPhase * 1.3) * blob.orbitAmpY) * H;
  const baseR = blob.baseR * Math.min(W, H);

  const pts = [];
  for (let i = 0; i < blob.points; i++) {
    const angle = (i / blob.points) * Math.PI * 2;
    const wob = 1 + 0.2 * Math.sin(t * blob.freqs[i] + blob.phases[i]);
    const rad = baseR * wob;
    pts.push([cx + Math.cos(angle) * rad, cy + Math.sin(angle) * rad]);
  }

  ctx.beginPath();
  const mid0 = [(pts[0][0] + pts[pts.length - 1][0]) / 2, (pts[0][1] + pts[pts.length - 1][1]) / 2];
  ctx.moveTo(mid0[0], mid0[1]);
  for (let i = 0; i < pts.length; i++) {
    const next = pts[(i + 1) % pts.length];
    const mid = [(pts[i][0] + next[0]) / 2, (pts[i][1] + next[1]) / 2];
    ctx.quadraticCurveTo(pts[i][0], pts[i][1], mid[0], mid[1]);
  }
  ctx.closePath();

  const rgb = theme[blob.role] || [200, 200, 200];
  const grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, baseR * 1.2);
  grad.addColorStop(0, rgba(rgb, 0.75));
  grad.addColorStop(0.7, rgba(rgb, 0.25));
  grad.addColorStop(1, rgba(rgb, 0));
  ctx.fillStyle = grad;
  ctx.fill();
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  const bg = theme.surface || [12, 20, 27];

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = `rgb(${bg[0]}, ${bg[1]}, ${bg[2]})`;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'screen';
  for (const blob of blobs) drawBlob(blob, t);
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}

if (typeof startClock === 'function') {
  startClock(clockEl, dateEl);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  loadTheme();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
