<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Bounce</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233; --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250; --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 12 20 27; --outline_rgb: 137 146 154;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock { position: fixed; left: 32px; bottom: 28px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; font-size: clamp(28px,4vw,56px); text-shadow: 0 0 24px rgba(0,0,0,0.4); pointer-events: none; transition: opacity 0.6s ease; }
  #clock .ampm { font-size: 0.36em; margin-left: 6px; opacity: 0.82; vertical-align: middle; }
  #date { position: fixed; left: 34px; bottom: 14px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: clamp(12px,1.2vw,16px); letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; transition: opacity 0.6s ease; }
  #hint { position: fixed; right: 28px; bottom: 26px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: 13px; letter-spacing: 0.5px; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>
<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgb(12,20,27)';
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.3 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'), primary: readRGB('--primary_rgb'), secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'), primaryContainer: readRGB('--primary_container_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'), tertiaryContainer: readRGB('--tertiary_container_rgb'),
    inversePrimary: readRGB('--inverse_primary_rgb'), outline: readRGB('--outline_rgb'),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer, theme.inversePrimary];
  logo.color = roleList[0];
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

const logo = { x: 200, y: 150, vx: 140, vy: 100, size: 46, color: [200, 200, 200], squishX: 1, squishY: 1 };
let trail = [];
let bursts = [];

function pickNewColor() {
  let next;
  do { next = roleList[Math.floor(Math.random() * roleList.length)]; } while (next === logo.color && roleList.length > 1);
  logo.color = next;
}

function spawnBurst(x, y, color) {
  for (let i = 0; i < 24; i++) {
    const angle = (i / 24) * Math.PI * 2;
    const speed = 80 + Math.random() * 60;
    bursts.push({
      x, y, vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
      life: 0, maxLife: 0.7, color,
    });
  }
}

function drawLogoShape(x, y, size, color, alpha, sX = 1, sY = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sX, sY);
  ctx.beginPath();
  const r = size * 0.32;
  const half = size / 2;
  ctx.moveTo(-half + r, -half);
  ctx.arcTo(half, -half, half, half, r);
  ctx.arcTo(half, half, -half, half, r);
  ctx.arcTo(-half, half, -half, -half, r);
  ctx.arcTo(-half, -half, half, -half, r);
  ctx.closePath();
  ctx.fillStyle = rgba(color, alpha);
  ctx.fill();
  ctx.restore();
}

let start = performance.now();
let lastT = 0;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgb(${(theme.surface || [12, 20, 27]).join(',')})`;
  ctx.fillRect(0, 0, W, H);

  logo.x += logo.vx * dt;
  logo.y += logo.vy * dt;

  // spring recovery back to normal aspect ratio after an impact squish
  logo.squishX += (1 - logo.squishX) * 12 * dt;
  logo.squishY += (1 - logo.squishY) * 12 * dt;

  let hitX = false, hitY = false;
  const half = logo.size / 2;
  if (logo.x - half <= 0) { logo.x = half; logo.vx *= -1; hitX = true; logo.squishX = 0.75; logo.squishY = 1.25; }
  if (logo.x + half >= W) { logo.x = W - half; logo.vx *= -1; hitX = true; logo.squishX = 0.75; logo.squishY = 1.25; }
  if (logo.y - half <= 0) { logo.y = half; logo.vy *= -1; hitY = true; logo.squishX = 1.25; logo.squishY = 0.75; }
  if (logo.y + half >= H) { logo.y = H - half; logo.vy *= -1; hitY = true; logo.squishX = 1.25; logo.squishY = 0.75; }

  if (hitX || hitY) {
    pickNewColor();
    if (hitX && hitY) spawnBurst(logo.x, logo.y, logo.color); // the classic corner-hit moment
  }

  trail.push({ x: logo.x, y: logo.y, color: logo.color, sX: logo.squishX, sY: logo.squishY });
  if (trail.length > 14) trail.shift();

  trail.forEach((p, i) => {
    const a = (i / trail.length) * 0.3;
    drawLogoShape(p.x, p.y, logo.size * (0.7 + (i / trail.length) * 0.3), p.color, a, p.sX, p.sY);
  });
  drawLogoShape(logo.x, logo.y, logo.size, logo.color, 0.9, logo.squishX, logo.squishY);

  bursts = bursts.filter(b => {
    b.life += dt;
    if (b.life >= b.maxLife) return false;
    b.x += b.vx * dt; b.y += b.vy * dt;
    b.vx *= 0.94; b.vy *= 0.94;
    const fade = 1 - b.life / b.maxLife;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = rgba(b.color, fade * 0.8);
    ctx.fill();
    return true;
  });

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});
hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
