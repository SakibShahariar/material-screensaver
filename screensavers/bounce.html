<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Bounce</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --primary_container_rgb: 0 75 111;
  --secondary_rgb: 180 199 233;
  --secondary_container_rgb: 53 72 99;
  --tertiary_rgb: 186 196 250;
  --tertiary_container_rgb: 58 68 114;
  --inverse_primary_rgb: 0 100 145;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock {
  position: fixed;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(40px, 4.5vw, 56px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 40px rgb(var(--primary_rgb) / .4),
    0 2px 16px rgba(0,0,0,.6);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .7;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  position: fixed;
  left: clamp(30px, 3.1vw, 50px);
  bottom: clamp(18px, 2.2vw, 28px);
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 10px rgba(0,0,0,.5);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock.hidden, #date.hidden { opacity: 0; }

#hint {
  position: fixed; right: 28px; bottom: 24px;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00<span class="ampm">AM</span></div>
<div id="date">MON, JAN 1</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");

let W = 0, H = 0, DPR = 1;
let theme = {};
let roleList = [];
let trail = [];
let bursts = [];
let start = performance.now();
let lastT = 0;
let cursorTimer;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.35 : 0.9;

const logo = {
  x: 220, y: 160,
  vx: 150, vy: 110,
  size: 54,
  color: [180, 180, 180],
  squishX: 1, squishY: 1
};

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:            readRGB("--surface_rgb", [12, 20, 27]),
    primary:            readRGB("--primary_rgb", [138, 206, 255]),
    secondary:          readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:           readRGB("--tertiary_rgb", [186, 196, 250]),
    primaryContainer:   readRGB("--primary_container_rgb", [0, 75, 111]),
    secondaryContainer: readRGB("--secondary_container_rgb", [53, 72, 99]),
    tertiaryContainer:  readRGB("--tertiary_container_rgb", [58, 68, 114]),
    inversePrimary:     readRGB("--inverse_primary_rgb", [0, 100, 145]),
    outline:            readRGB("--outline_rgb", [137, 146, 154])
  };

  roleList = [
    theme.primary,
    theme.secondary,
    theme.tertiary,
    theme.primaryContainer,
    theme.secondaryContainer,
    theme.tertiaryContainer,
    theme.inversePrimary
  ];

  logo.color = roleList[0];
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.97);
  dateEl.style.color  = rgba(theme.secondary, 0.88);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });

function pickNewColor() {
  let next;
  do {
    next = roleList[Math.floor(Math.random() * roleList.length)];
  } while (next === logo.color && roleList.length > 1);
  logo.color = next;
}

function spawnBurst(x, y, color) {
  for (let i = 0; i < 20; i++) {
    const angle = (i / 20) * Math.PI * 2 + Math.random() * 0.25;
    const speed = 70 + Math.random() * 80;
    bursts.push({
      x, y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      life: 0,
      maxLife: 0.6 + Math.random() * 0.3,
      color
    });
  }
}

function drawLogoShape(x, y, size, color, alpha, sX = 1, sY = 1) {
  ctx.save();
  ctx.translate(x, y);
  ctx.scale(sX, sY);

  const half = size / 2;
  const r = size * 0.3;

  ctx.beginPath();
  ctx.moveTo(-half + r, -half);
  ctx.arcTo( half, -half,  half,  half, r);
  ctx.arcTo( half,  half, -half,  half, r);
  ctx.arcTo(-half,  half, -half, -half, r);
  ctx.arcTo(-half, -half,  half, -half, r);
  ctx.closePath();

  ctx.shadowColor = rgba(color, 0.4);
  ctx.shadowBlur = 16;
  ctx.fillStyle = rgba(color, alpha);
  ctx.fill();
  ctx.shadowBlur = 0;

  ctx.restore();
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT || 0.016);
  lastT = t;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  logo.x += logo.vx * dt;
  logo.y += logo.vy * dt;

  // Squish recovery
  logo.squishX += (1 - logo.squishX) * 10 * dt;
  logo.squishY += (1 - logo.squishY) * 10 * dt;

  const half = logo.size / 2;
  let hitX = false, hitY = false;

  if (logo.x - half <= 0) {
    logo.x = half;
    logo.vx = Math.abs(logo.vx);
    hitX = true;
    logo.squishX = 0.7;
    logo.squishY = 1.3;
  } else if (logo.x + half >= W) {
    logo.x = W - half;
    logo.vx = -Math.abs(logo.vx);
    hitX = true;
    logo.squishX = 0.7;
    logo.squishY = 1.3;
  }

  if (logo.y - half <= 0) {
    logo.y = half;
    logo.vy = Math.abs(logo.vy);
    hitY = true;
    logo.squishX = 1.3;
    logo.squishY = 0.7;
  } else if (logo.y + half >= H) {
    logo.y = H - half;
    logo.vy = -Math.abs(logo.vy);
    hitY = true;
    logo.squishX = 1.3;
    logo.squishY = 0.7;
  }

  if (hitX || hitY) {
    pickNewColor();
    if (hitX && hitY) spawnBurst(logo.x, logo.y, logo.color);
  }

  // Trail
  trail.push({
    x: logo.x, y: logo.y,
    color: logo.color,
    sX: logo.squishX, sY: logo.squishY
  });
  if (trail.length > 15) trail.shift();

  trail.forEach((p, i) => {
    const a = (i / trail.length) * 0.26;
    const s = logo.size * (0.65 + (i / trail.length) * 0.35);
    drawLogoShape(p.x, p.y, s, p.color, a, p.sX, p.sY);
  });

  drawLogoShape(logo.x, logo.y, logo.size, logo.color, 0.92, logo.squishX, logo.squishY);

  // Corner bursts
  bursts = bursts.filter(b => {
    b.life += dt;
    if (b.life >= b.maxLife) return false;
    b.x += b.vx * dt;
    b.y += b.vy * dt;
    b.vx *= 0.93;
    b.vy *= 0.93;
    const fade = 1 - b.life / b.maxLife;
    ctx.beginPath();
    ctx.arc(b.x, b.y, 2 + fade * 1.4, 0, Math.PI * 2);
    ctx.fillStyle = rgba(b.color, fade * 0.75);
    ctx.fill();
    return true;
  });

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockEl.classList.toggle("hidden");
    dateEl.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();
  logo.x = W * 0.35;
  logo.y = H * 0.3;

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
