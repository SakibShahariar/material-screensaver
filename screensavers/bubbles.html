<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Bubbles</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --primary_container_rgb: 0 75 111;
  --secondary_rgb: 180 199 233;
  --secondary_container_rgb: 53 72 99;
  --tertiary_rgb: 186 196 250;
  --tertiary_container_rgb: 58 68 114;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock {
  position: fixed;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(40px, 4.5vw, 56px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 40px rgb(var(--primary_rgb) / .4),
    0 2px 16px rgba(0,0,0,.6);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .7;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  position: fixed;
  left: clamp(30px, 3.1vw, 50px);
  bottom: clamp(18px, 2.2vw, 28px);
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 10px rgba(0,0,0,.5);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock.hidden, #date.hidden { opacity: 0; }

#hint {
  position: fixed; right: 28px; bottom: 24px;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00<span class="ampm">AM</span></div>
<div id="date">MON, JAN 1</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");

let W = 0, H = 0, DPR = 1;
let theme = {};
let roleList = [];
let bubbles = [];
let start = performance.now();
let lastT = 0;
let cursorTimer;

const BUBBLE_COUNT = 32;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.28 : 0.85;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:            readRGB("--surface_rgb", [12, 20, 27]),
    primary:            readRGB("--primary_rgb", [138, 206, 255]),
    secondary:          readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:           readRGB("--tertiary_rgb", [186, 196, 250]),
    primaryContainer:   readRGB("--primary_container_rgb", [0, 75, 111]),
    secondaryContainer: readRGB("--secondary_container_rgb", [53, 72, 99]),
    tertiaryContainer:  readRGB("--tertiary_container_rgb", [58, 68, 114]),
    outline:            readRGB("--outline_rgb", [137, 146, 154])
  };

  roleList = [
    theme.primary,
    theme.secondary,
    theme.tertiary,
    theme.primaryContainer,
    theme.secondaryContainer,
    theme.tertiaryContainer
  ];

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.97);
  dateEl.style.color  = rgba(theme.secondary, 0.88);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });

function spawnBubble(b, fromBottom = true) {
  b.x = Math.random() * W;
  b.y = fromBottom ? (H + 25 + Math.random() * 50) : Math.random() * H;
  b.r = 5 + Math.random() * 30;
  b.riseSpeed = 15 + Math.random() * 26;
  b.wobbleAmp = 6 + Math.random() * 16;
  b.wobbleFreq = 0.32 + Math.random() * 0.55;
  b.phase = Math.random() * Math.PI * 2;
  b.color = roleList[Math.floor(Math.random() * roleList.length)] || [180, 200, 220];
  b.popAtY = H * (0.03 + Math.random() * 0.48);
  b.popping = false;
  b.popT = 0;
}

function initBubbles() {
  bubbles = [];
  for (let i = 0; i < BUBBLE_COUNT; i++) {
    const b = {};
    spawnBubble(b, false);
    bubbles.push(b);
  }
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT || 0.016);
  lastT = t;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  for (const b of bubbles) {
    if (b.popping) {
      b.popT += dt * 3.6;
      if (b.popT >= 1) {
        spawnBubble(b, true);
        continue;
      }
      const popR = b.r * (1 + b.popT * 0.75);
      const popAlpha = (1 - b.popT) * 0.5;
      ctx.beginPath();
      ctx.arc(b.x, b.y, popR, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(b.color, popAlpha);
      ctx.lineWidth = 1.3;
      ctx.stroke();
      continue;
    }

    b.y -= b.riseSpeed * dt;
    b.x += Math.sin(t * b.wobbleFreq + b.phase) * b.wobbleAmp * dt * 2.6;

    if (b.x < -b.r) b.x = W + b.r;
    if (b.x > W + b.r) b.x = -b.r;

    if (b.y <= b.popAtY) {
      b.popping = true;
      b.popT = 0;
      continue;
    }
    if (b.y < -55) {
      spawnBubble(b, true);
      continue;
    }

    // Glass body
    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(
      b.x - b.r * 0.34, b.y - b.r * 0.34, b.r * 0.06,
      b.x, b.y, b.r
    );
    grad.addColorStop(0, rgba(b.color, 0.03));
    grad.addColorStop(0.5, rgba(b.color, 0.1));
    grad.addColorStop(0.82, rgba(b.color, 0.26));
    grad.addColorStop(1, rgba(b.color, 0.4));
    ctx.fillStyle = grad;
    ctx.fill();

    // Rim
    ctx.strokeStyle = rgba(b.color, 0.42);
    ctx.lineWidth = 1.1;
    ctx.stroke();

    // Specular highlight
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.33, b.y - b.r * 0.35, b.r * 0.2, 0, Math.PI * 2);
    ctx.fillStyle = "rgba(255,255,255,0.45)";
    ctx.fill();
  }

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockEl.classList.toggle("hidden");
    dateEl.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();
  initBubbles();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
