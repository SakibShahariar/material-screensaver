<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Bubbles</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none;
  }
  body.show-cursor { cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock {
    position: fixed; left: 32px; bottom: 28px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
    font-size: clamp(28px, 4vw, 56px);
    text-shadow: 0 0 24px rgba(0,0,0,0.4);
    pointer-events: none; transition: opacity 0.6s ease;
  }
  #clock .ampm {
    font-size: 0.36em;
    margin-left: 6px;
    opacity: 0.82;
    vertical-align: middle;
  }
  #date {
    position: fixed; left: 34px; bottom: 14px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: clamp(12px, 1.2vw, 16px); letter-spacing: 1.5px; text-transform: uppercase;
    pointer-events: none; transition: opacity 0.6s ease;
  }
  #hint {
    position: fixed; right: 28px; bottom: 26px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 13px; letter-spacing: 0.5px;
    pointer-events: none; opacity: 0; transition: opacity 0.8s ease;
  }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let cursorTimeout;
window.addEventListener('pointermove', () => {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
});

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.25 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return fallback;
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];

async function loadMatugenColors() {
  try {
    const res = await fetch('file:///home/sakib/.config/matugen/matugen-colors.css');
    if (res.ok) {
      const cssText = await res.text();
      const styleTag = document.createElement('style');
      styleTag.textContent = cssText;
      document.head.appendChild(styleTag);
    }
  } catch (e) {}
  applyTheme();
}

function applyTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    secondaryContainer: readRGB('--secondary_container_rgb', [53, 72, 99]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer];
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;
}

let bubbles = [];

function spawnBubble(b) {
  b.x = Math.random() * W;
  b.y = H + 20;
  b.r = 6 + Math.random() * 26;
  b.riseSpeed = 18 + Math.random() * 26;
  b.wobbleAmp = 8 + Math.random() * 18;
  b.wobbleFreq = 0.4 + Math.random() * 0.6;
  b.phase = Math.random() * Math.PI * 2;
  b.color = roleList.length ? roleList[Math.floor(Math.random() * roleList.length)] : [200, 200, 200];
  b.popAtY = H * (0.05 + Math.random() * 0.55);
  b.popping = false;
  b.popT = 0;
}

function initBubbles() {
  bubbles = [];
  for (let i = 0; i < 26; i++) {
    const b = {};
    spawnBubble(b);
    b.y = Math.random() * H;
    bubbles.push(b);
  }
}

let start = performance.now();
let lastT = 0;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const surf = theme.surface || [12, 20, 27];
  ctx.fillStyle = `rgb(${surf.join(',')})`;
  ctx.fillRect(0, 0, W, H);

  for (const b of bubbles) {
    if (b.popping) {
      b.popT += dt * 4 * speedMul;
      if (b.popT >= 1) { spawnBubble(b); continue; }
      const popR = b.r * (1 + b.popT * 0.6);
      const popAlpha = (1 - b.popT) * 0.6;
      ctx.beginPath();
      ctx.arc(b.x, b.y, popR, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(b.color, popAlpha);
      ctx.lineWidth = 1.5;
      ctx.stroke();
      continue;
    }

    b.y -= b.riseSpeed * dt * speedMul;
    const x = b.x + Math.sin(t * b.wobbleFreq + b.phase) * b.wobbleAmp * dt * 3 * speedMul;
    b.x = x;

    if (b.y <= b.popAtY) { b.popping = true; b.popT = 0; continue; }
    if (b.y < -40) { spawnBubble(b); continue; }

    ctx.beginPath();
    ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(b.x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.1, b.x, b.y, b.r);
    grad.addColorStop(0, rgba(b.color, 0.05));
    grad.addColorStop(0.7, rgba(b.color, 0.16));
    grad.addColorStop(1, rgba(b.color, 0.4));
    ctx.fillStyle = grad;
    ctx.fill();
    ctx.strokeStyle = rgba(b.color, 0.5);
    ctx.lineWidth = 1;
    ctx.stroke();

    // specular glint
    ctx.beginPath();
    ctx.arc(b.x - b.r * 0.35, b.y - b.r * 0.35, b.r * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,255,255,0.5)';
    ctx.fill();
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', async () => {
  await loadMatugenColors();
  initBubbles();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
