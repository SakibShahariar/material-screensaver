<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Bubbles</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27;
    --outline_rgb: 137 146 154;
    --on_surface_variant_rgb: 191 199 209;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    cursor: default;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* Glassmorphism UI Container */
  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.8s ease;
  }
  #ui-container.hidden { opacity: 0; }

  .glass-panel {
  background: radial-gradient(circle at center, rgba(12, 20, 27, 0.5) 0%, rgba(12, 20, 27, 0) 75%);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border: none;
  border-radius: 0;
  padding: 24px 36px;
  width: fit-content;
  box-shadow: none;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
  }

  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-container">
  <div class="glass-panel">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint" class="glass-panel">Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.25 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'),
    primary: readRGB('--primary_rgb'),
    secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'),
    primaryContainer: readRGB('--primary_container_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'),
    outline: readRGB('--outline_rgb'),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer];
  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

// Mouse Interaction
const mouse = { x: -1000, y: -1000, active: false };
window.addEventListener('mousemove', (e) => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
window.addEventListener('mouseleave', () => { mouse.active = false; });

let bubbles = [];
let droplets = [];

function spawnBubble(b) {
  b.x = Math.random() * W;
  b.y = H + 30;
  b.r = 12 + Math.random() * 32;
  b.vx = 0;
  b.vy = -(14 + Math.random() * 22);
  b.wobbleAmp = 12 + Math.random() * 18;
  b.wobbleFreq = 0.5 + Math.random() * 0.7;
  b.phase = Math.random() * Math.PI * 2;
  b.squishX = 1;
  b.squishY = 1;
  b.color = roleList.length ? roleList[Math.floor(Math.random() * roleList.length)] : [200, 200, 200];
  b.popAtY = H * (0.08 + Math.random() * 0.5);
}

function popBubble(b) {
  const count = 6 + Math.floor(b.r * 0.3);
  for (let i = 0; i < count; i++) {
    const angle = (i / count) * Math.PI * 2 + Math.random() * 0.5;
    const speed = 20 + Math.random() * 60;
    droplets.push({
      x: b.x,
      y: b.y,
      vx: Math.cos(angle) * speed,
      vy: Math.sin(angle) * speed,
      r: 1.2 + Math.random() * 2,
      color: b.color,
      life: 1.0,
      decay: 1.8 + Math.random() * 1.5
    });
  }
  spawnBubble(b);
}

function initBubbles() {
  bubbles = [];
  droplets = [];
  for (let i = 0; i < 30; i++) {
    const b = {};
    spawnBubble(b);
    b.y = Math.random() * H;
    bubbles.push(b);
  }
}

let start = performance.now();
let lastT = 0;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgb(${(theme.surface || [12, 20, 27]).join(',')})`;
  ctx.fillRect(0, 0, W, H);

  // Update & Draw Droplets (Pop particles)
  for (let i = droplets.length - 1; i >= 0; i--) {
    const d = droplets[i];
    d.x += d.vx * dt;
    d.y += d.vy * dt;
    d.vy += 120 * dt; // Gravity
    d.life -= d.decay * dt;

    if (d.life <= 0) {
      droplets.splice(i, 1);
      continue;
    }

    ctx.beginPath();
    ctx.arc(d.x, d.y, d.r, 0, Math.PI * 2);
    ctx.fillStyle = rgba(d.color, d.life * 0.8);
    ctx.fill();
  }

  // Update & Draw Bubbles
  for (const b of bubbles) {
    // Upward motion & wobble
    b.y += b.vy * dt;
    const wobble = Math.sin(t * b.wobbleFreq + b.phase);
    b.x += wobble * b.wobbleAmp * dt;

    // Mouse Repulsion Physics
    if (mouse.active) {
      const dx = b.x - mouse.x;
      const dy = b.y - mouse.y;
      const dist = Math.hypot(dx, dy);
      const minDist = b.r + 80;
      if (dist < minDist && dist > 0) {
        const force = (1 - dist / minDist) * 180;
        b.x += (dx / dist) * force * dt;
        b.y += (dy / dist) * force * dt;
        b.squishX = 1.2;
        b.squishY = 0.8;
      }
    }

    // Recover natural shape after squish
    b.squishX += (1 - b.squishX) * 0.1;
    b.squishY += (1 - b.squishY) * 0.1;

    // Pop conditions
    if (b.y <= b.popAtY || b.y < -40) {
      popBubble(b);
      continue;
    }

    ctx.save();
    ctx.translate(b.x, b.y);
    ctx.scale(b.squishX, b.squishY);

    // 1. Base Gradient Shell
    ctx.beginPath();
    ctx.arc(0, 0, b.r, 0, Math.PI * 2);
    const grad = ctx.createRadialGradient(-b.r * 0.3, -b.r * 0.3, b.r * 0.1, 0, 0, b.r);
    grad.addColorStop(0, rgba(b.color, 0.04));
    grad.addColorStop(0.7, rgba(b.color, 0.15));
    grad.addColorStop(1, rgba(b.color, 0.45));
    ctx.fillStyle = grad;
    ctx.fill();

    // 2. Outer Rim Light
    ctx.lineWidth = 1.2;
    ctx.strokeStyle = rgba(b.color, 0.55);
    ctx.stroke();

    // 3. Primary Specular Highlight
    ctx.beginPath();
    ctx.arc(-b.r * 0.35, -b.r * 0.35, b.r * 0.22, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.65)';
    ctx.fill();

    // 4. Secondary Soft Reflection
    ctx.beginPath();
    ctx.arc(b.r * 0.3, b.r * 0.35, b.r * 0.15, 0, Math.PI * 2);
    ctx.fillStyle = rgba(b.color, 0.25);
    ctx.fill();

    ctx.restore();
  }

  requestAnimationFrame(frame);
}

// Clock Setup
if (typeof startClock === 'function') {
  startClock(clockEl, dateEl);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();
  initBubbles();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
