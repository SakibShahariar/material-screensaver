<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — City</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --surface_rgb: 12 20 27;
  --surface_container_lowest_rgb: 7 15 21;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .9) 0%,
    rgb(var(--surface_rgb) / .55) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1;
let theme = {};
let buildings = [];
let stars = [];
let start = performance.now();
let cursorTimer;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.2 : 0.7;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
function mix(a, b, t) {
  return a.map((v, i) => Math.round(v + (b[i] - v) * t));
}

function loadTheme() {
  theme = {
    surface:                 readRGB("--surface_rgb", [12, 20, 27]),
    surfaceLowest:           readRGB("--surface_container_lowest_rgb", [7, 15, 21]),
    primary:                 readRGB("--primary_rgb", [138, 206, 255]),
    secondary:               readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:                readRGB("--tertiary_rgb", [186, 196, 250]),
    outline:                 readRGB("--outline_rgb", [137, 146, 154])
  };

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function makeStars() {
  stars = [];
  const count = Math.floor((W * H) / 12000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.55,
      r: 0.4 + Math.random() * 1.1,
      phase: Math.random() * Math.PI * 2,
      speed: 0.3 + Math.random() * 0.6
    });
  }
}

function makeBuildings() {
  buildings = [];
  let x = -20;
  const windowColors = [
    theme.primary,
    theme.secondary,
    theme.tertiary,
    theme.primary
  ];

  while (x < W + 40) {
    const width = 28 + Math.random() * 52;
    const height = H * (0.22 + Math.random() * 0.48);
    const floors = Math.max(3, Math.floor(height / 14));
    const cols = Math.max(2, Math.floor(width / 11));
    const winW = 4 + Math.random() * 2;
    const winH = 5 + Math.random() * 2;
    const windows = [];

    for (let f = 0; f < floors; f++) {
      for (let c = 0; c < cols; c++) {
        if (Math.random() < 0.72) {
          windows.push({
            x: 6 + c * ((width - 12) / cols),
            y: 8 + f * ((height - 16) / floors),
            on: Math.random() < 0.55,
            nextToggle: Math.random() * 20,
            colorIdx: Math.floor(Math.random() * windowColors.length)
          });
        }
      }
    }

    buildings.push({
      x, width, height,
      tint: Math.floor(Math.random() * 10),
      windows, winW, winH,
      roofType: Math.random() < 0.35 ? "peak" : "flat"
    });
    x += width + 4 + Math.random() * 10;
  }
}

function drawRoof(b, baseY) {
  if (b.roofType === "peak") {
    ctx.beginPath();
    ctx.moveTo(b.x - 2, baseY);
    ctx.lineTo(b.x + b.width / 2, baseY - 12 - Math.random() * 8);
    ctx.lineTo(b.x + b.width + 2, baseY);
    ctx.closePath();
    ctx.fillStyle = `rgb(${6 + b.tint},${8 + b.tint},${12 + b.tint})`;
    ctx.fill();
  }
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeBuildings();
  makeStars();
}
addEventListener("resize", resize, { passive: true });

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  // 0 → 1 full day-night cycle (~90s)
  const cycle = (t % 90) / 90;
  // Night weight: dusk → night → late night
  const night = cycle < 0.15
    ? cycle / 0.15
    : cycle > 0.85
      ? (1 - cycle) / 0.15
      : 1;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Sky gradient shifts with time
  const skyTop = mix(theme.surface, [8, 12, 22], night);
  const skyBot = mix(
    mix(theme.surface, theme.primary, 0.15),
    theme.surfaceLowest || theme.surface,
    night
  );
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, rgba(skyTop, 1));
  sky.addColorStop(1, rgba(skyBot, 1));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stars (stronger at full night)
  const starAlpha = Math.max(0, (night - 0.2) * 1.2);
  if (starAlpha > 0.05) {
    for (const s of stars) {
      const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * s.speed + s.phase));
      ctx.beginPath();
      ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
      ctx.fillStyle = `rgba(255,255,255,${tw * starAlpha * 0.75})`;
      ctx.fill();
    }
  }

  // Soft moon
  if (night > 0.3) {
    const mx = W * 0.78;
    const my = H * 0.16;
    const moonA = (night - 0.3) * 1.1;
    const glow = ctx.createRadialGradient(mx, my, 0, mx, my, 50);
    glow.addColorStop(0, `rgba(255,250,235,${0.25 * moonA})`);
    glow.addColorStop(1, "transparent");
    ctx.fillStyle = glow;
    ctx.beginPath();
    ctx.arc(mx, my, 50, 0, Math.PI * 2);
    ctx.fill();
    ctx.beginPath();
    ctx.arc(mx, my, 18, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,250,235,${0.85 * moonA})`;
    ctx.fill();
  }

  const windowColors = [
    theme.primary,
    theme.secondary,
    theme.tertiary,
    theme.primary
  ];

  for (const b of buildings) {
    const baseY = H - b.height;
    const body = 8 + b.tint;
    ctx.fillStyle = `rgb(${body},${body + 2},${body + 6})`;
    ctx.fillRect(b.x, baseY, b.width, b.height);
    drawRoof(b, baseY);

    for (const w of b.windows) {
      if (t >= w.nextToggle) {
        // More lights on as night deepens
        const onChance = 0.25 + night * 0.5;
        w.on = Math.random() < onChance;
        w.nextToggle = t + (3 + Math.random() * 18);
      }
      if (w.on) {
        const col = windowColors[w.colorIdx % windowColors.length];
        ctx.fillStyle = rgba(col, 0.55 + night * 0.35);
        ctx.fillRect(b.x + w.x, baseY + w.y, b.winW, b.winH);
      }
    }
  }

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockWrap.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
