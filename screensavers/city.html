<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — City</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --secondary_rgb: 180 199 233;
    --tertiary_rgb: 186 196 250;
    --surface_rgb: 12 20 27;
    --surface_container_lowest_rgb: 7 15 21;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none;
  }
  body.show-cursor { cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock {
    position: fixed; left: 32px; bottom: 28px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
    font-size: clamp(28px, 4vw, 56px);
    text-shadow: 0 0 24px rgba(0,0,0,0.5);
    pointer-events: none; transition: opacity 0.6s ease;
  }
  #clock .ampm {
    font-size: 0.36em;
    margin-left: 6px;
    opacity: 0.82;
    vertical-align: middle;
  }
  #date {
    position: fixed; left: 34px; bottom: 14px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: clamp(12px, 1.2vw, 16px); letter-spacing: 1.5px; text-transform: uppercase;
    pointer-events: none; transition: opacity 0.6s ease;
  }
  #hint {
    position: fixed; right: 28px; bottom: 26px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 13px; letter-spacing: 0.5px;
    pointer-events: none; opacity: 0; transition: opacity 0.8s ease;
  }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let cursorTimeout;
window.addEventListener('pointermove', () => {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
});

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  makeBuildings();
  makeStars();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.3 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return fallback;
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let windowColors = [];

async function loadMatugenColors() {
  try {
    const res = await fetch('file:///home/sakib/.config/matugen/matugen-colors.css');
    if (res.ok) {
      const cssText = await res.text();
      const styleTag = document.createElement('style');
      styleTag.textContent = cssText;
      document.head.appendChild(styleTag);
    }
  } catch (e) {}
  applyTheme();
}

function applyTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    surfaceLow: readRGB('--surface_container_lowest_rgb', [7, 15, 21]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  windowColors = [theme.primary, theme.secondary, theme.tertiary];
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;
}

let buildings = [];
function makeBuildings() {
  buildings = [];
  let x = 0;
  while (x < W * 1.05) {
    const width = 40 + Math.random() * 80;
    const isSkyscraper = Math.random() < 0.16;
    const heightFrac = isSkyscraper ? 0.72 + Math.random() * 0.22 : 0.2 + Math.random() * 0.42;
    const winW = 6, winH = 9, gapX = 5, gapY = 10;
    const cols = Math.max(1, Math.floor((width - 10) / (winW + gapX)));
    const height = H * heightFrac;
    const rows = Math.max(1, Math.floor((height - 20) / (winH + gapY)));
    const windows = [];
    for (let r = 0; r < rows; r++) {
      for (let c = 0; c < cols; c++) {
        windows.push({
          x: c * (winW + gapX) + 8,
          y: r * (winH + gapY) + 12,
          on: Math.random() < 0.4,
          nextToggle: Math.random() * 20,
          colorIdx: Math.floor(Math.random() * windowColors.length),
        });
      }
    }
    const roofRoll = Math.random();
    const roofStyle = roofRoll < 0.4 ? 'flat' : roofRoll < 0.62 ? 'antenna' : roofRoll < 0.84 ? 'setback' : 'point';
    const tint = 4 + Math.random() * 10;
    buildings.push({ x, width, height, windows, winW, winH, roofStyle, tint });
    x += width + 2 + Math.random() * 4;
  }
}

function drawRoof(b, baseY) {
  const cx = b.x + b.width / 2;
  ctx.fillStyle = `rgb(${8 + b.tint},${10 + b.tint},${14 + b.tint})`;
  if (b.roofStyle === 'antenna') {
    ctx.fillRect(cx - 1.5, baseY - 22, 3, 22);
    ctx.beginPath();
    ctx.arc(cx, baseY - 22, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255,80,80,0.85)';
    ctx.fill();
  } else if (b.roofStyle === 'setback') {
    const tierW = b.width * 0.55;
    ctx.fillRect(b.x + (b.width - tierW) / 2, baseY - 20, tierW, 20);
  } else if (b.roofStyle === 'point') {
    ctx.beginPath();
    ctx.moveTo(b.x, baseY);
    ctx.lineTo(cx, baseY - 26);
    ctx.lineTo(b.x + b.width, baseY);
    ctx.closePath();
    ctx.fill();
  }
}

let stars = [];
function makeStars() {
  stars = [];
  const count = Math.floor((W * H * 0.5) / 9000);
  for (let i = 0; i < count; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.55, r: 0.4 + Math.random() * 1.1, phase: Math.random() * Math.PI * 2 });
  }
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  const surfLow = theme.surfaceLow || [7, 15, 21];
  const surf = theme.surface || [12, 20, 27];
  sky.addColorStop(0, `rgb(${surfLow.join(',')})`);
  sky.addColorStop(1, `rgb(${surf.join(',')})`);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.4 + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${tw * 0.7})`;
    ctx.fill();
  }

  // moon
  ctx.beginPath();
  ctx.arc(W * 0.82, H * 0.16, 30, 0, Math.PI * 2);
  const moonGrad = ctx.createRadialGradient(W * 0.82, H * 0.16, 0, W * 0.82, H * 0.16, 55);
  moonGrad.addColorStop(0, 'rgba(255,250,235,0.9)');
  moonGrad.addColorStop(1, 'rgba(255,250,235,0)');
  ctx.fillStyle = moonGrad;
  ctx.fill();
  ctx.beginPath();
  ctx.arc(W * 0.82, H * 0.16, 22, 0, Math.PI * 2);
  ctx.fillStyle = 'rgb(255,250,235)';
  ctx.fill();

  for (const b of buildings) {
    const baseY = H - b.height;
    ctx.fillStyle = `rgb(${8 + b.tint},${10 + b.tint},${14 + b.tint})`;
    ctx.fillRect(b.x, baseY, b.width, b.height);
    drawRoof(b, baseY);

    for (const w of b.windows) {
      if (t >= w.nextToggle) {
        w.on = Math.random() < 0.55;
        w.nextToggle = t + (4 + Math.random() * 20) * speedMul;
      }
      if (w.on) {
        ctx.fillStyle = rgba(windowColors[w.colorIdx], 0.85);
        ctx.fillRect(b.x + w.x, baseY + w.y, b.winW, b.winH);
      }
    }
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', async () => {
  await loadMatugenColors();
  resize();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
