<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>cymatics</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --surface_rgb: 8 12 18;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .9) 0%,
    rgb(var(--surface_rgb) / .55) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0;
let theme = {};
let grains = [];
let start = performance.now();
let cursorTimer;

// Chladni modes slowly morph (n, m pairs)
const MODES = [
  [2, 3], [3, 5], [4, 3], [5, 4], [3, 4], [6, 5], [2, 5]
];
let modeIdx = 0;
let modeBlend = 0;

const GRAIN_COUNT = 2200;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.25 : 0.65;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:   readRGB("--surface_rgb", [8, 12, 18]),
    primary:   readRGB("--primary_rgb", [138, 206, 255]),
    secondary: readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:  readRGB("--tertiary_rgb", [186, 196, 250]),
    outline:   readRGB("--outline_rgb", [137, 146, 154])
  };
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function chladni(nx, ny, x, y, t) {
  // Rectangular Chladni approximation in normalized [-1,1]
  const a = Math.sin(nx * Math.PI * x) * Math.sin(ny * Math.PI * y);
  const b = Math.sin(ny * Math.PI * x) * Math.sin(nx * Math.PI * y);
  return a - b * Math.cos(t * 0.15);
}

function initGrains() {
  grains = [];
  for (let i = 0; i < GRAIN_COUNT; i++) {
    grains.push({
      x: (Math.random() * 2 - 1),
      y: (Math.random() * 2 - 1),
      vx: 0,
      vy: 0,
      colorIdx: i % 3
    });
  }
}

function resize() {
  W = innerWidth; H = innerHeight;
  cx = W * 0.5; cy = H * 0.5;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initGrains();
}
addEventListener("resize", resize, { passive: true });

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  // Morph between modes every ~12s
  modeBlend += 0.00035 * speedMul * 60 * 0.016;
  if (modeBlend >= 1) {
    modeBlend = 0;
    modeIdx = (modeIdx + 1) % MODES.length;
  }
  const m0 = MODES[modeIdx];
  const m1 = MODES[(modeIdx + 1) % MODES.length];
  const s = modeBlend * modeBlend * (3 - 2 * modeBlend);
  const nx = m0[0] + (m1[0] - m0[0]) * s;
  const ny = m0[1] + (m1[1] - m0[1]) * s;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 0.18);
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min(W, H) * 0.42;
  const colors = [theme.primary, theme.secondary, theme.tertiary];

  ctx.globalCompositeOperation = "lighter";

  for (const g of grains) {
    // Sample field gradient → push grains toward nodal lines (|amp| ~ 0)
    const eps = 0.012;
    const v = chladni(nx, ny, g.x, g.y, t);
    const vx = (chladni(nx, ny, g.x + eps, g.y, t) - v) / eps;
    const vy = (chladni(nx, ny, g.x, g.y + eps, t) - v) / eps;

    // Move toward nodes (where amplitude is near zero)
    const force = -v * 0.45;
    g.vx = g.vx * 0.92 + (vx * force) * 0.08;
    g.vy = g.vy * 0.92 + (vy * force) * 0.08;
    g.x += g.vx * 0.04;
    g.y += g.vy * 0.04;

    // Soft bounds
    if (g.x < -1.05 || g.x > 1.05 || g.y < -1.05 || g.y > 1.05) {
      g.x = Math.random() * 2 - 1;
      g.y = Math.random() * 2 - 1;
      g.vx = g.vy = 0;
    }

    const px = cx + g.x * scale;
    const py = cy + g.y * scale;
    const nearNode = Math.max(0, 1 - Math.abs(v) * 3);
    const a = 0.15 + nearNode * 0.55;

    ctx.beginPath();
    ctx.arc(px, py, 1.1 + nearNode * 0.8, 0, Math.PI * 2);
    ctx.fillStyle = rgba(colors[g.colorIdx], a);
    ctx.fill();
  }

  ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") clockWrap.classList.toggle("hidden");
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();
  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);
  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
