<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — DNA</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --primary_container_rgb: 0 75 111;
  --tertiary_container_rgb: 58 68 114;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock {
  position: fixed;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(40px, 4.5vw, 56px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 40px rgb(var(--primary_rgb) / .4),
    0 2px 16px rgba(0,0,0,.6);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .7;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  position: fixed;
  left: clamp(30px, 3.1vw, 50px);
  bottom: clamp(18px, 2.2vw, 28px);
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 10px rgba(0,0,0,.5);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock.hidden, #date.hidden { opacity: 0; }

#hint {
  position: fixed; right: 28px; bottom: 24px;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00<span class="ampm">AM</span></div>
<div id="date">MON, JAN 1</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0;
let theme = {};
let rungPairs = [];
let start = performance.now();
let cursorTimer;

const HELIX_RADIUS = 135;
const TOTAL_POINTS = 80;
const VERTICAL_SPACING = 22;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.22 : 0.85;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:           readRGB("--surface_rgb", [12, 20, 27]),
    primary:           readRGB("--primary_rgb", [138, 206, 255]),
    secondary:         readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:          readRGB("--tertiary_rgb", [186, 196, 250]),
    primaryContainer:  readRGB("--primary_container_rgb", [0, 75, 111]),
    tertiaryContainer: readRGB("--tertiary_container_rgb", [58, 68, 114]),
    outline:           readRGB("--outline_rgb", [137, 146, 154])
  };

  rungPairs = [
    [theme.primary, theme.secondary],
    [theme.tertiary, theme.primaryContainer],
    [theme.secondary, theme.tertiaryContainer]
  ];

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.97);
  dateEl.style.color  = rgba(theme.secondary, 0.88);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  cx = W * 0.5; cy = H * 0.5;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });

function project3D(x, y, z, rx, ry) {
  const x1 = x * Math.cos(ry) + z * Math.sin(ry);
  const z1 = -x * Math.sin(ry) + z * Math.cos(ry);
  const y2 = y * Math.cos(rx) - z1 * Math.sin(rx);
  const z2 = y * Math.sin(rx) + z1 * Math.cos(rx);
  return { x: x1, y: y2, z: z2 };
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const cycle = TOTAL_POINTS * VERTICAL_SPACING;
  const scrollOffset = (t * 36) % cycle;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Soft radial background
  const surf = theme.surface || [12, 20, 27];
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.7);
  bg.addColorStop(0, rgba([
    Math.min(255, surf[0] + 6),
    Math.min(255, surf[1] + 8),
    Math.min(255, surf[2] + 12)
  ], 1));
  bg.addColorStop(1, rgba(surf, 1));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const tiltX = Math.sin(t * 0.28) * 0.22;
  const tiltY = Math.cos(t * 0.18) * 0.14;
  const twist = t * 1.05;

  const queue = [];

  for (let i = 0; i < TOTAL_POINTS; i++) {
    let screenY = i * VERTICAL_SPACING - scrollOffset + cycle * 0.5;
    // seamless wrap
    while (screenY < -120) screenY += cycle;
    while (screenY > H + 120) screenY -= cycle;

    const angle = i * 0.175 + twist;

    const x1 = Math.sin(angle) * HELIX_RADIUS;
    const z1 = Math.cos(angle) * HELIX_RADIUS;
    const x2 = Math.sin(angle + Math.PI) * HELIX_RADIUS;
    const z2 = Math.cos(angle + Math.PI) * HELIX_RADIUS;

    const p1 = project3D(x1, screenY - cy, z1, tiltX, tiltY);
    const p2 = project3D(x2, screenY - cy, z2, tiltX, tiltY);
    const pair = rungPairs[i % rungPairs.length] || [theme.primary, theme.secondary];

    queue.push({
      type: "rung",
      z: (p1.z + p2.z) * 0.5,
      x1: p1.x + cx, y1: p1.y + cy,
      x2: p2.x + cx, y2: p2.y + cy,
      colorA: pair[0], colorB: pair[1]
    });
    queue.push({
      type: "node",
      z: p1.z,
      x: p1.x + cx, y: p1.y + cy,
      color: pair[0],
      radius: Math.max(2.2, 4.2 + p1.z * 0.014)
    });
    queue.push({
      type: "node",
      z: p2.z,
      x: p2.x + cx, y: p2.y + cy,
      color: pair[1],
      radius: Math.max(2.2, 4.2 + p2.z * 0.014)
    });
  }

  queue.sort((a, b) => a.z - b.z);

  ctx.lineCap = "round";
  for (const item of queue) {
    const depth = (item.z + HELIX_RADIUS) / (2 * HELIX_RADIUS);
    const d = Math.max(0, Math.min(1, depth));

    if (item.type === "rung") {
      ctx.beginPath();
      ctx.moveTo(item.x1, item.y1);
      ctx.lineTo(item.x2, item.y2);
      // Gradient-ish: average the pair with depth alpha
      const mid = [
        (item.colorA[0] + item.colorB[0]) * 0.5,
        (item.colorA[1] + item.colorB[1]) * 0.5,
        (item.colorA[2] + item.colorB[2]) * 0.5
      ];
      ctx.strokeStyle = rgba(mid, 0.12 + d * 0.38);
      ctx.lineWidth = 1.4 + d * 1.8;
      ctx.stroke();
    } else {
      ctx.beginPath();
      ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
      ctx.shadowColor = rgba(item.color, d * 0.85);
      ctx.shadowBlur = 6 + d * 10;
      ctx.fillStyle = rgba(item.color, 0.35 + d * 0.65);
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockEl.classList.toggle("hidden");
    dateEl.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
