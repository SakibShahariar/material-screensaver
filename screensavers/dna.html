<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — DNA</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --secondary_rgb: 180 199 233; --tertiary_rgb: 186 196 250;
    --primary_container_rgb: 0 75 111; --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27; --outline_rgb: 137 146 154;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock { position: fixed; left: 32px; bottom: 28px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; font-size: clamp(28px,4vw,56px); text-shadow: 0 0 24px rgba(0,0,0,0.4); pointer-events: none; transition: opacity 0.6s ease; }
  #clock .ampm { font-size: 0.36em; margin-left: 6px; opacity: 0.82; vertical-align: middle; }
  #date { position: fixed; left: 34px; bottom: 14px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: clamp(12px,1.2vw,16px); letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; transition: opacity 0.6s ease; }
  #hint { position: fixed; right: 28px; bottom: 26px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: 13px; letter-spacing: 0.5px; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>
<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, cx;
function resize() {
  W = window.innerWidth; H = window.innerHeight; cx = W / 2;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let rungPairs = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'), primary: readRGB('--primary_rgb'), secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'), primaryContainer: readRGB('--primary_container_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'), outline: readRGB('--outline_rgb'),
  };
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
  rungPairs = [[theme.primary, theme.secondary], [theme.tertiary, theme.primaryContainer], [theme.secondary, theme.tertiaryContainer]];
}

const RADIUS_FRAC = 0.12;
const RUNG_SPACING = 46;      // px between base pairs
const SAMPLE_STEP = 4;        // px between strand curve samples — dense for smoothness
const SCROLL_SPEED = 34;      // px/sec — the whole helix flows upward continuously

let start = performance.now();

function pointAt(yWorld, radius, offset) {
  const phase = yWorld * 0.045 + offset;
  return { x: cx + Math.sin(phase) * radius, z: Math.cos(phase) };
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const radius = Math.min(W, H) * RADIUS_FRAC;
  const scrollY = t * SCROLL_SPEED;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bg = ctx.createRadialGradient(cx, H / 2, 0, cx, H / 2, Math.max(W, H) * 0.7);
  bg.addColorStop(0, `rgb(${theme.surface.map((v,i)=>Math.min(255,v+ (i===2?10:6))).join(',')})`);
  bg.addColorStop(1, `rgb(${theme.surface.join(',')})`);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // dense sample points along each backbone for smooth, glowing strands
  const strandA = [], strandB = [];
  for (let y = -SAMPLE_STEP; y <= H + SAMPLE_STEP; y += SAMPLE_STEP) {
    const yWorld = y + scrollY;
    strandA.push({ screenY: y, ...pointAt(yWorld, radius, 0) });
    strandB.push({ screenY: y, ...pointAt(yWorld, radius, Math.PI) });
  }

  function drawStrand(strand, color) {
    for (let i = 1; i < strand.length; i++) {
      const p0 = strand[i - 1], p1 = strand[i];
      const depth = (p1.z + 1) / 2;
      ctx.beginPath();
      ctx.moveTo(p0.x, p0.screenY);
      ctx.lineTo(p1.x, p1.screenY);
      ctx.strokeStyle = rgba(color, 0.35 + depth * 0.55);
      ctx.lineWidth = 1.5 + depth * 2.5;
      ctx.shadowColor = rgba(color, depth * 0.6);
      ctx.shadowBlur = 4 + depth * 8;
      ctx.stroke();
    }
    ctx.shadowBlur = 0;
  }

  // rungs at regular intervals, behind the strands
  for (let y = 0; y <= H; y += RUNG_SPACING) {
    const yWorld = y + scrollY;
    const a = pointAt(yWorld, radius, 0);
    const b = pointAt(yWorld, radius, Math.PI);
    const depth = (a.z + 1) / 2;
    const pairIdx = Math.round(yWorld / RUNG_SPACING) % rungPairs.length;
    const pair = rungPairs[((pairIdx % rungPairs.length) + rungPairs.length) % rungPairs.length];

    ctx.beginPath();
    ctx.moveTo(a.x, y);
    ctx.lineTo(b.x, y);
    ctx.strokeStyle = rgba(pair[0], 0.2 + depth * 0.35);
    ctx.lineWidth = 2 + depth * 1.5;
    ctx.stroke();

    ctx.beginPath();
    ctx.arc(a.x, y, 3 + depth * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = rgba(pair[0], 0.4 + depth * 0.6);
    ctx.shadowColor = rgba(pair[0], depth * 0.8);
    ctx.shadowBlur = 10 * depth;
    ctx.fill();
    ctx.beginPath();
    ctx.arc(b.x, y, 3 + (1 - depth) * 2.5, 0, Math.PI * 2);
    ctx.fillStyle = rgba(pair[1], 0.4 + (1 - depth) * 0.6);
    ctx.shadowColor = rgba(pair[1], (1 - depth) * 0.8);
    ctx.shadowBlur = 10 * (1 - depth);
    ctx.fill();
    ctx.shadowBlur = 0;
  }

  drawStrand(strandA, theme.primary);
  drawStrand(strandB, theme.tertiary);

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});
hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
