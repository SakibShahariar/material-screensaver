<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — DNA</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --secondary_rgb: 180 199 233;
    --tertiary_rgb: 186 196 250;
    --primary_container_rgb: 0 75 111;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none;
  }
  body.show-cursor { cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock {
    position: fixed; left: 32px; bottom: 28px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
    font-size: clamp(28px, 4vw, 56px);
    text-shadow: 0 0 24px rgba(0,0,0,0.4);
    pointer-events: none; transition: opacity 0.6s ease;
  }
  #clock .ampm {
    font-size: 0.36em;
    margin-left: 6px;
    opacity: 0.82;
    vertical-align: middle;
  }
  #date {
    position: fixed; left: 34px; bottom: 14px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: clamp(12px, 1.2vw, 16px); letter-spacing: 1.5px; text-transform: uppercase;
    pointer-events: none; transition: opacity 0.6s ease;
  }
  #hint {
    position: fixed; right: 28px; bottom: 26px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 13px; letter-spacing: 0.5px;
    pointer-events: none; opacity: 0; transition: opacity 0.8s ease;
  }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let cursorTimeout;
window.addEventListener('pointermove', () => {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
});

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, cx, cy;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return fallback;
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let rungPairs = [];

async function loadMatugenColors() {
  try {
    const res = await fetch('file:///home/sakib/.config/matugen/matugen-colors.css');
    if (res.ok) {
      const cssText = await res.text();
      const styleTag = document.createElement('style');
      styleTag.textContent = cssText;
      document.head.appendChild(styleTag);
    }
  } catch (e) {}
  applyTheme();
}

function applyTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;
  rungPairs = [
    [theme.primary, theme.secondary],
    [theme.tertiary, theme.primaryContainer],
    [theme.secondary, theme.tertiaryContainer]
  ];
}

const HELIX_RADIUS = 130;
const TOTAL_POINTS = 75;
const VERTICAL_SPACING = 24;

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const scrollOffset = (t * 40) % (TOTAL_POINTS * VERTICAL_SPACING);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const surf = theme.surface || [12, 20, 27];
  const bg = ctx.createRadialGradient(cx, cy, 0, cx, cy, Math.max(W, H) * 0.75);
  bg.addColorStop(0, `rgb(${surf.map((v, i) => Math.min(255, v + (i === 2 ? 14 : 8))).join(',')})`);
  bg.addColorStop(1, `rgb(${surf.join(',')})`);
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  const tiltX = Math.sin(t * 0.3) * 0.25;
  const tiltY = Math.cos(t * 0.2) * 0.15;
  const twistSpeed = t * 1.2;

  // Generate 3D points for strands and rungs
  let renderQueue = [];

  for (let i = 0; i < TOTAL_POINTS; i++) {
    const baseY = (i * VERTICAL_SPACING) - scrollOffset + (TOTAL_POINTS * VERTICAL_SPACING / 2);
    // Wrap around screen seamlessly
    let screenY = baseY;
    while (screenY < -100) screenY += TOTAL_POINTS * VERTICAL_SPACING;
    while (screenY > H + 100) screenY -= TOTAL_POINTS * VERTICAL_SPACING;

    const angle = (i * 0.18) + twistSpeed;

    // Strand A
    const x1 = Math.sin(angle) * HELIX_RADIUS;
    const z1 = Math.cos(angle) * HELIX_RADIUS;
    // Strand B (Pi offset)
    const x2 = Math.sin(angle + Math.PI) * HELIX_RADIUS;
    const z2 = Math.cos(angle + Math.PI) * HELIX_RADIUS;

    // Apply 3D rotation / projection
    const p1 = project3D(x1, screenY - cy, z1, tiltX, tiltY);
    const p2 = project3D(x2, screenY - cy, z2, tiltX, tiltY);

    const pair = rungPairs[i % rungPairs.length];

    // Push Rung & Nodes to queue for depth sorting
    renderQueue.push({
      type: 'rung',
      z: (p1.z + p2.z) / 2,
      x1: p1.x + cx, y1: p1.y + cy,
      x2: p2.x + cx, y2: p2.y + cy,
      colorA: pair[0], colorB: pair[1],
      z1: p1.z, z2: p2.z
    });

    renderQueue.push({
      type: 'node',
      z: p1.z,
      x: p1.x + cx, y: p1.y + cy,
      color: pair[0],
      radius: Math.max(2, 4 + p1.z * 0.015)
    });

    renderQueue.push({
      type: 'node',
      z: p2.z,
      x: p2.x + cx, y: p2.y + cy,
      color: pair[1],
      radius: Math.max(2, 4 + p2.z * 0.015)
    });
  }

  // Sort back-to-front (Painter's algorithm)
  renderQueue.sort((a, b) => a.z - b.z);

  for (const item of renderQueue) {
    if (item.type === 'rung') {
      const depthFactor = (item.z + HELIX_RADIUS) / (2 * HELIX_RADIUS);
      ctx.beginPath();
      ctx.moveTo(item.x1, item.y1);
      ctx.lineTo(item.x2, item.y2);
      ctx.strokeStyle = rgba(item.colorA, 0.15 + depthFactor * 0.3);
      ctx.lineWidth = 1.5 + depthFactor * 1.5;
      ctx.stroke();
    } else if (item.type === 'node') {
      const depthFactor = (item.z + HELIX_RADIUS) / (2 * HELIX_RADIUS);
      ctx.beginPath();
      ctx.arc(item.x, item.y, item.radius, 0, Math.PI * 2);
      ctx.fillStyle = rgba(item.color, 0.4 + depthFactor * 0.6);
      ctx.shadowColor = rgba(item.color, depthFactor * 0.9);
      ctx.shadowBlur = depthFactor * 12;
      ctx.fill();
      ctx.shadowBlur = 0;
    }
  }

  requestAnimationFrame(frame);
}

function project3D(x, y, z, rx, ry) {
  // Rotate around Y
  const x1 = x * Math.cos(ry) + z * Math.sin(ry);
  const z1 = -x * Math.sin(ry) + z * Math.cos(ry);
  // Rotate around X
  const y2 = y * Math.cos(rx) - z1 * Math.sin(rx);
  const z2 = y * Math.sin(rx) + z1 * Math.cos(rx);
  return { x: x1, y: y2, z: z2 };
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', async () => {
  await loadMatugenColors();
  resize();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
