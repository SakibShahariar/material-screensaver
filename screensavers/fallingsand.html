<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Falling Sand</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233; --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250; --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27; --outline_rgb: 137 146 154;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock { position: fixed; left: 32px; bottom: 28px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; font-size: clamp(28px,4vw,56px); text-shadow: 0 0 24px rgba(0,0,0,0.4); pointer-events: none; transition: opacity 0.6s ease; }
  #clock .ampm { font-size: 0.36em; margin-left: 6px; opacity: 0.82; vertical-align: middle; }
  #date { position: fixed; left: 34px; bottom: 14px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: clamp(12px,1.2vw,16px); letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; transition: opacity 0.6s ease; }
  #hint { position: fixed; right: 28px; bottom: 26px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: 13px; letter-spacing: 0.5px; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>
<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, cols, rows;
const CELL = 5;

function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cols = Math.ceil(W / CELL);
  rows = Math.ceil(H / CELL);
  grid = new Int8Array(cols * rows).fill(-1);
  colorGrid = new Uint8Array(cols * rows);
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const STEP_MS = reduceMotion ? 60 : 26;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'), primary: readRGB('--primary_rgb'), secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'), primaryContainer: readRGB('--primary_container_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'), tertiaryContainer: readRGB('--tertiary_container_rgb'),
    outline: readRGB('--outline_rgb'),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer];
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

let grid, colorGrid;
function idx(x, y) { return y * cols + x; }

let emitColorIdx = 0;
let nextColorSwitch = 4;

function stepSand(t) {
  if (t >= nextColorSwitch) {
    emitColorIdx = (emitColorIdx + 1) % roleList.length;
    nextColorSwitch = t + 4 + Math.random() * 4;
  }

  // iterate bottom-to-top so a cell that just moved down isn't processed again this step
  for (let y = rows - 2; y >= 0; y--) {
    const scanLeftToRight = Math.random() < 0.5;
    for (let c = 0; c < cols; c++) {
      const x = scanLeftToRight ? c : cols - 1 - c;
      const i = idx(x, y);
      if (grid[i] < 0) continue;

      const below = idx(x, y + 1);
      const scatter = Math.random() < 0.12; // small chance to drift diagonally even when a clear drop is available
      if (!scatter && grid[below] < 0) {
        grid[below] = grid[i]; colorGrid[below] = colorGrid[i];
        grid[i] = -1;
        continue;
      }
      const dir = Math.random() < 0.5 ? -1 : 1;
      const x1 = x + dir, x2 = x - dir;
      if (x1 >= 0 && x1 < cols && grid[idx(x1, y + 1)] < 0) {
        const t2 = idx(x1, y + 1);
        grid[t2] = grid[i]; colorGrid[t2] = colorGrid[i];
        grid[i] = -1;
      } else if (x2 >= 0 && x2 < cols && grid[idx(x2, y + 1)] < 0) {
        const t2 = idx(x2, y + 1);
        grid[t2] = grid[i]; colorGrid[t2] = colorGrid[i];
        grid[i] = -1;
      } else if (grid[below] < 0) {
        grid[below] = grid[i]; colorGrid[below] = colorGrid[i];
        grid[i] = -1;
      }
    }
  }

  // spawn across a broad swath of the top, not a narrow band — a tight
  // emitter with no lateral scatter during free-fall reads as a rigid
  // straight line rather than natural falling sand
  const spawnCount = 3 + Math.floor(Math.random() * 3);
  for (let k = 0; k < spawnCount; k++) {
    const x = Math.floor(cols * 0.15 + Math.random() * cols * 0.7);
    const i = idx(x, 0);
    if (grid[i] < 0 && Math.random() < 0.85) {
      grid[i] = 1;
      colorGrid[i] = emitColorIdx;
    }
  }
}

function fillCount() {
  let n = 0;
  for (let i = 0; i < grid.length; i++) if (grid[i] >= 0) n++;
  return n;
}

let start = performance.now();
let lastStep = 0;
let lastReset = 0;

function frame(now) {
  const t = now - start;

  if (t - lastStep >= STEP_MS) {
    stepSand(t / 1000);
    lastStep = t;
  }

  if (t - lastReset > 100000 || fillCount() > cols * rows * 0.62) {
    grid.fill(-1);
    lastReset = t;
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgb(${(theme.surface || [12, 20, 27]).join(',')})`;
  ctx.fillRect(0, 0, W, H);

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = idx(x, y);
      if (grid[i] < 0) continue;
      ctx.fillStyle = rgba(roleList[colorGrid[i]] || theme.primary, 0.85);
      const gx = x * CELL + CELL / 2, gy = y * CELL + CELL / 2;
      ctx.beginPath();
      ctx.arc(gx, gy, CELL * 0.52, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});
hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  loadTheme();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
