<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Grass Field Fireflies</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --primary_container_rgb: 0 75 111;
  --secondary_container_rgb: 53 72 99;
  --tertiary_container_rgb: 58 68 114;
  --surface_rgb: 8 14 20;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock {
  position: fixed;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(40px, 4.5vw, 56px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 40px rgb(var(--primary_rgb) / .4),
    0 2px 16px rgba(0,0,0,.65);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .7;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  position: fixed;
  left: clamp(30px, 3.1vw, 50px);
  bottom: clamp(18px, 2.2vw, 28px);
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 10px rgba(0,0,0,.55);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock.hidden, #date.hidden { opacity: 0; }

#hint {
  position: fixed; right: 28px; bottom: 24px;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00<span class="ampm">AM</span></div>
<div id="date">MON, JAN 1</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");

let W = 0, H = 0, DPR = 1;
let theme = {};
let sceneColors = {};
let flies = [];
let stars = [];
let grassBlades = [];
let start = performance.now();
let lastT = 0;
let nextGust = 5;
let gustStrength = 1;
let cursorTimer;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.25 : 0.9;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
function blend(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];
}
function darken(c, f) {
  return c.map(v => Math.round(v * f));
}

function loadTheme() {
  theme = {
    surface:            readRGB("--surface_rgb", [8, 14, 20]),
    primary:            readRGB("--primary_rgb", [138, 206, 255]),
    secondary:          readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:           readRGB("--tertiary_rgb", [186, 196, 250]),
    primaryContainer:   readRGB("--primary_container_rgb", [0, 75, 111]),
    secondaryContainer: readRGB("--secondary_container_rgb", [53, 72, 99]),
    tertiaryContainer:  readRGB("--tertiary_container_rgb", [58, 68, 114]),
    outline:            readRGB("--outline_rgb", [137, 146, 154])
  };

  sceneColors = {
    skyMid:    darken(theme.primaryContainer, 0.35),
    skyBottom: darken(theme.surface, 0.55),
    horizon:   darken(theme.tertiaryContainer, 0.5),
    grassBack: darken(theme.secondaryContainer, 0.42),
    grassFront: darken(theme.secondaryContainer, 0.2)
  };

  // Warm bioluminescence blended with Material accents
  const warmBase = [235, 215, 120];
  const roles = [theme.tertiary, theme.primary, theme.secondary];
  flies.forEach((f, i) => {
    f.color = blend(warmBase, roles[i % roles.length], 0.32);
  });

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.97);
  dateEl.style.color  = rgba(theme.secondary, 0.88);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initGrass();
  makeStars();
  if (flies.length) {
    // keep flies in field after resize
    for (const f of flies) {
      f.x = Math.min(W, Math.max(0, f.x));
      f.y = Math.min(H - 20, Math.max(H * 0.4, f.y));
    }
  }
}
addEventListener("resize", resize, { passive: true });

function makeFlies() {
  flies = [];
  for (let i = 0; i < 55; i++) {
    flies.push({
      x: Math.random() * W,
      y: H * 0.42 + Math.random() * H * 0.48,
      color: [230, 220, 150],
      phase: Math.random() * Math.PI * 2,
      blinkFreq: 0.35 + Math.random() * 0.85,
      wanderAngle: Math.random() * Math.PI * 2,
      wanderSpeed: 7 + Math.random() * 12
    });
  }
}

function makeStars() {
  stars = [];
  const count = Math.min(140, Math.floor((W * H) / 14000));
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.52,
      r: 0.35 + Math.random() * 1.05,
      phase: Math.random() * Math.PI * 2,
      twinkle: 0.3 + Math.random() * 0.55
    });
  }
}

function initGrass() {
  grassBlades = [];
  const count = Math.floor(W / 3.5);
  for (let i = 0; i < count; i++) {
    grassBlades.push({
      x: (i / count) * W + (Math.random() - 0.5) * 10,
      baseY: H + 4,
      height: 36 + Math.random() * 95,
      bend: (Math.random() - 0.5) * 22,
      width: 1.4 + Math.random() * 2.2,
      layer: Math.random() > 0.42 ? 1 : 0,
      swaySpeed: 1.3 + Math.random() * 2.1,
      swayOffset: Math.random() * Math.PI * 2
    });
  }
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.04, t - lastT || 0.016);
  lastT = t;

  if (t >= nextGust) {
    gustStrength = 1.7 + Math.random() * 0.9;
    nextGust = t + 7 + Math.random() * 8;
  }
  gustStrength += (1 - gustStrength) * dt * 0.7;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Twilight sky
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, rgba(theme.surface, 1));
  sky.addColorStop(0.48, rgba(sceneColors.skyMid, 1));
  sky.addColorStop(1, rgba(sceneColors.skyBottom, 1));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (const s of stars) {
    const tw = 0.3 + 0.7 * Math.abs(Math.sin(t * s.twinkle + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${tw * 0.65})`;
    ctx.fill();
  }

  // Horizon meadow
  ctx.fillStyle = rgba(sceneColors.horizon, 1);
  ctx.beginPath();
  ctx.moveTo(0, H);
  ctx.lineTo(0, H * 0.7);
  for (let x = 0; x <= W; x += 40) {
    ctx.lineTo(x, H * 0.7 + Math.sin(x * 0.004 + t * 0.05) * 28);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fill();

  // Background grass
  ctx.fillStyle = rgba(sceneColors.grassBack, 1);
  for (const g of grassBlades) {
    if (g.layer !== 0) continue;
    const sway = Math.sin(t * g.swaySpeed + g.swayOffset) * 8 * gustStrength;
    ctx.beginPath();
    ctx.moveTo(g.x, g.baseY);
    ctx.quadraticCurveTo(
      g.x + sway * 0.5,
      g.baseY - g.height * 0.5,
      g.x + g.bend + sway,
      g.baseY - g.height
    );
    ctx.lineTo(g.x + g.width + g.bend + sway, g.baseY - g.height);
    ctx.quadraticCurveTo(
      g.x + sway * 0.5 + g.width,
      g.baseY - g.height * 0.5,
      g.x + g.width,
      g.baseY
    );
    ctx.closePath();
    ctx.fill();
  }

  // Fireflies
  for (const f of flies) {
    f.wanderAngle += (Math.random() - 0.5) * dt * 2.8;
    f.x += Math.cos(f.wanderAngle) * f.wanderSpeed * dt;
    f.y += Math.sin(f.wanderAngle) * f.wanderSpeed * dt * 0.45;

    if (f.x < -25) f.x = W + 25;
    if (f.x > W + 25) f.x = -25;
    if (f.y < H * 0.4) f.y = H * 0.4;
    if (f.y > H - 18) f.y = H - 18;

    const blink = Math.max(0, Math.sin(t * f.blinkFreq + f.phase));
    const alpha = Math.pow(blink, 2) * 0.88;
    if (alpha < 0.02) continue;

    const glowR = 11 + blink * 9;
    const grad = ctx.createRadialGradient(f.x, f.y, 0, f.x, f.y, glowR);
    grad.addColorStop(0, rgba(f.color, alpha * 0.65));
    grad.addColorStop(0.4, rgba(f.color, alpha * 0.16));
    grad.addColorStop(1, "transparent");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(f.x, f.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(f.x, f.y, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = rgba([255, 255, 220], alpha);
    ctx.fill();
  }

  // Foreground grass
  ctx.fillStyle = rgba(sceneColors.grassFront, 1);
  for (const g of grassBlades) {
    if (g.layer !== 1) continue;
    const sway = Math.sin(t * g.swaySpeed + g.swayOffset) * 12 * gustStrength;
    ctx.beginPath();
    ctx.moveTo(g.x, g.baseY);
    ctx.quadraticCurveTo(
      g.x + sway * 0.6,
      g.baseY - g.height * 0.5,
      g.x + g.bend + sway,
      g.baseY - g.height
    );
    ctx.lineTo(g.x + g.width + g.bend + sway, g.baseY - g.height);
    ctx.quadraticCurveTo(
      g.x + sway * 0.6 + g.width,
      g.baseY - g.height * 0.5,
      g.x + g.width,
      g.baseY
    );
    ctx.closePath();
    ctx.fill();
  }

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockEl.classList.toggle("hidden");
    dateEl.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  resize();
  makeFlies();
  makeStars();
  loadTheme();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
