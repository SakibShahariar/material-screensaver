<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Fireworks</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_rgb: 219 227 237;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
    cursor: crosshair;
  }
  body.hide-cursor { cursor: none !important; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* UI Container */
  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.8s ease;
  }
  #ui-container.hidden { opacity: 0; }

  /* Vignette Glass Lens */
  .vignette-glass {
    background: radial-gradient(circle at center, rgba(12, 20, 27, 0.55) 0%, rgba(12, 20, 27, 0) 80%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
    border: none;
    padding: 28px 40px;
    width: fit-content;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-glass">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint">Click to launch • Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

// Auto-Hide Cursor Engine
let cursorTimeout;
function resetCursorTimer() {
  document.body.classList.remove('hide-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.add('hide-cursor');
  }, 3000);
}
window.addEventListener('pointermove', resetCursorTimer);
window.addEventListener('pointerdown', resetCursorTimer);
resetCursorTimer();

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgb(12, 20, 27)';
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.3 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'),
    primary: readRGB('--primary_rgb'),
    secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'),
    primaryContainer: readRGB('--primary_container_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'),
    inversePrimary: readRGB('--inverse_primary_rgb'),
    outline: readRGB('--outline_rgb'),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer, theme.inversePrimary];
  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

const GRAVITY = 65;
let rockets = [];
let sparks = [];
let nextLaunch = 0;

function createRocket(startX, targetX, targetY) {
  const color = roleList.length ? roleList[Math.floor(Math.random() * roleList.length)] : [200, 200, 200];
  const distance = H - targetY;
  const speed = Math.sqrt(2 * GRAVITY * 0.45 * distance);
  
  rockets.push({
    x: startX,
    y: H,
    vx: (targetX - startX) * 0.8,
    vy: -speed,
    color,
    targetY,
    type: Math.floor(Math.random() * 4)
  });
}

function launchRocket(t) {
  const burstCount = Math.random() < 0.25 ? Math.floor(2 + Math.random() * 3) : 1;
  for (let i = 0; i < burstCount; i++) {
    const startX = W * (0.15 + Math.random() * 0.7);
    const targetX = startX + (Math.random() - 0.5) * W * 0.2;
    const targetY = H * (0.12 + Math.random() * 0.4);
    createRocket(startX, targetX, targetY);
  }
  nextLaunch = t + (0.35 + Math.random() * 0.7) / speedMul;
}

window.addEventListener('pointerdown', (e) => {
  createRocket(W / 2 + (Math.random() - 0.5) * 100, e.clientX, e.clientY);
});

function explode(x, y, color, type) {
  const count = 70 + Math.floor(Math.random() * 60);
  const baseSpeed = 80 + Math.random() * 80;

  for (let i = 0; i < count; i++) {
    let angle = (i / count) * Math.PI * 2;
    let s = baseSpeed * (0.6 + Math.random() * 0.5);
    let maxLife = 1.2 + Math.random() * 0.8;
    let friction = 0.98;
    let gravityMult = 1.0;
    let sparkle = false;

    if (type === 1) {
      angle = (i / count) * Math.PI * 2;
      s = baseSpeed * 0.95;
    } else if (type === 2) {
      maxLife = 2.2 + Math.random() * 0.6;
      friction = 0.96;
      gravityMult = 1.4;
      sparkle = true;
    } else if (type === 3) {
      sparkle = true;
      s *= 1.2;
    }

    sparks.push({
      x, y,
      vx: Math.cos(angle) * s,
      vy: Math.sin(angle) * s,
      life: 0,
      maxLife,
      color,
      friction,
      gravityMult,
      sparkle
    });
  }
}

let start = performance.now();
let lastT = 0;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  if (t >= nextLaunch) launchRocket(t);

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rgba(theme.surface || [12, 20, 27], 0.22);
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  rockets = rockets.filter(r => {
    r.x += r.vx * dt;
    r.y += r.vy * dt;
    r.vy += GRAVITY * 0.45 * dt;

    ctx.beginPath();
    ctx.arc(r.x, r.y, 2.2, 0, Math.PI * 2);
    ctx.fillStyle = rgba(r.color, 0.95);
    ctx.shadowColor = rgba(r.color, 0.8);
    ctx.shadowBlur = 8;
    ctx.fill();
    ctx.shadowBlur = 0;

    if (r.y <= r.targetY || r.vy >= 0) {
      explode(r.x, r.y, r.color, r.type);
      return false;
    }
    return true;
  });

  sparks = sparks.filter(s => {
    s.life += dt;
    if (s.life >= s.maxLife) return false;

    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.vy += GRAVITY * s.gravityMult * dt;
    s.vx *= s.friction;
    s.vy *= s.friction;

    const fade = 1 - s.life / s.maxLife;
    let alpha = fade * 0.9;

    if (s.sparkle && Math.random() < 0.35) {
      alpha *= 0.2;
    }

    const radius = Math.max(0.8, 2.0 * fade);

    ctx.beginPath();
    ctx.arc(s.x, s.y, radius, 0, Math.PI * 2);
    ctx.fillStyle = rgba(s.color, alpha);
    ctx.fill();

    return true;
  });

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  loadTheme();
  if (typeof startClock === 'function') {
    startClock(clockEl, dateEl);
  }
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
