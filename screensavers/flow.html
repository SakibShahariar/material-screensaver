<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Flow</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_rgb: 219 227 237;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }
  
  /* Cursor hidden by default on launch */
  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  /* UI Container */
  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.8s ease;
  }
  #ui-container.hidden { opacity: 0; }

  /* Vignette Glass Lens */
  .vignette-glass {
    background: radial-gradient(circle at center, rgba(12, 20, 27, 0.55) 0%, rgba(12, 20, 27, 0) 80%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
    -webkit-mask-image: radial-gradient(circle at center, black 40%, transparent 85%);
    border: none;
    padding: 28px 40px;
    width: fit-content;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-glass">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint">Move mouse to disturb flow • Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

// ---- Cursor Auto-Hide Logic ----
let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}

// Mouse Deflection Tracking
let mouse = { x: -1000, y: -1000, active: false };
window.addEventListener('pointermove', (e) => {
  triggerCursor();
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
});
window.addEventListener('pointerleave', () => {
  mouse.active = false;
});

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgb(12, 20, 27)';
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let palette = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'), primary: readRGB('--primary_rgb'),
    primaryContainer: readRGB('--primary_container_rgb'), secondary: readRGB('--secondary_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'), tertiary: readRGB('--tertiary_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'), inversePrimary: readRGB('--inverse_primary_rgb'),
    outline: readRGB('--outline_rgb'),
  };
  palette = [
    theme.primary, theme.secondary, theme.tertiary,
    theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer,
    theme.inversePrimary
  ];

  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

// Flow Field Function
function flowAngle(x, y, t) {
  const a = Math.sin(x * 0.0028 + t * 0.14) * Math.cos(y * 0.0024 - t * 0.1);
  const b = Math.sin((x + y) * 0.0018 + t * 0.07);
  const c = Math.cos((x - y) * 0.0015 - t * 0.05);
  return (a + b * 0.7 + c * 0.5) * Math.PI * 1.8;
}

const PARTICLE_COUNT = 380;
let particles = [];

function spawnParticle(p) {
  p.x = Math.random() * W;
  p.y = Math.random() * H;
  p.age = 0;
  p.life = 280 + Math.random() * 320;
  
  // Parallax Depth Layers (0.3 = background, 1.2 = foreground)
  p.depth = 0.3 + Math.random() * 0.9;
  p.speed = (0.6 + Math.random() * 1.2) * p.depth;
  p.size = (0.8 + Math.random() * 1.8) * p.depth;
  
  p.colorIdx = Math.floor(Math.random() * palette.length);
  p.targetColorIdx = (p.colorIdx + 1) % palette.length;
}

function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = {};
    spawnParticle(p);
    p.age = Math.random() * p.life;
    particles.push(p);
  }
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rgba(theme.surface || [12, 20, 27], 0.06);
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';

  for (const p of particles) {
    let angle = flowAngle(p.x, p.y, t);

    // Interactive Deflection
    if (mouse.active) {
      const dx = p.x - mouse.x;
      const dy = p.y - mouse.y;
      const distSq = dx * dx + dy * dy;
      const radiusSq = 180 * 180;
      if (distSq < radiusSq && distSq > 0) {
        const force = (1 - distSq / radiusSq) * 1.2;
        const pushAngle = Math.atan2(dy, dx);
        angle = angle * (1 - force) + pushAngle * force;
      }
    }

    const px = p.x, py = p.y;
    p.x += Math.cos(angle) * p.speed;
    p.y += Math.sin(angle) * p.speed;
    p.age++;

    const lifeRatio = p.age / p.life;
    const fade = lifeRatio < 0.15 ? lifeRatio / 0.15 : (lifeRatio > 0.8 ? (1 - lifeRatio) / 0.2 : 1);
    const alpha = Math.max(0, Math.min(1, fade)) * 0.5 * p.depth;

    // Smooth Color Interpolation
    const c1 = palette[p.colorIdx] || [200, 200, 200];
    const c2 = palette[p.targetColorIdx] || [200, 200, 200];
    const mix = lifeRatio;
    const currentRGB = [
      Math.round(c1[0] * (1 - mix) + c2[0] * mix),
      Math.round(c1[1] * (1 - mix) + c2[1] * mix),
      Math.round(c1[2] * (1 - mix) + c2[2] * mix)
    ];

    ctx.strokeStyle = rgba(currentRGB, alpha);
    ctx.lineWidth = p.size;
    ctx.lineCap = 'round';
    ctx.beginPath();
    ctx.moveTo(px, py);
    ctx.lineTo(p.x, p.y);
    ctx.stroke();

    if (p.age > p.life || p.x < -30 || p.x > W + 30 || p.y < -30 || p.y > H + 30) {
      spawnParticle(p);
    }
  }

  ctx.globalCompositeOperation = 'source-over';
  requestAnimationFrame(frame);
}

if (typeof startClock === 'function') {
  startClock(clockEl, dateEl);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  loadTheme();
  initParticles();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
