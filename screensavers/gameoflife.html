<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Game of Life</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233; --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250; --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 12 20 27; --outline_rgb: 137 146 154;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock { position: fixed; left: 32px; bottom: 28px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; font-size: clamp(28px,4vw,56px); text-shadow: 0 0 24px rgba(0,0,0,0.4); pointer-events: none; transition: opacity 0.6s ease; }
  #clock .ampm { font-size: 0.36em; margin-left: 6px; opacity: 0.82; vertical-align: middle; }
  #date { position: fixed; left: 34px; bottom: 14px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: clamp(12px,1.2vw,16px); letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; transition: opacity 0.6s ease; }
  #hint { position: fixed; right: 28px; bottom: 26px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: 13px; letter-spacing: 0.5px; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>
<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, cols, rows, cellSize;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cellSize = 30;
  cols = Math.ceil(W / cellSize);
  rows = Math.ceil(H / cellSize);
  seedGrid();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const STEP_MS = reduceMotion ? 420 : 170;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'), primary: readRGB('--primary_rgb'), secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'), primaryContainer: readRGB('--primary_container_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'), tertiaryContainer: readRGB('--tertiary_container_rgb'),
    inversePrimary: readRGB('--inverse_primary_rgb'), outline: readRGB('--outline_rgb'),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer, theme.inversePrimary];
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

let grid = [];        // 0/1 alive state
let colorGrid = [];   // assigned color index per cell, set at birth
let displayAlpha = []; // smoothed render alpha per cell, eases toward grid state
let popHistory = [];

function idx(x, y) { return y * cols + x; }

function seedGrid() {
  grid = new Uint8Array(cols * rows);
  colorGrid = new Uint8Array(cols * rows);
  displayAlpha = new Float32Array(cols * rows);
  for (let i = 0; i < grid.length; i++) {
    if (Math.random() < 0.24) {
      grid[i] = 1;
      colorGrid[i] = Math.floor(Math.random() * roleList.length);
    }
  }
  popHistory = [];
}

function countAlive() {
  let n = 0;
  for (let i = 0; i < grid.length; i++) n += grid[i];
  return n;
}

function step() {
  const next = new Uint8Array(cols * rows);
  const nextColor = new Uint8Array(cols * rows);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let neighbors = 0;
      let colorVotes = [];
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = (x + dx + cols) % cols;
          const ny = (y + dy + rows) % rows; // toroidal wraparound — no harsh edge die-off
          const ni = idx(nx, ny);
          if (grid[ni]) { neighbors++; colorVotes.push(colorGrid[ni]); }
        }
      }
      const i = idx(x, y);
      const alive = grid[i];
      if (alive && (neighbors === 2 || neighbors === 3)) {
        next[i] = 1;
        nextColor[i] = colorGrid[i];
      } else if (!alive && neighbors === 3) {
        next[i] = 1;
        nextColor[i] = colorVotes[Math.floor(Math.random() * colorVotes.length)];
      }
    }
  }
  grid = next;
  colorGrid = nextColor;

  const pop = countAlive();
  popHistory.push(pop);
  if (popHistory.length > 50) popHistory.shift();

  const stale = popHistory.length >= 40 && popHistory.every(p => p === popHistory[0]);
  if (pop === 0 || stale) seedGrid();
}

let start = performance.now();
let lastStep = 0;

function frame(now) {
  const t = now - start;

  if (t - lastStep >= STEP_MS) {
    step();
    lastStep = t;
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgb(${(theme.surface || [12, 20, 27]).join(',')})`;
  ctx.fillRect(0, 0, W, H);

  const pad = cellSize * 0.12;
  const size = cellSize - pad * 2;
  const radius = size * 0.28;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = idx(x, y);
      const target = grid[i] ? 1 : 0;
      displayAlpha[i] += (target - displayAlpha[i]) * 0.22;
      if (displayAlpha[i] < 0.02) continue;

      const px = x * cellSize + pad;
      const py = y * cellSize + pad;
      const color = roleList[colorGrid[i]] || theme.primary;

      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(px, py, size, size, radius) :
        ctx.rect(px, py, size, size);
      ctx.fillStyle = rgba(color, displayAlpha[i] * 0.8);
      ctx.fill();
    }
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});
hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  loadTheme();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
