<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Game of Life</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233; --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250; --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 8 13 18; --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    cursor: none; font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  body.show-cursor { cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; }

  /* Redesigned Glassmorphic HUD Container */
  #hud-container {
    position: fixed; left: 48px; bottom: 48px;
    pointer-events: none; transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; flex-direction: column; gap: 6px;
    padding: 24px 32px;
    background: rgb(var(--surface_rgb) / 0.5);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgb(var(--outline_rgb) / 0.15);
    border-radius: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  #clock {
    font-weight: 200; font-variant-numeric: tabular-nums;
    letter-spacing: -2px; font-size: clamp(52px, 7vw, 84px);
    line-height: 0.95;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  #clock .ampm {
    font-size: 0.28em; margin-left: 8px; opacity: 0.75;
    vertical-align: super; font-weight: 500; letter-spacing: 1.5px;
  }
  #date {
    font-size: clamp(12px, 1.3vw, 15px); letter-spacing: 3.5px;
    font-weight: 500; text-transform: uppercase;
    opacity: 0.9;
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    opacity: 0; transition: opacity 0.8s ease;
    padding: 10px 18px;
    background: rgb(var(--surface_rgb) / 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgb(var(--outline_rgb) / 0.1);
    border-radius: 12px;
    pointer-events: none;
  }
  #hint.show { opacity: 0.7; }
  #hud-container.hidden { opacity: 0; transform: translateY(12px); }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="hud-container">
  <div id="clock">00:00</div>
  <div id="date">Mon, Jan 1</div>
</div>
<div id="hint">Press C to toggle clock</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hudContainer = document.getElementById('hud-container');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let cursorTimeout;
window.addEventListener('pointermove', () => {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
});

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, cols, rows, cellSize;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  cellSize = 26;
  cols = Math.ceil(W / cellSize);
  rows = Math.ceil(H / cellSize);
  seedGrid();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const STEP_MS = reduceMotion ? 400 : 160;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return fallback;
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function applyTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [8, 13, 18]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    secondaryContainer: readRGB('--secondary_container_rgb', [53, 72, 99]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    inversePrimary: readRGB('--inverse_primary_rgb', [0, 100, 145]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  roleList = [
    theme.primary, theme.secondary, theme.tertiary,
    theme.primaryContainer, theme.secondaryContainer,
    theme.tertiaryContainer, theme.inversePrimary
  ];
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color = rgba(theme.secondary, 0.9);
  hintEl.style.color = rgba(theme.outline, 1);
  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;
}

async function loadMatugenColors() {
  try {
    const res = await fetch('file:///home/sakib/.config/matugen/matugen-colors.css');
    if (res.ok) {
      const cssText = await res.text();
      const styleTag = document.createElement('style');
      styleTag.textContent = cssText;
      document.head.appendChild(styleTag);
    }
  } catch (e) {}
  applyTheme();
}

let grid = [];
let colorGrid = [];
let displayAlpha = [];
let popHistory = [];

function idx(x, y) { return y * cols + x; }

function seedGrid() {
  grid = new Uint8Array(cols * rows);
  colorGrid = new Uint8Array(cols * rows);
  displayAlpha = new Float32Array(cols * rows);
  for (let i = 0; i < grid.length; i++) {
    if (Math.random() < 0.22) {
      grid[i] = 1;
      colorGrid[i] = Math.floor(Math.random() * roleList.length);
      displayAlpha[i] = 1.0;
    }
  }
  popHistory = [];
}

function countAlive() {
  let n = 0;
  for (let i = 0; i < grid.length; i++) n += grid[i];
  return n;
}

function step() {
  const next = new Uint8Array(cols * rows);
  const nextColor = new Uint8Array(cols * rows);
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      let neighbors = 0;
      let colorVotes = [];
      for (let dy = -1; dy <= 1; dy++) {
        for (let dx = -1; dx <= 1; dx++) {
          if (dx === 0 && dy === 0) continue;
          const nx = (x + dx + cols) % cols;
          const ny = (y + dy + rows) % rows;
          const ni = idx(nx, ny);
          if (grid[ni]) {
            neighbors++;
            colorVotes.push(colorGrid[ni]);
          }
        }
      }
      const i = idx(x, y);
      const alive = grid[i];
      if (alive && (neighbors === 2 || neighbors === 3)) {
        next[i] = 1;
        nextColor[i] = colorGrid[i];
      } else if (!alive && neighbors === 3) {
        next[i] = 1;
        nextColor[i] = colorVotes[Math.floor(Math.random() * colorVotes.length)];
      }
    }
  }
  grid = next;
  colorGrid = nextColor;

  const pop = countAlive();
  popHistory.push(pop);
  if (popHistory.length > 50) popHistory.shift();

  const stale = popHistory.length >= 40 && popHistory.every(p => p === popHistory[0]);
  if (pop === 0 || stale) seedGrid();
}

let start = performance.now();
let lastStep = 0;

function frame(now) {
  const t = now - start;

  if (t - lastStep >= STEP_MS) {
    step();
    lastStep = t;
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const surf = theme.surface || [8, 13, 18];
  ctx.fillStyle = `rgba(${surf.join(',')}, 0.35)`;
  ctx.fillRect(0, 0, W, H);

  const pad = cellSize * 0.15;
  const size = cellSize - pad * 2;
  const radius = size * 0.32;

  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = idx(x, y);
      const target = grid[i] ? 1 : 0;
      displayAlpha[i] += (target - displayAlpha[i]) * 0.2;
      if (displayAlpha[i] < 0.01) continue;

      const px = x * cellSize + pad;
      const py = y * cellSize + pad;
      const color = roleList[colorGrid[i]] || theme.primary;

      ctx.beginPath();
      ctx.roundRect ? ctx.roundRect(px, py, size, size, radius) : ctx.rect(px, py, size, size);
      
      // Soft bloom effect for active cells
      if (displayAlpha[i] > 0.5) {
        ctx.shadowColor = rgba(color, displayAlpha[i] * 0.6);
        ctx.shadowBlur = 8;
      } else {
        ctx.shadowBlur = 0;
      }

      ctx.fillStyle = rgba(color, displayAlpha[i] * 0.85);
      ctx.fill();
    }
  }
  ctx.shadowBlur = 0;

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    hudContainer.classList.toggle('hidden', !clockVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', async () => {
  resize();
  await loadMatugenColors();
  if (typeof startClock === 'function') {
    startClock(clockEl, dateEl);
  }
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
