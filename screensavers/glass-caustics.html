<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Glass Caustics</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --surface_rgb: 6 10 16;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .92) 0%,
    rgb(var(--surface_rgb) / .55) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .45),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1;
let theme = {};
let lenses = [];
let start = performance.now();
let cursorTimer;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.2 : 0.6;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:   readRGB("--surface_rgb", [6, 10, 16]),
    primary:   readRGB("--primary_rgb", [138, 206, 255]),
    secondary: readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:  readRGB("--tertiary_rgb", [186, 196, 250]),
    outline:   readRGB("--outline_rgb", [137, 146, 154])
  };

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function initLenses() {
  lenses = [];
  const colors = [theme.primary, theme.secondary, theme.tertiary];
  for (let i = 0; i < 5; i++) {
    lenses.push({
      x: Math.random() * W,
      y: Math.random() * H,
      r: Math.min(W, H) * (0.2 + Math.random() * 0.25),
      phase: Math.random() * Math.PI * 2,
      speed: 0.05 + Math.random() * 0.08,
      orbitR: 25 + Math.random() * 60,
      color: colors[i % 3],
      intensity: 0.12 + Math.random() * 0.1
    });
  }
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initLenses();
}
addEventListener("resize", resize, { passive: true });

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 0.18);
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = "lighter";

  for (const L of lenses) {
    const lx = L.x + Math.cos(t * L.speed + L.phase) * L.orbitR;
    const ly = L.y + Math.sin(t * L.speed * 0.9 + L.phase * 1.2) * L.orbitR * 0.65;

    const focus = 0.6 + 0.2 * Math.sin(t * L.speed * 1.3 + L.phase);
    const outerR = L.r * (0.65 + 0.15 * focus);
    const rimR = L.r * (0.5 + 0.12 * Math.sin(t * 0.28 + L.phase));

    // Soft body — very low alpha
    const body = ctx.createRadialGradient(lx, ly, 0, lx, ly, outerR);
    body.addColorStop(0, rgba(L.color, L.intensity * 0.35));
    body.addColorStop(0.4, rgba(L.color, L.intensity * 0.12));
    body.addColorStop(1, "transparent");
    ctx.fillStyle = body;
    ctx.beginPath();
    ctx.arc(lx, ly, outerR, 0, Math.PI * 2);
    ctx.fill();

    // Thin rim
    ctx.beginPath();
    ctx.arc(lx, ly, rimR, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(L.color, L.intensity * 0.4);
    ctx.lineWidth = 1.5;
    ctx.stroke();

    // Subtle hot spot
    const hot = ctx.createRadialGradient(lx, ly, 0, lx, ly, rimR * 0.5);
    hot.addColorStop(0, rgba(L.color, L.intensity * 0.45));
    hot.addColorStop(1, "transparent");
    ctx.fillStyle = hot;
    ctx.beginPath();
    ctx.arc(lx, ly, rimR * 0.5, 0, Math.PI * 2);
    ctx.fill();
  }

  // Very soft global wash
  const gx = W * 0.5 + Math.cos(t * 0.06) * W * 0.18;
  const gy = H * 0.5 + Math.sin(t * 0.045) * H * 0.12;
  const global = ctx.createRadialGradient(gx, gy, 0, gx, gy, Math.max(W, H) * 0.5);
  global.addColorStop(0, rgba(theme.primary, 0.025));
  global.addColorStop(1, "transparent");
  ctx.fillStyle = global;
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockWrap.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
