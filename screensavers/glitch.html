<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Glitch</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233; --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250; --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27; --outline_rgb: 137 146 154;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock { position: fixed; left: 32px; bottom: 28px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; font-size: clamp(28px,4vw,56px); text-shadow: 0 0 24px rgba(0,0,0,0.4); pointer-events: none; transition: opacity 0.6s ease; }
  #clock .ampm { font-size: 0.36em; margin-left: 6px; opacity: 0.82; vertical-align: middle; }
  #date { position: fixed; left: 34px; bottom: 14px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: clamp(12px,1.2vw,16px); letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; transition: opacity 0.6s ease; }
  #hint { position: fixed; right: 28px; bottom: 26px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: 13px; letter-spacing: 0.5px; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="art"></canvas>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>
<script src="clock-shared.js"></script>
<script>
const artCanvas = document.getElementById('art');
const actx = artCanvas.getContext('2d');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  for (const cv of [artCanvas, canvas]) {
    cv.width = W * dpr; cv.height = H * dpr;
    cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  composeArt();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'), primary: readRGB('--primary_rgb'), secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'), primaryContainer: readRGB('--primary_container_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'), tertiaryContainer: readRGB('--tertiary_container_rgb'),
    outline: readRGB('--outline_rgb'),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer];
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

let shapes = [];
function composeArt() {
  shapes = [];
  const shapeCount = 9 + Math.floor(Math.random() * 6);
  for (let i = 0; i < shapeCount; i++) {
    const color = roleList[Math.floor(Math.random() * roleList.length)] || [150, 150, 150];
    const kind = Math.random() < 0.4 ? 'rect' : Math.random() < 0.75 ? 'circle' : 'diamond';
    shapes.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 14, vy: (Math.random() - 0.5) * 14,
      size: 30 + Math.random() * Math.min(W, H) * 0.28,
      w: 40 + Math.random() * W * 0.3, h: 8 + Math.random() * H * 0.2,
      rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.3,
      kind, color, alpha: 0.55 + Math.random() * 0.3,
    });
  }
}

function drawArt(dt) {
  actx.fillStyle = `rgb(${(theme.surface || [12, 20, 27]).join(',')})`;
  actx.fillRect(0, 0, W, H);
  for (const s of shapes) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.rot += s.rotSpeed * dt;
    if (s.x < -100) s.x = W + 100; if (s.x > W + 100) s.x = -100;
    if (s.y < -100) s.y = H + 100; if (s.y > H + 100) s.y = -100;

    actx.save();
    actx.translate(s.x, s.y);
    actx.rotate(s.rot);
    actx.fillStyle = rgba(s.color, s.alpha);
    if (s.kind === 'rect') {
      actx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
    } else if (s.kind === 'circle') {
      actx.beginPath();
      actx.arc(0, 0, s.size / 2, 0, Math.PI * 2);
      actx.fill();
    } else {
      const sz = s.size / 2;
      actx.beginPath();
      actx.moveTo(0, -sz); actx.lineTo(sz, 0); actx.lineTo(0, sz); actx.lineTo(-sz, 0);
      actx.closePath();
      actx.fill();
    }
    actx.restore();
  }
}

let nextCompose = 10 + Math.random() * 8;
let nextGlitch = 4 + Math.random() * 5;
let glitchUntil = 0;
let glitchSlices = [];

function triggerGlitch(t) {
  glitchUntil = t + 0.16 + Math.random() * 0.1;
  glitchSlices = [];
  const sliceCount = 3 + Math.floor(Math.random() * 4);
  for (let i = 0; i < sliceCount; i++) {
    glitchSlices.push({
      y: Math.random() * H,
      h: 6 + Math.random() * 40,
      shift: (Math.random() - 0.5) * 60,
    });
  }
}

let start = performance.now();
let lastT = 0;

function frame(now) {
  const t = (now - start) / 1000;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  if (t >= nextCompose) {
    composeArt();
    nextCompose = t + 16 + Math.random() * 12;
  }
  drawArt(dt);

  if (!reduceMotion && t >= nextGlitch) {
    triggerGlitch(t);
    nextGlitch = t + 5 + Math.random() * 7;
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (t < glitchUntil) {
    // brief chromatic-aberration + slice-shift burst, kept short and infrequent by design
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.55;
    ctx.drawImage(artCanvas, -3, 0, W, H);
    ctx.globalAlpha = 0.55;
    ctx.drawImage(artCanvas, 3, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(artCanvas, 0, 0, W, H);

    for (const s of glitchSlices) {
      ctx.drawImage(artCanvas, 0, s.y, W, s.h, s.shift, s.y, W, s.h);
    }
  } else {
    ctx.drawImage(artCanvas, 0, 0, W, H);
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});
hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();
  resize();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
