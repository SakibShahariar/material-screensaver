<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Glitch</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --primary_container_rgb: 0 75 111;
  --secondary_rgb: 180 199 233;
  --secondary_container_rgb: 53 72 99;
  --tertiary_rgb: 186 196 250;
  --tertiary_container_rgb: 58 68 114;
  --surface_rgb: 8 13 18;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas {
  display: block;
  position: absolute;
  inset: 0;
  width: 100vw;
  height: 100vh;
}
#art { z-index: 1; }
#c { z-index: 2; pointer-events: none; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .85) 0%,
    rgb(var(--surface_rgb) / .55) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="art"></canvas>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const artCanvas = document.getElementById("art");
const actx = artCanvas.getContext("2d", { alpha: false, desynchronized: true });
const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: true, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1;
let theme = {};
let roleList = [];
let shapes = [];
let start = performance.now();
let lastT = 0;
let nextCompose = 10;
let nextGlitch = 3;
let glitchUntil = 0;
let glitchSlices = [];
let cursorTimer;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.25 : 0.85;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:            readRGB("--surface_rgb", [8, 13, 18]),
    primary:            readRGB("--primary_rgb", [138, 206, 255]),
    secondary:          readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:           readRGB("--tertiary_rgb", [186, 196, 250]),
    primaryContainer:   readRGB("--primary_container_rgb", [0, 75, 111]),
    secondaryContainer: readRGB("--secondary_container_rgb", [53, 72, 99]),
    tertiaryContainer:  readRGB("--tertiary_container_rgb", [58, 68, 114]),
    outline:            readRGB("--outline_rgb", [137, 146, 154])
  };

  roleList = [
    theme.primary,
    theme.secondary,
    theme.tertiary,
    theme.primaryContainer,
    theme.secondaryContainer,
    theme.tertiaryContainer
  ];

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  for (const cv of [artCanvas, canvas]) {
    cv.width  = Math.floor(W * DPR);
    cv.height = Math.floor(H * DPR);
    cv.getContext("2d").setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  composeArt();
}
addEventListener("resize", resize, { passive: true });

function composeArt() {
  shapes = [];
  const count = 11 + Math.floor(Math.random() * 6);
  for (let i = 0; i < count; i++) {
    const kind = Math.random() < 0.4 ? "rect" : Math.random() < 0.72 ? "circle" : "diamond";
    shapes.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: (Math.random() - 0.5) * 14 * speedMul,
      vy: (Math.random() - 0.5) * 14 * speedMul,
      size: 36 + Math.random() * Math.min(W, H) * 0.28,
      w: 48 + Math.random() * W * 0.32,
      h: 10 + Math.random() * H * 0.18,
      rot: Math.random() * Math.PI * 2,
      rotSpeed: (Math.random() - 0.5) * 0.22 * speedMul,
      kind,
      color: roleList[Math.floor(Math.random() * roleList.length)] || [150, 150, 150],
      alpha: 0.55 + Math.random() * 0.35
    });
  }
}

function drawArt(dt) {
  actx.setTransform(DPR, 0, 0, DPR, 0, 0);
  actx.fillStyle = rgba(theme.surface, 1);
  actx.fillRect(0, 0, W, H);

  for (const s of shapes) {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    s.rot += s.rotSpeed * dt;

    if (s.x < -140) s.x = W + 140;
    if (s.x > W + 140) s.x = -140;
    if (s.y < -140) s.y = H + 140;
    if (s.y > H + 140) s.y = -140;

    actx.save();
    actx.translate(s.x, s.y);
    actx.rotate(s.rot);
    actx.fillStyle = rgba(s.color, s.alpha);

    if (s.kind === "rect") {
      actx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
    } else if (s.kind === "circle") {
      actx.beginPath();
      actx.arc(0, 0, s.size / 2, 0, Math.PI * 2);
      actx.fill();
    } else {
      const sz = s.size / 2;
      actx.beginPath();
      actx.moveTo(0, -sz);
      actx.lineTo(sz, 0);
      actx.lineTo(0, sz);
      actx.lineTo(-sz, 0);
      actx.closePath();
      actx.fill();
    }
    actx.restore();
  }
}

function triggerGlitch(t) {
  glitchUntil = t + 0.16 + Math.random() * 0.14;
  glitchSlices = [];
  const n = 5 + Math.floor(Math.random() * 5);
  for (let i = 0; i < n; i++) {
    glitchSlices.push({
      y: Math.random() * H,
      h: 6 + Math.random() * 42,
      shift: (Math.random() - 0.5) * 90
    });
  }
}

function frame(now) {
  const t = (now - start) / 1000;
  const dt = Math.min(0.05, t - lastT || 0.016);
  lastT = t;

  if (t >= nextCompose) {
    composeArt();
    nextCompose = t + 16 + Math.random() * 12;
  }

  drawArt(dt);

  if (!reduceMotion && t >= nextGlitch) {
    triggerGlitch(t);
    nextGlitch = t + 5 + Math.random() * 7;
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (t < glitchUntil) {
    // Chromatic split
    ctx.globalCompositeOperation = "lighter";
    ctx.globalAlpha = 0.55;
    ctx.drawImage(artCanvas, -6, 0, W, H);
    ctx.drawImage(artCanvas, 6, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = "source-over";
    ctx.drawImage(artCanvas, 0, 0, W, H);

    // Horizontal displacement slices
    for (const s of glitchSlices) {
      ctx.drawImage(artCanvas, 0, s.y, W, s.h, s.shift, s.y, W, s.h);
    }

    // Occasional thin scan line
    if (Math.random() < 0.4) {
      const ly = Math.random() * H;
      ctx.fillStyle = rgba(theme.primary || [180, 200, 255], 0.08);
      ctx.fillRect(0, ly, W, 1 + Math.random() * 2);
    }
  } else {
    ctx.drawImage(artCanvas, 0, 0, W, H);
  }

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockWrap.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
