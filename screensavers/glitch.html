<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Glitch</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233; --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250; --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 8 13 18; --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    cursor: none; font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
  }
  body.show-cursor { cursor: default; }
  canvas { display: block; width: 100vw; height: 100vh; position: absolute; top: 0; left: 0; }
  #art { z-index: 1; }
  #c { z-index: 2; pointer-events: none; }

  /* Redesigned Glassmorphic HUD Container */
  #hud-container {
    position: fixed; left: 48px; bottom: 48px; z-index: 10;
    pointer-events: none; transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
    display: flex; flex-direction: column; gap: 6px;
    padding: 24px 32px;
    background: rgb(var(--surface_rgb) / 0.5);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border: 1px solid rgb(var(--outline_rgb) / 0.15);
    border-radius: 24px;
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }
  #clock {
    font-weight: 200; font-variant-numeric: tabular-nums;
    letter-spacing: -2px; font-size: clamp(52px, 7vw, 84px);
    line-height: 0.95;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  #clock .ampm {
    font-size: 0.28em; margin-left: 8px; opacity: 0.75;
    vertical-align: super; font-weight: 500; letter-spacing: 1.5px;
  }
  #date {
    font-size: clamp(12px, 1.3vw, 15px); letter-spacing: 3.5px;
    font-weight: 500; text-transform: uppercase;
    opacity: 0.9;
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px; z-index: 10;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    opacity: 0; transition: opacity 0.8s ease;
    padding: 10px 18px;
    background: rgb(var(--surface_rgb) / 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgb(var(--outline_rgb) / 0.1);
    border-radius: 12px;
    pointer-events: none;
  }
  #hint.show { opacity: 0.7; }
  #hud-container.hidden { opacity: 0; transform: translateY(12px); }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="art"></canvas>
<canvas id="c"></canvas>
<div id="hud-container">
  <div id="clock">00:00</div>
  <div id="date">Mon, Jan 1</div>
</div>
<div id="hint">Press C to toggle clock</div>

<script src="clock-shared.js"></script>
<script>
const artCanvas = document.getElementById('art');
const actx = artCanvas.getContext('2d');
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const hudContainer = document.getElementById('hud-container');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let cursorTimeout;
window.addEventListener('pointermove', () => {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
});

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  for (const cv of [artCanvas, canvas]) {
    cv.width = W * dpr; cv.height = H * dpr;
    cv.getContext('2d').setTransform(dpr, 0, 0, dpr, 0, 0);
  }
  composeArt();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return fallback;
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function applyTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [8, 13, 18]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    secondaryContainer: readRGB('--secondary_container_rgb', [53, 72, 99]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer];
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color = rgba(theme.secondary, 0.9);
  hintEl.style.color = rgba(theme.outline, 1);
  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;
}

async function loadMatugenColors() {
  try {
    const res = await fetch('file:///home/sakib/.config/matugen/matugen-colors.css');
    if (res.ok) {
      const cssText = await res.text();
      const styleTag = document.createElement('style');
      styleTag.textContent = cssText;
      document.head.appendChild(styleTag);
    }
  } catch (e) {}
  applyTheme();
}

let shapes = [];
function composeArt() {
  shapes = [];
  const shapeCount = 10 + Math.floor(Math.random() * 6);
  for (let i = 0; i < shapeCount; i++) {
    const color = roleList[Math.floor(Math.random() * roleList.length)] || [150, 150, 150];
    const kind = Math.random() < 0.4 ? 'rect' : Math.random() < 0.75 ? 'circle' : 'diamond';
    shapes.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: (Math.random() - 0.5) * 12, vy: (Math.random() - 0.5) * 12,
      size: 40 + Math.random() * Math.min(W, H) * 0.3,
      w: 50 + Math.random() * W * 0.35, h: 10 + Math.random() * H * 0.2,
      rot: Math.random() * Math.PI * 2, rotSpeed: (Math.random() - 0.5) * 0.25,
      kind, color, alpha: 0.6 + Math.random() * 0.3,
    });
  }
}

function drawArt(dt) {
  actx.fillStyle = `rgb(${(theme.surface || [8, 13, 18]).join(',')})`;
  actx.fillRect(0, 0, W, H);
  for (const s of shapes) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    s.rot += s.rotSpeed * dt;
    if (s.x < -120) s.x = W + 120; if (s.x > W + 120) s.x = -120;
    if (s.y < -120) s.y = H + 120; if (s.y > H + 120) s.y = -120;

    actx.save();
    actx.translate(s.x, s.y);
    actx.rotate(s.rot);
    actx.fillStyle = rgba(s.color, s.alpha);
    if (s.kind === 'rect') {
      actx.fillRect(-s.w / 2, -s.h / 2, s.w, s.h);
    } else if (s.kind === 'circle') {
      actx.beginPath();
      actx.arc(0, 0, s.size / 2, 0, Math.PI * 2);
      actx.fill();
    } else {
      const sz = s.size / 2;
      actx.beginPath();
      actx.moveTo(0, -sz); actx.lineTo(sz, 0); actx.lineTo(0, sz); actx.lineTo(-sz, 0);
      actx.closePath();
      actx.fill();
    }
    actx.restore();
  }
}

let nextCompose = 12 + Math.random() * 8;
let nextGlitch = 3 + Math.random() * 5;
let glitchUntil = 0;
let glitchSlices = [];

function triggerGlitch(t) {
  glitchUntil = t + 0.18 + Math.random() * 0.12;
  glitchSlices = [];
  const sliceCount = 4 + Math.floor(Math.random() * 5);
  for (let i = 0; i < sliceCount; i++) {
    glitchSlices.push({
      y: Math.random() * H,
      h: 8 + Math.random() * 45,
      shift: (Math.random() - 0.5) * 80,
    });
  }
}

let start = performance.now();
let lastT = 0;

function frame(now) {
  const t = (now - start) / 1000;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  if (t >= nextCompose) {
    composeArt();
    nextCompose = t + 18 + Math.random() * 12;
  }
  drawArt(dt);

  if (!reduceMotion && t >= nextGlitch) {
    triggerGlitch(t);
    nextGlitch = t + 4 + Math.random() * 6;
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, W, H);

  if (t < glitchUntil) {
    // Enhanced chromatic aberration layers
    ctx.globalCompositeOperation = 'lighter';
    ctx.globalAlpha = 0.65;
    ctx.drawImage(artCanvas, -5, 0, W, H);
    ctx.globalAlpha = 0.65;
    ctx.drawImage(artCanvas, 5, 0, W, H);
    ctx.globalAlpha = 1;
    ctx.globalCompositeOperation = 'source-over';
    ctx.drawImage(artCanvas, 0, 0, W, H);

    // Horizontal glitch displacement slices
    for (const s of glitchSlices) {
      ctx.drawImage(artCanvas, 0, s.y, W, s.h, s.shift, s.y, W, s.h);
    }
  } else {
    ctx.drawImage(artCanvas, 0, 0, W, H);
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    hudContainer.classList.toggle('hidden', !clockVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', async () => {
  await loadMatugenColors();
  resize();
  if (typeof startClock === 'function') {
    startClock(clockEl, dateEl);
  }
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
