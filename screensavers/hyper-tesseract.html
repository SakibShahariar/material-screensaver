<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Hyper-Tesseract 4D</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --tertiary_rgb: 186 196 250;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.6s ease;
  }
  #ui-container.hidden { opacity: 0; }

  .vignette-card {
    background: radial-gradient(circle at center, rgba(12, 20, 27, 0.65) 0%, rgba(12, 20, 27, 0) 80%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 24px 32px;
    width: fit-content;
    border-radius: 20px;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7);
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
    vertical-align: middle;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-card">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint">Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}
window.addEventListener('pointermove', triggerCursor);

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, cx, cy;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };

  document.body.style.backgroundColor = rgba(theme.surface, 1);
  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

// Generate the 16 vertices of a 4D Hypercube (Tesseract)
const tesseractVertices = [];
for (let i = 0; i < 16; i++) {
  tesseractVertices.push([
    (i & 1) ? 1 : -1,
    (i & 2) ? 1 : -1,
    (i & 4) ? 1 : -1,
    (i & 8) ? 1 : -1
  ]);
}

// Generate the 32 edges connecting vertices that differ by only one coordinate
const tesseractEdges = [];
for (let i = 0; i < 16; i++) {
  for (let j = i + 1; j < 16; j++) {
    let diff = 0;
    for (let c = 0; c < 4; c++) {
      if (tesseractVertices[i][c] !== tesseractVertices[j][c]) diff++;
    }
    if (diff === 1) {
      tesseractEdges.push([i, j]);
    }
  }
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul * 0.4;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  // Rotation angles across multiple 4D planes
  const angleXY = t * 0.8;
  const angleZW = t * 0.5;
  const angleXW = t * 0.3;

  const projectedVertices = [];

  // Matrix transformations for 4D -> 3D -> 2D
  tesseractVertices.forEach(v => {
    let x = v[0], y = v[1], z = v[2], w = v[3];

    // 1. Rotate XY plane
    let cos = Math.cos(angleXY), sin = Math.sin(angleXY);
    let x1 = x * cos - y * sin;
    let y1 = x * sin + y * cos;
    x = x1; y = y1;

    // 2. Rotate ZW plane
    cos = Math.cos(angleZW); sin = Math.sin(angleZW);
    let z1 = z * cos - w * sin;
    let w1 = z * sin + w * cos;
    z = z1; w = w1;

    // 3. Rotate XW plane
    cos = Math.cos(angleXW); sin = Math.sin(angleXW);
    let x2 = x * cos - w * sin;
    let w2 = x * sin + w * cos;
    x = x2; w = w2;

    // 4D to 3D perspective projection (stereographic projection from 4D space)
    const distance4D = 2.5;
    let wScale = 1 / (distance4D - w);
    let x3 = x * wScale;
    let y3 = y * wScale;
    let z3 = z * wScale;

    // 3D to 2D perspective projection
    const distance3D = 3.5;
    let zScale = 1 / (distance3D - z3);
    const scaleFactor = Math.min(W, H) * 0.28;

    projectedVertices.push({
      x: cx + x3 * scaleFactor * zScale * 2.2,
      y: cy + y3 * scaleFactor * zScale * 2.2,
      depth: w + z3 // Combined depth metric for styling
    });
  });

  // Draw 32 edges with depth-based gradient styling
  tesseractEdges.forEach((edge, idx) => {
    const p1 = projectedVertices[edge[0]];
    const p2 = projectedVertices[edge[1]];

    const avgDepth = (p1.depth + p2.depth) / 2;
    const alpha = Math.max(0.08, Math.min(0.85, (avgDepth + 2) * 0.2));
    
    // Choose color channel dynamically per edge group
    const colKey = idx % 3 === 0 ? 'primary' : (idx % 3 === 1 ? 'secondary' : 'tertiary');
    
    ctx.beginPath();
    ctx.moveTo(p1.x, p1.y);
    ctx.lineTo(p2.x, p2.y);
    ctx.strokeStyle = rgba(theme[colKey], alpha);
    ctx.lineWidth = 1.5;
    ctx.stroke();
  });

  // Draw glowing vertex nodes
  projectedVertices.forEach(p => {
    const glowAlpha = Math.max(0.1, Math.min(0.9, (p.depth + 2) * 0.25));
    
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 12);
    grad.addColorStop(0, rgba(theme.primary, glowAlpha));
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = rgba(theme.primary, 0.95);
    ctx.fill();
  });

  requestAnimationFrame(frame);
}

function fallbackClock() {
  const update = () => {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;

    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', options);
  };
  update();
  setInterval(update, 1000);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();

  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      fallbackClock();
    }
  } catch (err) {
    fallbackClock();
  }

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
