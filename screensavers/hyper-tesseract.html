<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Hyper-Tesseract 4D</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --surface_rgb: 8 13 18;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .85) 0%,
    rgb(var(--surface_rgb) / .5) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0;
let theme = {};
let start = performance.now();
let cursorTimer;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.22 : 0.7;

// 16 vertices of unit tesseract
const verts4 = [];
for (let i = 0; i < 16; i++) {
  verts4.push([
    (i & 1) ? 1 : -1,
    (i & 2) ? 1 : -1,
    (i & 4) ? 1 : -1,
    (i & 8) ? 1 : -1
  ]);
}

// 32 edges (differ by one axis)
const edges = [];
for (let i = 0; i < 16; i++) {
  for (let j = i + 1; j < 16; j++) {
    let diff = 0;
    for (let c = 0; c < 4; c++) {
      if (verts4[i][c] !== verts4[j][c]) diff++;
    }
    if (diff === 1) edges.push([i, j]);
  }
}

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:   readRGB("--surface_rgb", [8, 13, 18]),
    primary:   readRGB("--primary_rgb", [138, 206, 255]),
    secondary: readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:  readRGB("--tertiary_rgb", [186, 196, 250]),
    outline:   readRGB("--outline_rgb", [137, 146, 154])
  };
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  cx = W * 0.5; cy = H * 0.5;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });

function project4(v, aXY, aZW, aXW, aYZ) {
  let x = v[0], y = v[1], z = v[2], w = v[3];

  // XY
  let c = Math.cos(aXY), s = Math.sin(aXY);
  let x1 = x * c - y * s;
  let y1 = x * s + y * c;
  x = x1; y = y1;

  // ZW
  c = Math.cos(aZW); s = Math.sin(aZW);
  let z1 = z * c - w * s;
  let w1 = z * s + w * c;
  z = z1; w = w1;

  // XW
  c = Math.cos(aXW); s = Math.sin(aXW);
  let x2 = x * c - w * s;
  let w2 = x * s + w * c;
  x = x2; w = w2;

  // YZ (extra plane for richer motion)
  c = Math.cos(aYZ); s = Math.sin(aYZ);
  let y2 = y * c - z * s;
  let z2 = y * s + z * c;
  y = y2; z = z2;

  // 4D → 3D
  const d4 = 2.6;
  const ws = 1 / (d4 - w);
  const x3 = x * ws;
  const y3 = y * ws;
  const z3 = z * ws;

  // 3D → 2D
  const d3 = 3.4;
  const zs = 1 / (d3 - z3);
  const scale = Math.min(W, H) * 0.3;

  return {
    x: cx + x3 * scale * zs * 2.15,
    y: cy + y3 * scale * zs * 2.15,
    depth: w + z3
  };
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul * 0.38;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 0.28);
  ctx.fillRect(0, 0, W, H);

  const aXY = t * 0.72;
  const aZW = t * 0.48;
  const aXW = t * 0.28;
  const aYZ = t * 0.18;

  const projected = verts4.map(v => project4(v, aXY, aZW, aXW, aYZ));

  // Depth-sort edges back → front
  const edgeDraw = edges.map((e, i) => {
    const p1 = projected[e[0]];
    const p2 = projected[e[1]];
    return {
      p1, p2,
      depth: (p1.depth + p2.depth) * 0.5,
      idx: i
    };
  }).sort((a, b) => a.depth - b.depth);

  const roles = [theme.primary, theme.secondary, theme.tertiary];
  ctx.lineCap = "round";

  for (const e of edgeDraw) {
    const alpha = Math.max(0.12, Math.min(0.9, (e.depth + 2.2) * 0.24));
    const col = roles[e.idx % 3] || theme.primary;

    ctx.beginPath();
    ctx.moveTo(e.p1.x, e.p1.y);
    ctx.lineTo(e.p2.x, e.p2.y);
    ctx.strokeStyle = rgba(col, alpha);
    ctx.lineWidth = 1.5 + alpha * 1.2;
    ctx.stroke();
  }

  // Vertices
  for (const p of projected) {
    const glow = Math.max(0.15, Math.min(0.95, (p.depth + 2.2) * 0.3));
    const grad = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, 12);
    grad.addColorStop(0, rgba(theme.primary, glow * 0.7));
    grad.addColorStop(1, "transparent");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(p.x, p.y, 12, 0, Math.PI * 2);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(p.x, p.y, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = rgba(theme.primary, 0.95);
    ctx.fill();
  }

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockWrap.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
