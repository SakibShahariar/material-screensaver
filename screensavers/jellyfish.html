<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Jellyfish</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 6 12 20;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb, 6 12 20));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 48px; box-sizing: border-box;
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #ui-container.hidden { opacity: 0; transform: translateY(12px); }

  .vignette-card {
    background: radial-gradient(circle at bottom left, rgb(var(--surface_rgb) / 0.75) 0%, rgb(var(--surface_rgb) / 0.2) 70%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 28px 36px;
    width: fit-content;
    border-radius: 24px;
    border: 1px solid rgb(var(--outline_rgb) / 0.15);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  #clock {
    font-size: clamp(52px, 7vw, 84px);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    line-height: 0.95;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  #clock .ampm {
    font-size: 0.28em;
    margin-left: 8px;
    opacity: 0.75;
    font-weight: 500;
    text-transform: uppercase;
    vertical-align: super;
    letter-spacing: 1.5px;
  }
  #date {
    font-size: clamp(12px, 1.3vw, 15px);
    letter-spacing: 3.5px;
    text-transform: uppercase;
    margin-top: 10px;
    opacity: 0.9;
    font-weight: 500;
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    opacity: 0; transition: opacity 0.8s ease;
    padding: 10px 18px;
    background: rgb(var(--surface_rgb) / 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgb(var(--outline_rgb) / 0.1);
    border-radius: 12px;
    pointer-events: none;
  }
  #hint.show { opacity: 0.7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-card">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
</div>
<div id="hint">Press <b>C</b> to toggle UI</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let mouse = { x: -1000, y: -1000, vx: 0, vy: 0, lastX: -1000, lastY: -1000 };
let cursorTimeout;

window.addEventListener('pointermove', (e) => {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);

  mouse.vx = e.clientX - mouse.lastX;
  mouse.vy = e.clientY - mouse.lastY;
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.lastX = e.clientX;
  mouse.lastY = e.clientY;
});

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
let roleList = [];

async function loadMatugenColors() {
  try {
    const res = await fetch('file:///home/sakib/.config/matugen/matugen-colors.css');
    if (res.ok) {
      const cssText = await res.text();
      const styleTag = document.createElement('style');
      styleTag.textContent = cssText;
      document.head.appendChild(styleTag);
    }
  } catch (e) {}
  applyTheme();
}

function applyTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [6, 12, 20]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    secondaryContainer: readRGB('--secondary_container_rgb', [53, 72, 99]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer];
  
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color = rgba(theme.secondary, 0.9);
  hintEl.style.color = rgba(theme.outline, 1);
  
  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;
  jellies.forEach((j, i) => { j.color = roleList[i % roleList.length]; });
}

let jellies = [];
function makeJellies() {
  jellies = [];
  for (let i = 0; i < 9; i++) {
    const depth = Math.random();
    jellies.push({
      x: Math.random() * W,
      y: H + Math.random() * H * 0.5,
      depth,
      bellW: (28 + Math.random() * 22) * (0.5 + depth * 0.7),
      pulsePhase: Math.random() * Math.PI * 2,
      pulseFreq: 0.35 + Math.random() * 0.25,
      driftAmp: 25 + Math.random() * 35,
      driftFreq: 0.08 + Math.random() * 0.12,
      driftPhase: Math.random() * Math.PI * 2,
      tentacleCount: 5 + Math.floor(Math.random() * 3),
      color: [200, 200, 200],
    });
  }
}

function drawJelly(j, t) {
  const pulse = (Math.sin(t * j.pulseFreq + j.pulsePhase) + 1) / 2;
  const bellSquash = 1 - pulse * 0.28;
  const x = j.x + Math.sin(t * j.driftFreq + j.driftPhase) * j.driftAmp;
  const alpha = 0.35 + j.depth * 0.5;

  const dx = x - mouse.x;
  const dy = j.y - mouse.y;
  const dist = Math.sqrt(dx * dx + dy * dy);
  if (dist < 220) {
    const force = (1 - dist / 220) * 40;
    j.x += (dx / dist) * force * 0.04;
  }

  const glowR = j.bellW * (2.4 + pulse * 0.6);
  const grad = ctx.createRadialGradient(x, j.y, 0, x, j.y, glowR);
  grad.addColorStop(0, rgba(j.color, (alpha * 0.55) + (pulse * 0.25)));
  grad.addColorStop(1, rgba(j.color, 0));
  ctx.fillStyle = grad;
  ctx.beginPath();
  ctx.arc(x, j.y, glowR, 0, Math.PI * 2);
  ctx.fill();

  // Bell dome
  ctx.beginPath();
  ctx.ellipse(x, j.y, j.bellW, j.bellW * 0.65 * bellSquash, 0, Math.PI, 0, false);
  ctx.quadraticCurveTo(x + j.bellW, j.y + j.bellW * 0.15, x, j.y + j.bellW * 0.1);
  ctx.quadraticCurveTo(x - j.bellW, j.y + j.bellW * 0.15, x - j.bellW, j.y);
  ctx.closePath();
  ctx.fillStyle = rgba(j.color, alpha + pulse * 0.15);
  ctx.fill();

  // Tentacles
  ctx.strokeStyle = rgba(j.color, alpha * 0.65);
  ctx.lineWidth = 1.3 * (0.5 + j.depth);
  for (let k = 0; k < j.tentacleCount; k++) {
    const tx = x - j.bellW * 0.7 + (k / (j.tentacleCount - 1)) * j.bellW * 1.4;
    const len = j.bellW * (1.4 + Math.sin(k * 1.7) * 0.3);
    ctx.beginPath();
    ctx.moveTo(tx, j.y + j.bellW * 0.15);
    const wob1 = Math.sin(t * 1.4 + k + j.pulsePhase) * (j.bellW * 0.25 + mouse.vx * 0.2);
    const wob2 = Math.sin(t * 1.0 + k * 1.5 + j.pulsePhase) * (j.bellW * 0.35 + mouse.vy * 0.2);
    ctx.quadraticCurveTo(tx + wob1, j.y + len * 0.5, tx + wob2, j.y + len);
    ctx.stroke();
  }
}

let particles = [];
function makeParticles() {
  particles = [];
  for (let i = 0; i < 55; i++) {
    particles.push({ 
      x: Math.random() * W, 
      y: Math.random() * H, 
      r: 0.4 + Math.random() * 1.4, 
      speed: 2 + Math.random() * 6,
      alpha: 0.1 + Math.random() * 0.25
    });
  }
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const surf = theme.surface || [6, 12, 20];
  const water = ctx.createLinearGradient(0, 0, 0, H);
  water.addColorStop(0, `rgb(${surf.map(v => Math.min(255, v + 12)).join(',')})`);
  water.addColorStop(1, `rgb(${surf.map(v => Math.max(0, v - 8)).join(',')})`);
  ctx.fillStyle = water;
  ctx.fillRect(0, 0, W, H);

  // Light rays
  ctx.globalAlpha = 0.045;
  for (let i = 0; i < 4; i++) {
    const rx = W * (0.15 + i * 0.25) + Math.sin(t * 0.2 + i) * 35;
    ctx.beginPath();
    ctx.moveTo(rx - 50, 0);
    ctx.lineTo(rx + 50, 0);
    ctx.lineTo(rx + 120, H);
    ctx.lineTo(rx - 120, H);
    ctx.closePath();
    ctx.fillStyle = rgba(theme.primary, 1);
    ctx.fill();
  }
  ctx.globalAlpha = 1;

  // Floating plankton
  for (const p of particles) {
    p.y -= p.speed * 0.016 * speedMul;
    p.x += Math.sin(t + p.y * 0.01) * 0.2;
    if (p.y < 0) { p.y = H; p.x = Math.random() * W; }
    ctx.beginPath();
    ctx.arc(p.x, p.y, p.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha})`;
    ctx.fill();
  }

  // Jellies
  jellies.sort((a, b) => a.depth - b.depth);
  for (const j of jellies) {
    const pulse = (Math.sin(t * j.pulseFreq + j.pulsePhase) + 1) / 2;
    j.y -= (0.45 + pulse * 1.9) * (0.5 + j.depth * 0.7) * speedMul;
    if (j.y < -j.bellW * 3) {
      j.y = H + j.bellW * 2;
      j.x = Math.random() * W;
    }
    drawJelly(j, t);
  }

  mouse.vx *= 0.92;
  mouse.vy *= 0.92;

  requestAnimationFrame(frame);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', async () => {
  makeJellies();
  makeParticles();
  await loadMatugenColors();
  
  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      const update = () => {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;
        dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      };
      update();
      setInterval(update, 1000);
    }
  } catch (err) {}

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
