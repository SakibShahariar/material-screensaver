<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Content-Security-Policy" content="default-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self' data:; media-src 'self' data:; connect-src 'none';">
<title>Material Screensaver — Julia Bloom</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --primary_container_rgb: 0 75 111;
  --secondary_rgb: 180 199 233;
  --secondary_container_rgb: 53 72 99;
  --tertiary_rgb: 186 196 250;
  --tertiary_container_rgb: 58 68 114;
  --inverse_primary_rgb: 0 100 145;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }
#clock {
  position: fixed;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(40px, 4.5vw, 56px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow: 0 0 40px rgb(var(--primary_rgb) / .4), 0 2px 16px rgba(0,0,0,.6);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock .ampm {
  font-size: .26em; margin-left: 10px; opacity: .7;
  vertical-align: 22%; letter-spacing: 2px; font-weight: 400;
}
#date {
  position: fixed;
  left: clamp(30px, 3.1vw, 50px);
  bottom: clamp(18px, 2.2vw, 28px);
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px; text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 10px rgba(0,0,0,.5);
  pointer-events: none; transition: opacity .7s ease;
}
#clock.hidden, #date.hidden { opacity: 0; }
#hint {
  position: fixed; right: 28px; bottom: 24px;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase; pointer-events: none;
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00<span class="ampm">AM</span></div>
<div id="date">MON, JAN 1</div>
<div id="hint">C · toggle clock</div>
<script>

"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");

let W = 0, H = 0, DPR = 1;
let theme = {};
let roleList = [];
let start = performance.now();
let lastT = 0;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
function loadTheme() {
  theme = {
    surface:   readRGB("--surface_rgb", [12, 20, 27]),
    primary:   readRGB("--primary_rgb", [138, 206, 255]),
    secondary: readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:  readRGB("--tertiary_rgb", [186, 196, 250]),
    container: readRGB("--tertiary_container_rgb", [58, 68, 114]),
    outline:   readRGB("--outline_rgb", [137, 146, 154])
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary];
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.97);
  dateEl.style.color = rgba(theme.secondary, 0.88);
  hintEl.style.color = rgba(theme.outline, 0.6);
}
function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });
addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockEl.classList.toggle("hidden");
    dateEl.classList.toggle("hidden");
  }
});
function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}
addEventListener("load", () => {
  loadTheme();
  resize();
  initScene();
  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);
  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);
  requestAnimationFrame(frame);
});


const speedMul = reduceMotion ? 0.25 : 1;
let glc = null, gl = null, program = null, uni = {};

function initScene() {
  glc = document.createElement("canvas");
  glc.style.cssText = "position:fixed;inset:0;width:100vw;height:100vh;display:block";
  document.body.insertBefore(glc, canvas);
  canvas.style.display = "none";
  try { gl = glc.getContext("webgl2", { alpha: false, antialias: false }); }
  catch { gl = null; }
  if (!gl) return;
  const vs = `#version 300 es
  in vec2 a; void main(){ gl_Position = vec4(a, 0.0, 1.0); }`;
  const fs = `#version 300 es
  precision highp float;
  out vec4 outColor;
  uniform vec2 u_res;
  uniform float u_time;
  uniform vec3 u_primary, u_secondary, u_surface;
  void main(){
    vec2 uv = (gl_FragCoord.xy - 0.5 * u_res) / min(u_res.x, u_res.y);
    float zoom = 1.35 + 0.22 * sin(u_time * 0.05);
    vec2 z = uv * zoom;
    vec2 c = vec2(-0.745 + 0.045 * sin(u_time * 0.031),
                  0.113 + 0.045 * cos(u_time * 0.027));
    float esc = 0.0;
    for (int i = 0; i < 140; i++) {
      z = vec2(z.x*z.x - z.y*z.y, 2.0*z.x*z.y) + c;
      if (dot(z, z) > 64.0) { esc = float(i); break; }
    }
    float m = esc > 0.0 ? esc / 140.0 : 0.0;
    m = pow(m, 0.42);
    vec3 col = mix(u_surface, mix(u_primary, u_secondary, m), smoothstep(0.0, 0.85, m));
    outColor = vec4(col, 1.0);
  }`;
  function shader(type, src) {
    const s = gl.createShader(type);
    gl.shaderSource(s, src); gl.compileShader(s);
    if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) return null;
    return s;
  }
  const v = shader(gl.VERTEX_SHADER, vs), f = shader(gl.FRAGMENT_SHADER, fs);
  if (!v || !f) { gl = null; return; }
  program = gl.createProgram();
  gl.attachShader(program, v); gl.attachShader(program, f);
  gl.linkProgram(program);
  if (!gl.getProgramParameter(program, gl.LINK_STATUS)) { gl = null; return; }
  gl.useProgram(program);
  const buf = gl.createBuffer();
  gl.bindBuffer(gl.ARRAY_BUFFER, buf);
  gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1,-1, 3,-1, -1,3]), gl.STATIC_DRAW);
  const loc = gl.getAttribLocation(program, "a");
  gl.enableVertexAttribArray(loc);
  gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
  uni = {
    res: gl.getUniformLocation(program, "u_res"),
    time: gl.getUniformLocation(program, "u_time"),
    primary: gl.getUniformLocation(program, "u_primary"),
    secondary: gl.getUniformLocation(program, "u_secondary"),
    surface: gl.getUniformLocation(program, "u_surface")
  };
  addEventListener("resize", resizeGL, { passive: true });
  resizeGL();
}

function resizeGL() {
  if (!gl) return;
  glc.width = Math.floor(innerWidth * DPR);
  glc.height = Math.floor(innerHeight * DPR);
  gl.viewport(0, 0, glc.width, glc.height);
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  if (!gl) {
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    ctx.fillStyle = rgba(theme.surface, 1);
    ctx.fillRect(0, 0, W, H);
    ctx.fillStyle = rgba(theme.primary, 0.8);
    ctx.font = "18px sans-serif";
    ctx.fillText("WebGL2 unavailable", 40, 60);
    requestAnimationFrame(frame);
    return;
  }
  gl.useProgram(program);
  gl.uniform2f(uni.res, glc.width, glc.height);
  gl.uniform1f(uni.time, t);
  const norm = c => [c[0] / 255, c[1] / 255, c[2] / 255];
  const p = norm(theme.primary), s = norm(theme.secondary), b = norm(theme.surface);
  gl.uniform3f(uni.primary, p[0], p[1], p[2]);
  gl.uniform3f(uni.secondary, s[0], s[1], s[2]);
  gl.uniform3f(uni.surface, b[0], b[1], b[2]);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  requestAnimationFrame(frame);
}

</script>
</body>
</html>
