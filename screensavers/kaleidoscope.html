<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Kaleidoscope</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_rgb: 219 227 237;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 48px; box-sizing: border-box;
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #ui-container.hidden { opacity: 0; transform: translateY(12px); }

  .vignette-card {
    background: radial-gradient(circle at bottom left, rgb(var(--surface_rgb) / 0.75) 0%, rgb(var(--surface_rgb) / 0.2) 70%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 28px 36px;
    width: fit-content;
    border-radius: 24px;
    border: 1px solid rgb(var(--outline_rgb) / 0.15);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  #clock {
    font-size: clamp(52px, 7vw, 84px);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    line-height: 0.95;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  #clock .ampm {
    font-size: 0.28em;
    margin-left: 8px;
    opacity: 0.75;
    font-weight: 500;
    text-transform: uppercase;
    vertical-align: super;
    letter-spacing: 1.5px;
  }
  #date {
    font-size: clamp(12px, 1.3vw, 15px);
    letter-spacing: 3.5px;
    text-transform: uppercase;
    margin-top: 10px;
    opacity: 0.9;
    font-weight: 500;
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    opacity: 0; transition: opacity 0.8s ease;
    padding: 10px 18px;
    background: rgb(var(--surface_rgb) / 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgb(var(--outline_rgb) / 0.1);
    border-radius: 12px;
    pointer-events: none;
  }
  #hint.show { opacity: 0.7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-card">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
</div>
<div id="hint">Press <b>C</b> to toggle UI</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}
window.addEventListener('pointermove', triggerCursor);

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, cx, cy;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const surf = theme.surface || [12, 20, 27];
  ctx.fillStyle = `rgb(${surf.join(',')})`;
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.15 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
let roleList = [];

async function loadMatugenColors() {
  try {
    const res = await fetch('file:///home/sakib/.config/matugen/matugen-colors.css');
    if (res.ok) {
      const cssText = await res.text();
      const styleTag = document.createElement('style');
      styleTag.textContent = cssText;
      document.head.appendChild(styleTag);
    }
  } catch (e) {}
  applyTheme();
}

function applyTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    secondaryContainer: readRGB('--secondary_container_rgb', [53, 72, 99]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    inversePrimary: readRGB('--inverse_primary_rgb', [0, 100, 145]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer, theme.inversePrimary];

  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color = rgba(theme.secondary, 0.9);
  hintEl.style.color = rgba(theme.outline, 1);
  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;

  motifs.forEach((m, i) => { m.color = roleList[i % roleList.length]; });
}

const SEGMENTS = 12;
const MOTIF_COUNT = 11;
let motifs = [];

function makeMotifs() {
  motifs = [];
  for (let i = 0; i < MOTIF_COUNT; i++) {
    motifs.push({
      color: [200, 200, 200],
      baseRadius: 0.08 + Math.random() * 0.34,
      radiusAmp: 0.02 + Math.random() * 0.05,
      radiusSpeed: 0.05 + Math.random() * 0.09,
      angleBase: Math.random() * (Math.PI * 2) / SEGMENTS,
      angleAmp: 0.15 + Math.random() * 0.35,
      angleSpeed: 0.06 + Math.random() * 0.12,
      size: 0.025 + Math.random() * 0.045,
      sizePulseSpeed: 0.15 + Math.random() * 0.2,
      phase: Math.random() * Math.PI * 2,
    });
  }
}

function drawMotif(m, t, scale) {
  const radius = (m.baseRadius + Math.sin(t * m.radiusSpeed + m.phase) * m.radiusAmp) * scale;
  const angle = m.angleBase + Math.sin(t * m.angleSpeed + m.phase * 1.7) * m.angleAmp;
  const size = (m.size + Math.sin(t * m.sizePulseSpeed + m.phase) * m.size * 0.3) * scale;

  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius;

  ctx.beginPath();
  ctx.arc(x, y, size, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(x - size * 0.3, y - size * 0.3, size * 0.1, x, y, size);
  grad.addColorStop(0, rgba(m.color, 0.75));
  grad.addColorStop(0.75, rgba(m.color, 0.55));
  grad.addColorStop(1, rgba(m.color, 0.2));
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.beginPath();
  ctx.arc(x - size * 0.32, y - size * 0.32, size * 0.28, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255,255,255,0.35)';
  ctx.fill();
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const scale = Math.min(W, H);
  const globalRotation = t * 0.035;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rgba(theme.surface || [12, 20, 27], 0.4);
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(globalRotation);

  const wedgeAngle = (Math.PI * 2) / SEGMENTS;
  for (let k = 0; k < SEGMENTS; k++) {
    ctx.save();
    ctx.rotate(wedgeAngle * k);
    if (k % 2 === 1) ctx.scale(1, -1);
    for (const m of motifs) drawMotif(m, t, scale);
    ctx.restore();
  }

  ctx.restore();

  requestAnimationFrame(frame);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', async () => {
  resize();
  makeMotifs();
  await loadMatugenColors();

  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      const update = () => {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;
        dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      };
      update();
      setInterval(update, 1000);
    }
  } catch (err) {}

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
