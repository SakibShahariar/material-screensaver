<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Kaleidoscope</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_rgb: 219 227 237;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  /* Hidden cursor on launch */
  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  /* UI Layer */
  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.8s ease;
  }
  #ui-container.hidden { opacity: 0; }

  .vignette-glass {
    background: radial-gradient(circle at center, rgba(12, 20, 27, 0.55) 0%, rgba(12, 20, 27, 0) 80%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 28px 40px;
    width: fit-content;
    border-radius: 24px;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-glass">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint">Move mouse to distort • Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

// ---- Auto-Hide Cursor Engine ----
let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}

// Pointer Interactive Offset
let mouse = { x: 0, y: 0, targetX: 0, targetY: 0, active: false };
window.addEventListener('pointermove', (e) => {
  triggerCursor();
  mouse.targetX = (e.clientX - cx) / cx;
  mouse.targetY = (e.clientY - cy) / cy;
  mouse.active = true;
});
window.addEventListener('pointerleave', () => {
  mouse.active = false;
  mouse.targetX = 0;
  mouse.targetY = 0;
});

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, cx, cy;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = 'rgb(12, 20, 27)';
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.15 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'),
    primary: readRGB('--primary_rgb'),
    primaryContainer: readRGB('--primary_container_rgb'),
    secondary: readRGB('--secondary_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'),
    tertiary: readRGB('--tertiary_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'),
    inversePrimary: readRGB('--inverse_primary_rgb'),
    outline: readRGB('--outline_rgb'),
  };
  roleList = [
    theme.primary, theme.secondary, theme.tertiary,
    theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer,
    theme.inversePrimary
  ];

  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);

  motifs.forEach((m, i) => { m.color = roleList[i % roleList.length]; });
}

const SEGMENTS = 16; // Refined optical symmetry
const MOTIF_COUNT = 16;
let motifs = [];

function makeMotifs() {
  motifs = [];
  for (let i = 0; i < MOTIF_COUNT; i++) {
    motifs.push({
      color: [200, 200, 200],
      baseRadius: 0.05 + Math.random() * 0.38,
      radiusAmp: 0.03 + Math.random() * 0.07,
      radiusSpeed: 0.04 + Math.random() * 0.08,
      angleBase: Math.random() * (Math.PI * 2) / SEGMENTS,
      angleAmp: 0.12 + Math.random() * 0.3,
      angleSpeed: 0.05 + Math.random() * 0.1,
      size: 0.018 + Math.random() * 0.04,
      sizePulseSpeed: 0.12 + Math.random() * 0.18,
      phase: Math.random() * Math.PI * 2,
      ringShape: Math.random() > 0.4
    });
  }
}

function drawMotif(m, t, scale) {
  // Add subtle cursor position distortion
  const mouseDistortion = (mouse.x * 0.05);
  const radius = (m.baseRadius + Math.sin(t * m.radiusSpeed + m.phase + mouseDistortion) * m.radiusAmp) * scale;
  const angle = m.angleBase + Math.sin(t * m.angleSpeed + m.phase * 1.7) * m.angleAmp + (mouse.y * 0.08);
  const size = (m.size + Math.sin(t * m.sizePulseSpeed + m.phase) * m.size * 0.35) * scale;

  const x = Math.cos(angle) * radius;
  const y = Math.sin(angle) * radius;

  // Glassy Bead Rendering
  ctx.beginPath();
  ctx.arc(x, y, size, 0, Math.PI * 2);
  const grad = ctx.createRadialGradient(x - size * 0.3, y - size * 0.3, size * 0.1, x, y, size);
  grad.addColorStop(0, rgba(m.color, 0.85));
  grad.addColorStop(0.65, rgba(m.color, 0.5));
  grad.addColorStop(1, rgba(m.color, 0.15));
  ctx.fillStyle = grad;
  ctx.fill();

  // Specular Highlight
  ctx.beginPath();
  ctx.arc(x - size * 0.32, y - size * 0.32, size * 0.28, 0, Math.PI * 2);
  ctx.fillStyle = 'rgba(255, 255, 255, 0.45)';
  ctx.fill();

  // Concentric Shimmer Ring
  if (m.ringShape) {
    ctx.beginPath();
    ctx.arc(x, y, size * 1.4, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(m.color, 0.25);
    ctx.lineWidth = 1;
    ctx.stroke();
  }
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const scale = Math.min(W, H);
  const globalRotation = t * 0.03;

  // Smooth mouse interpolation
  mouse.x += (mouse.targetX - mouse.x) * 0.05;
  mouse.y += (mouse.targetY - mouse.y) * 0.05;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  
  // Soft fade trail
  ctx.fillStyle = rgba(theme.surface || [12, 20, 27], 0.35);
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(globalRotation);

  const wedgeAngle = (Math.PI * 2) / SEGMENTS;
  for (let k = 0; k < SEGMENTS; k++) {
    ctx.save();
    ctx.rotate(wedgeAngle * k);
    if (k % 2 === 1) ctx.scale(1, -1);
    for (const m of motifs) drawMotif(m, t, scale);
    ctx.restore();
  }

  ctx.restore();

  requestAnimationFrame(frame);
}

if (typeof startClock === 'function') {
  startClock(clockEl, dateEl);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  makeMotifs();
  loadTheme();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
