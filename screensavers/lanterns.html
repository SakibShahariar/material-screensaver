<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Lanterns</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock {
    position: fixed; left: 32px; bottom: 28px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
    font-size: clamp(28px, 4vw, 56px);
    text-shadow: 0 0 24px rgba(0,0,0,0.4);
    pointer-events: none; transition: opacity 0.6s ease;
  }
  #clock .ampm {
    font-size: 0.36em;
    margin-left: 6px;
    opacity: 0.82;
    vertical-align: middle;
  }
  #date {
    position: fixed; left: 34px; bottom: 14px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: clamp(12px, 1.2vw, 16px); letter-spacing: 1.5px; text-transform: uppercase;
    pointer-events: none; transition: opacity 0.6s ease;
  }
  #hint {
    position: fixed; right: 28px; bottom: 26px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 13px; letter-spacing: 0.5px;
    pointer-events: none; opacity: 0; transition: opacity 0.8s ease;
  }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'),
    primary: readRGB('--primary_rgb'),
    secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'),
    primaryContainer: readRGB('--primary_container_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'),
    outline: readRGB('--outline_rgb'),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer];
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

let lanterns = [];

function spawnLantern(l) {
  l.x = Math.random() * W;
  l.y = H + 60;
  l.w = 22 + Math.random() * 16;
  l.h = l.w * 1.3;
  l.riseSpeed = 12 + Math.random() * 14;
  l.swayAmp = 12 + Math.random() * 20;
  l.swayFreq = 0.15 + Math.random() * 0.2;
  l.phase = Math.random() * Math.PI * 2;
  l.color = roleList.length ? roleList[Math.floor(Math.random() * roleList.length)] : [255, 180, 100];
  l.flicker = Math.random() * Math.PI * 2;
}

function initLanterns() {
  lanterns = [];
  for (let i = 0; i < 14; i++) {
    const l = {};
    spawnLantern(l);
    l.y = Math.random() * H;
    lanterns.push(l);
  }
}

let stars = [];
function makeStars() {
  stars = [];
  const count = Math.floor((W * H) / 11000);
  for (let i = 0; i < count; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.6, r: 0.4 + Math.random() * 1, phase: Math.random() * Math.PI * 2 });
  }
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgb(${(theme.surface || [12, 20, 27]).join(',')})`;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const tw = 0.3 + 0.6 * Math.abs(Math.sin(t * 0.4 + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${tw * 0.6})`;
    ctx.fill();
  }

  for (const l of lanterns) {
    l.y -= l.riseSpeed / 60;
    const x = l.x + Math.sin(t * l.swayFreq + l.phase) * l.swayAmp;
    const fadeIn = Math.min(1, (H - l.y) / (H * 0.12));
    const fadeOut = Math.min(1, l.y / (H * 0.15));
    const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
    const flicker = 0.85 + 0.15 * Math.sin(t * 3 + l.flicker);

    if (l.y < -50 || alpha <= 0.001 && l.y < H * 0.5) {
      if (l.y < -50) { spawnLantern(l); continue; }
    }

    // glow
    const glowR = l.w * 2.2;
    const grad = ctx.createRadialGradient(x, l.y, 0, x, l.y, glowR);
    grad.addColorStop(0, rgba(l.color, 0.35 * alpha * flicker));
    grad.addColorStop(1, rgba(l.color, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, l.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    // lantern body
    ctx.beginPath();
    ctx.ellipse(x, l.y, l.w / 2, l.h / 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = rgba(l.color, 0.75 * alpha * flicker);
    ctx.fill();

    // top/bottom caps
    ctx.fillStyle = rgba(theme.outline, 0.5 * alpha);
    ctx.fillRect(x - l.w * 0.15, l.y - l.h / 2 - 3, l.w * 0.3, 4);
    ctx.fillRect(x - l.w * 0.15, l.y + l.h / 2 - 1, l.w * 0.3, 4);
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();
  initLanterns();
  makeStars();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
