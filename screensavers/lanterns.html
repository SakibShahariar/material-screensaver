<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Lanterns</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 48px; box-sizing: border-box;
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #ui-container.hidden { opacity: 0; transform: translateY(12px); }

  .vignette-card {
    background: radial-gradient(circle at bottom left, rgb(var(--surface_rgb) / 0.75) 0%, rgb(var(--surface_rgb) / 0.2) 70%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 28px 36px;
    width: fit-content;
    border-radius: 24px;
    border: 1px solid rgb(var(--outline_rgb) / 0.15);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  #clock {
    font-size: clamp(52px, 7vw, 84px);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    line-height: 0.95;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  #clock .ampm {
    font-size: 0.28em;
    margin-left: 8px;
    opacity: 0.75;
    font-weight: 500;
    text-transform: uppercase;
    vertical-align: super;
    letter-spacing: 1.5px;
  }
  #date {
    font-size: clamp(12px, 1.3vw, 15px);
    letter-spacing: 3.5px;
    text-transform: uppercase;
    margin-top: 10px;
    opacity: 0.9;
    font-weight: 500;
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    opacity: 0; transition: opacity 0.8s ease;
    padding: 10px 18px;
    background: rgb(var(--surface_rgb) / 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgb(var(--outline_rgb) / 0.1);
    border-radius: 12px;
    pointer-events: none;
  }
  #hint.show { opacity: 0.7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-card">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
</div>
<div id="hint">Press <b>C</b> to toggle UI</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}
window.addEventListener('pointermove', triggerCursor);

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
let roleList = [];

async function loadMatugenColors() {
  try {
    const res = await fetch('file:///home/sakib/.config/matugen/matugen-colors.css');
    if (res.ok) {
      const cssText = await res.text();
      const styleTag = document.createElement('style');
      styleTag.textContent = cssText;
      document.head.appendChild(styleTag);
    }
  } catch (e) {}
  applyTheme();
}

function applyTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    secondaryContainer: readRGB('--secondary_container_rgb', [53, 72, 99]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer];

  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color = rgba(theme.secondary, 0.9);
  hintEl.style.color = rgba(theme.outline, 1);
  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;
}

let lanterns = [];

function spawnLantern(l) {
  l.x = Math.random() * W;
  l.y = H + 60;
  l.w = 22 + Math.random() * 16;
  l.h = l.w * 1.3;
  l.riseSpeed = 12 + Math.random() * 14;
  l.swayAmp = 12 + Math.random() * 20;
  l.swayFreq = 0.15 + Math.random() * 0.2;
  l.phase = Math.random() * Math.PI * 2;
  l.color = roleList.length ? roleList[Math.floor(Math.random() * roleList.length)] : [255, 180, 100];
  l.flicker = Math.random() * Math.PI * 2;
}

function initLanterns() {
  lanterns = [];
  for (let i = 0; i < 14; i++) {
    const l = {};
    spawnLantern(l);
    l.y = Math.random() * H;
    lanterns.push(l);
  }
}

let stars = [];
function makeStars() {
  stars = [];
  const count = Math.floor((W * H) / 11000);
  for (let i = 0; i < count; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.6, r: 0.4 + Math.random() * 1, phase: Math.random() * Math.PI * 2 });
  }
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const surf = theme.surface || [12, 20, 27];
  ctx.fillStyle = `rgb(${surf.join(',')})`;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const tw = 0.3 + 0.6 * Math.abs(Math.sin(t * 0.4 + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${tw * 0.6})`;
    ctx.fill();
  }

  for (const l of lanterns) {
    l.y -= l.riseSpeed / 60;
    const x = l.x + Math.sin(t * l.swayFreq + l.phase) * l.swayAmp;
    const fadeIn = Math.min(1, (H - l.y) / (H * 0.12));
    const fadeOut = Math.min(1, l.y / (H * 0.15));
    const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
    const flicker = 0.85 + 0.15 * Math.sin(t * 3 + l.flicker);

    if (l.y < -50 || alpha <= 0.001 && l.y < H * 0.5) {
      if (l.y < -50) { spawnLantern(l); continue; }
    }

    // glow
    const glowR = l.w * 2.2;
    const grad = ctx.createRadialGradient(x, l.y, 0, x, l.y, glowR);
    grad.addColorStop(0, rgba(l.color, 0.35 * alpha * flicker));
    grad.addColorStop(1, rgba(l.color, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, l.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    // lantern body
    ctx.beginPath();
    ctx.ellipse(x, l.y, l.w / 2, l.h / 2, 0, 0, Math.PI * 2);
    ctx.fillStyle = rgba(l.color, 0.75 * alpha * flicker);
    ctx.fill();

    // top/bottom caps
    ctx.fillStyle = rgba(theme.outline, 0.5 * alpha);
    ctx.fillRect(x - l.w * 0.15, l.y - l.h / 2 - 3, l.w * 0.3, 4);
    ctx.fillRect(x - l.w * 0.15, l.y + l.h / 2 - 1, l.w * 0.3, 4);
  }

  requestAnimationFrame(frame);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', async () => {
  await loadMatugenColors();
  initLanterns();
  makeStars();

  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      const update = () => {
        const now = new Date();
        let hours = now.getHours();
        const minutes = String(now.getMinutes()).padStart(2, '0');
        const ampm = hours >= 12 ? 'PM' : 'AM';
        hours = hours % 12 || 12;
        clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;
        dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
      };
      update();
      setInterval(update, 1000);
    }
  } catch (err) {}

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
