<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Lanterns</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --primary_container_rgb: 0 75 111;
  --secondary_container_rgb: 53 72 99;
  --tertiary_container_rgb: 58 68 114;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .85) 0%,
    rgb(var(--surface_rgb) / .5) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1;
let theme = {};
let roleList = [];
let lanterns = [];
let stars = [];
let start = performance.now();
let cursorTimer;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.25 : 0.85;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:            readRGB("--surface_rgb", [12, 20, 27]),
    primary:            readRGB("--primary_rgb", [138, 206, 255]),
    secondary:          readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:           readRGB("--tertiary_rgb", [186, 196, 250]),
    primaryContainer:   readRGB("--primary_container_rgb", [0, 75, 111]),
    secondaryContainer: readRGB("--secondary_container_rgb", [53, 72, 99]),
    tertiaryContainer:  readRGB("--tertiary_container_rgb", [58, 68, 114]),
    outline:            readRGB("--outline_rgb", [137, 146, 154])
  };

  roleList = [
    theme.primary,
    theme.secondary,
    theme.tertiary,
    theme.primaryContainer,
    theme.secondaryContainer,
    theme.tertiaryContainer
  ];

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeStars();
}
addEventListener("resize", resize, { passive: true });

function spawnLantern(l) {
  l.x = Math.random() * W;
  l.y = H + 50 + Math.random() * 40;
  l.w = 20 + Math.random() * 18;
  l.h = l.w * 1.28;
  l.riseSpeed = 10 + Math.random() * 14;
  l.swayAmp = 10 + Math.random() * 22;
  l.swayFreq = 0.12 + Math.random() * 0.2;
  l.phase = Math.random() * Math.PI * 2;
  l.color = roleList.length
    ? roleList[Math.floor(Math.random() * roleList.length)]
    : [255, 180, 100];
  l.flicker = Math.random() * Math.PI * 2;
}

function initLanterns() {
  lanterns = [];
  for (let i = 0; i < 15; i++) {
    const l = {};
    spawnLantern(l);
    l.y = Math.random() * (H + 80);
    lanterns.push(l);
  }
}

function makeStars() {
  stars = [];
  const count = Math.min(120, Math.floor((W * H) / 12000));
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.62,
      r: 0.35 + Math.random() * 1.05,
      phase: Math.random() * Math.PI * 2,
      twinkle: 0.3 + Math.random() * 0.5
    });
  }
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (const s of stars) {
    const tw = 0.28 + 0.72 * Math.abs(Math.sin(t * s.twinkle + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${tw * 0.58})`;
    ctx.fill();
  }

  // Lanterns
  for (const l of lanterns) {
    l.y -= (l.riseSpeed / 60) * speedMul;
    const x = l.x + Math.sin(t * l.swayFreq + l.phase) * l.swayAmp;

    const fadeIn = Math.min(1, (H + 40 - l.y) / (H * 0.12));
    const fadeOut = Math.min(1, (l.y + 40) / (H * 0.14));
    const alpha = Math.max(0, Math.min(fadeIn, fadeOut));
    const flicker = 0.82 + 0.18 * Math.sin(t * 2.8 + l.flicker);

    if (l.y < -60) {
      spawnLantern(l);
      continue;
    }

    // Glow
    const glowR = l.w * 2.3;
    const grad = ctx.createRadialGradient(x, l.y, 0, x, l.y, glowR);
    grad.addColorStop(0, rgba(l.color, 0.38 * alpha * flicker));
    grad.addColorStop(1, "transparent");
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(x, l.y, glowR, 0, Math.PI * 2);
    ctx.fill();

    // Body
    ctx.beginPath();
    ctx.ellipse(x, l.y, l.w * 0.5, l.h * 0.5, 0, 0, Math.PI * 2);
    ctx.fillStyle = rgba(l.color, 0.78 * alpha * flicker);
    ctx.fill();

    // Caps
    ctx.fillStyle = rgba(theme.outline || [120, 130, 140], 0.55 * alpha);
    ctx.fillRect(x - l.w * 0.14, l.y - l.h * 0.5 - 2, l.w * 0.28, 3.5);
    ctx.fillRect(x - l.w * 0.14, l.y + l.h * 0.5 - 1, l.w * 0.28, 3.5);

    // Tiny hang string
    ctx.strokeStyle = rgba(theme.outline || [120, 130, 140], 0.35 * alpha);
    ctx.lineWidth = 1;
    ctx.beginPath();
    ctx.moveTo(x, l.y - l.h * 0.5 - 2);
    ctx.lineTo(x, l.y - l.h * 0.5 - 10);
    ctx.stroke();
  }

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockWrap.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();
  initLanterns();
  makeStars();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
