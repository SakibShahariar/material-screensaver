<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Lava Lamp</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --primary_container_rgb: 0 75 111;
  --secondary_container_rgb: 53 72 99;
  --tertiary_container_rgb: 58 68 114;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .88) 0%,
    rgb(var(--surface_rgb) / .55) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1;
let theme = {};
let blobs = [];
let start = performance.now();
let lastT = 0;
let cursorTimer;

const BLOB_COUNT = 8;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.2 : 0.7;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:            readRGB("--surface_rgb", [12, 20, 27]),
    primary:            readRGB("--primary_rgb", [138, 206, 255]),
    secondary:          readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:           readRGB("--tertiary_rgb", [186, 196, 250]),
    primaryContainer:   readRGB("--primary_container_rgb", [0, 75, 111]),
    secondaryContainer: readRGB("--secondary_container_rgb", [53, 72, 99]),
    tertiaryContainer:  readRGB("--tertiary_container_rgb", [58, 68, 114]),
    outline:            readRGB("--outline_rgb", [137, 146, 154])
  };

  // Prefer richer/darker roles so light themes stay visible
  const palette = [
    theme.primaryContainer,
    theme.secondaryContainer,
    theme.tertiaryContainer,
    theme.primary,
    theme.secondary,
    theme.tertiary
  ];

  blobs.forEach((b, i) => {
    b.color = palette[i % palette.length];
    b.glow  = [theme.primary, theme.secondary, theme.tertiary][i % 3];
  });

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function makeBlobs() {
  blobs = [];
  const palette = [
    theme.primaryContainer || [0, 75, 111],
    theme.secondaryContainer || [53, 72, 99],
    theme.tertiaryContainer || [58, 68, 114],
    theme.primary || [138, 206, 255],
    theme.secondary || [180, 199, 233],
    theme.tertiary || [186, 196, 250]
  ];
  const glows = [theme.primary, theme.secondary, theme.tertiary];

  for (let i = 0; i < BLOB_COUNT; i++) {
    blobs.push({
      x: (0.2 + Math.random() * 0.6) * (W || 800),
      y: (0.15 + Math.random() * 0.7) * (H || 600),
      vx: (Math.random() - 0.5) * 18,
      vy: (Math.random() < 0.5 ? -1 : 1) * (8 + Math.random() * 14),
      r: 55 + Math.random() * 70,
      wobPhase: Math.random() * Math.PI * 2,
      wobFreq: 0.08 + Math.random() * 0.18,
      wobAmp: 14 + Math.random() * 22,
      pulsePhase: Math.random() * Math.PI * 2,
      pulseSpeed: 0.25 + Math.random() * 0.35,
      color: palette[i % palette.length],
      glow: glows[i % 3] || [140, 200, 255]
    });
  }
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  if (blobs.length === 0) makeBlobs();
}
addEventListener("resize", resize, { passive: true });

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT || 0.016);
  lastT = t;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  // Soft additive blending for organic merge
  ctx.globalCompositeOperation = "lighter";

  for (const b of blobs) {
    // Buoyancy + gentle horizontal drift
    b.vy += Math.sin(t * 0.15 + b.wobPhase) * 4 * dt;
    b.vx += Math.sin(t * b.wobFreq + b.wobPhase) * 6 * dt;

    // Soft damping
    b.vx *= 0.995;
    b.vy *= 0.997;

    b.x += b.vx * dt;
    b.y += b.vy * dt;

    // Bounce inside vertical tube-like bounds
    const margin = b.r * 0.6;
    if (b.y < margin) { b.y = margin; b.vy = Math.abs(b.vy) * 0.85; }
    if (b.y > H - margin) { b.y = H - margin; b.vy = -Math.abs(b.vy) * 0.85; }
    if (b.x < margin) { b.x = margin; b.vx = Math.abs(b.vx); }
    if (b.x > W - margin) { b.x = W - margin; b.vx = -Math.abs(b.vx); }

    const pulse = 1 + Math.sin(t * b.pulseSpeed + b.pulsePhase) * 0.12;
    const r = b.r * pulse;
    const x = b.x + Math.sin(t * b.wobFreq * 1.3 + b.wobPhase) * b.wobAmp * 0.4;

    // Outer soft glow (lighter Material accent)
    const outer = ctx.createRadialGradient(x, b.y, 0, x, b.y, r * 1.55);
    outer.addColorStop(0, rgba(b.glow, 0.22));
    outer.addColorStop(0.45, rgba(b.glow, 0.08));
    outer.addColorStop(1, "transparent");
    ctx.fillStyle = outer;
    ctx.beginPath();
    ctx.arc(x, b.y, r * 1.55, 0, Math.PI * 2);
    ctx.fill();

    // Dense colored core (container / richer role)
    const core = ctx.createRadialGradient(x, b.y, 0, x, b.y, r);
    core.addColorStop(0, rgba(b.color, 0.9));
    core.addColorStop(0.4, rgba(b.color, 0.55));
    core.addColorStop(0.75, rgba(b.color, 0.18));
    core.addColorStop(1, "transparent");
    ctx.fillStyle = core;
    ctx.beginPath();
    ctx.arc(x, b.y, r, 0, Math.PI * 2);
    ctx.fill();
  }

  ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockWrap.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();
  makeBlobs();
  loadTheme();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
