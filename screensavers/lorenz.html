<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Lorenz Attractor</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --primary_container_rgb: 0 75 111;
  --secondary_container_rgb: 53 72 99;
  --tertiary_container_rgb: 58 68 114;
  --inverse_primary_rgb: 0 100 145;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .88) 0%,
    rgb(var(--surface_rgb) / .55) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, scale = 1;
let theme = {};
let roleList = [];
let trajectories = [];
let start = performance.now();
let cursorTimer;

const SIGMA = 10, RHO = 28, BETA = 8 / 3;
const TRAJECTORY_COUNT = 6;
const DT = 0.006;
const SUBSTEPS = 4;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.22 : 0.9;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:            readRGB("--surface_rgb", [12, 20, 27]),
    primary:            readRGB("--primary_rgb", [138, 206, 255]),
    secondary:          readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:           readRGB("--tertiary_rgb", [186, 196, 250]),
    primaryContainer:   readRGB("--primary_container_rgb", [0, 75, 111]),
    secondaryContainer: readRGB("--secondary_container_rgb", [53, 72, 99]),
    tertiaryContainer:  readRGB("--tertiary_container_rgb", [58, 68, 114]),
    inversePrimary:     readRGB("--inverse_primary_rgb", [0, 100, 145]),
    outline:            readRGB("--outline_rgb", [137, 146, 154])
  };

  roleList = [
    theme.primary,
    theme.secondary,
    theme.tertiary,
    theme.primaryContainer,
    theme.secondaryContainer,
    theme.tertiaryContainer
  ];

  trajectories.forEach((tr, i) => {
    tr.color = roleList[i % roleList.length];
  });

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  cx = W * 0.5; cy = H * 0.5;
  scale = Math.min(W, H) / 52;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface || [12, 20, 27], 1);
  ctx.fillRect(0, 0, W, H);
}
addEventListener("resize", resize, { passive: true });

function makeTrajectories() {
  trajectories = [];
  for (let i = 0; i < TRAJECTORY_COUNT; i++) {
    trajectories.push({
      x: 0.1 + i * 0.00015,
      y: 0,
      z: 0,
      color: roleList[i % Math.max(1, roleList.length)] || [140, 200, 255],
      prevScreen: null
    });
  }
}

function derivatives(x, y, z) {
  return [
    SIGMA * (y - x),
    x * (RHO - z) - y,
    x * y - BETA * z
  ];
}

function stepRK4(tr, dt) {
  const [k1x, k1y, k1z] = derivatives(tr.x, tr.y, tr.z);
  const [k2x, k2y, k2z] = derivatives(
    tr.x + k1x * dt * 0.5, tr.y + k1y * dt * 0.5, tr.z + k1z * dt * 0.5
  );
  const [k3x, k3y, k3z] = derivatives(
    tr.x + k2x * dt * 0.5, tr.y + k2y * dt * 0.5, tr.z + k2z * dt * 0.5
  );
  const [k4x, k4y, k4z] = derivatives(
    tr.x + k3x * dt, tr.y + k3y * dt, tr.z + k3z * dt
  );
  tr.x += (dt / 6) * (k1x + 2 * k2x + 2 * k3x + k4x);
  tr.y += (dt / 6) * (k1y + 2 * k2y + 2 * k3y + k4y);
  tr.z += (dt / 6) * (k1z + 2 * k2z + 2 * k3z + k4z);
}

function project(tr, rotAngle) {
  const zc = tr.z - 25;
  const rx = tr.x * Math.cos(rotAngle) - zc * Math.sin(rotAngle);
  const rz = tr.x * Math.sin(rotAngle) + zc * Math.cos(rotAngle);
  const depth = (rz + 30) / 60;
  return {
    x: cx + rx * scale,
    y: cy - tr.y * scale * 0.75 - rz * scale * 0.15,
    depth: Math.max(0.22, Math.min(1, depth))
  };
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const rotAngle = t * 0.055;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.globalCompositeOperation = "source-over";
  ctx.fillStyle = rgba(theme.surface, 0.045);
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = "lighter";
  ctx.lineCap = "round";

  for (const tr of trajectories) {
    for (let s = 0; s < SUBSTEPS; s++) stepRK4(tr, DT * speedMul);
    const p = project(tr, rotAngle);

    if (tr.prevScreen) {
      ctx.strokeStyle = rgba(tr.color, 0.5 * p.depth);
      ctx.lineWidth = 1.2 + p.depth * 0.6;
      ctx.beginPath();
      ctx.moveTo(tr.prevScreen.x, tr.prevScreen.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    tr.prevScreen = p;

    ctx.beginPath();
    ctx.arc(p.x, p.y, 1.8, 0, Math.PI * 2);
    ctx.fillStyle = rgba(tr.color, 0.85 * p.depth);
    ctx.fill();
  }

  ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockWrap.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();
  makeTrajectories();
  loadTheme();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
