<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Lorenz Attractor</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_rgb: 219 227 237;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0c141b;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.8s ease;
  }
  #ui-container.hidden { opacity: 0; }

  .vignette-glass {
    background: radial-gradient(circle at center, rgba(12, 20, 27, 0.55) 0%, rgba(12, 20, 27, 0) 80%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 28px 40px;
    width: fit-content;
    border-radius: 24px;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-glass">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint">Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}

window.addEventListener('pointermove', triggerCursor);
window.addEventListener('pointerdown', triggerCursor);

let W, H, cx, cy, scale;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  scale = Math.min(W, H) / 55;
  canvas.width = W;
  canvas.height = H;
  ctx.fillStyle = rgba(theme.surface || [12, 20, 27], 1);
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    secondaryContainer: readRGB('--secondary_container_rgb', [53, 72, 99]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    inversePrimary: readRGB('--inverse_primary_rgb', [0, 100, 145]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer, theme.inversePrimary];
  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
  trajectories.forEach((tr, i) => { tr.color = roleList[i % roleList.length]; });
}

const SIGMA = 10, RHO = 28, BETA = 8 / 3;
const TRAJECTORY_COUNT = 5;
let trajectories = [];

function makeTrajectories() {
  trajectories = [];
  for (let i = 0; i < TRAJECTORY_COUNT; i++) {
    trajectories.push({
      x: 0.1 + i * 0.0001,
      y: 0,
      z: 0,
      color: [200, 200, 200],
      prevScreen: null,
    });
  }
}

function derivatives(x, y, z) {
  return [SIGMA * (y - x), x * (RHO - z) - y, x * y - BETA * z];
}

function stepRK4(tr, dt) {
  const [k1x, k1y, k1z] = derivatives(tr.x, tr.y, tr.z);
  const [k2x, k2y, k2z] = derivatives(tr.x + k1x * dt / 2, tr.y + k1y * dt / 2, tr.z + k1z * dt / 2);
  const [k3x, k3y, k3z] = derivatives(tr.x + k2x * dt / 2, tr.y + k2y * dt / 2, tr.z + k2z * dt / 2);
  const [k4x, k4y, k4z] = derivatives(tr.x + k3x * dt, tr.y + k3y * dt, tr.z + k3z * dt);
  tr.x += (dt / 6) * (k1x + 2 * k2x + 2 * k3x + k4x);
  tr.y += (dt / 6) * (k1y + 2 * k2y + 2 * k3y + k4y);
  tr.z += (dt / 6) * (k1z + 2 * k2z + 2 * k3z + k4z);
}

const DT = 0.006;
const SUBSTEPS = 4;
let start = performance.now();

function project(tr, rotAngle) {
  const zc = tr.z - 25;
  const rx = tr.x * Math.cos(rotAngle) - zc * Math.sin(rotAngle);
  const rz = tr.x * Math.sin(rotAngle) + zc * Math.cos(rotAngle);
  const depth = (rz + 30) / 60;
  return {
    x: cx + rx * scale,
    y: cy - tr.y * scale * 0.75 - rz * scale * 0.15,
    depth: Math.max(0.25, Math.min(1, depth)),
  };
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const rotAngle = t * 0.06;

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rgba(theme.surface, 0.05);
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (const tr of trajectories) {
    for (let s = 0; s < SUBSTEPS; s++) stepRK4(tr, DT * speedMul);

    const p = project(tr, rotAngle);
    if (tr.prevScreen && isFinite(tr.prevScreen.x) && isFinite(p.x)) {
      ctx.strokeStyle = rgba(tr.color, 0.55 * p.depth);
      ctx.lineWidth = 1.4;
      ctx.beginPath();
      ctx.moveTo(tr.prevScreen.x, tr.prevScreen.y);
      ctx.lineTo(p.x, p.y);
      ctx.stroke();
    }
    tr.prevScreen = p;

    if (isFinite(p.x) && isFinite(p.y)) {
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2, 0, Math.PI * 2);
      ctx.fillStyle = rgba(tr.color, 0.9 * p.depth);
      ctx.fill();
    }
  }
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}

function fallbackClock() {
  const update = () => {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;
    
    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', options);
  };
  update();
  setInterval(update, 1000);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  makeTrajectories();
  loadTheme();
  resize();

  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      fallbackClock();
    }
  } catch (err) {
    fallbackClock();
  }

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
