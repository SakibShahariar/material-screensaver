<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Ambient Mesh</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --secondary_rgb: 180 199 233;
    --surface_rgb: 8 12 18;
    --outline_rgb: 137 146 154;
  }
  
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb, 8 12 18));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas {
    position: absolute; inset: 0;
    width: 100vw; height: 100vh;
    z-index: 1; pointer-events: none;
  }

  .content-wrapper {
    position: absolute; inset: 0; z-index: 2;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 96px;
    box-sizing: border-box;
    pointer-events: none;
  }

  #clock {
    font-size: clamp(72px, 10vw, 150px);
    font-weight: 100;
    font-variant-numeric: tabular-nums;
    letter-spacing: -3px;
    line-height: 0.9;
    color: rgb(var(--primary_rgb, 138 206 255));
  }
  #clock .ampm {
    font-size: 0.22em;
    margin-left: 14px;
    font-weight: 400;
    letter-spacing: 1.5px;
    vertical-align: super;
    opacity: 0.6;
  }

  #date {
    font-size: clamp(13px, 1.3vw, 16px);
    letter-spacing: 4px;
    text-transform: uppercase;
    color: rgb(var(--secondary_rgb, 180 199 233));
    opacity: 0.75;
    margin-top: 12px;
  }

  #hint {
    position: fixed; right: 96px; top: 96px; z-index: 10;
    font-size: 11px; letter-spacing: 1.5px;
    color: rgb(var(--outline_rgb, 137 146 154));
    opacity: 0; transition: opacity 0.6s ease;
    text-transform: uppercase;
    pointer-events: none;
  }
  #hint.show { opacity: 0.5; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="meshCanvas"></canvas>

<div class="content-wrapper">
  <div id="clock">00:00</div>
  <div id="date">Mon, Jan 1</div>
</div>

<div id="hint">Press <b>C</b> to Toggle UI</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('meshCanvas');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}
window.addEventListener('pointermove', triggerCursor);

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}
function rgba(rgb, a) {
  const c = rgb || [138, 206, 255];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [8, 12, 18]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
  };
}

let start = performance.now();

// Render an ultra-smooth, slow-breathing ambient color orb that drifts subtly in the background
function frame(now) {
  const t = (now - start) / 1000 * 0.2;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  const x1 = W * 0.75 + Math.sin(t * 0.5) * 120;
  const y1 = H * 0.3 + Math.cos(t * 0.4) * 80;
  const r1 = Math.max(W, H) * 0.6;

  const grad = ctx.createRadialGradient(x1, y1, 0, x1, y1, r1);
  grad.addColorStop(0, rgba(theme.primary, 0.08));
  grad.addColorStop(0.5, rgba(theme.secondary, 0.03));
  grad.addColorStop(1, 'rgba(0,0,0,0)');

  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, W, H);

  requestAnimationFrame(frame);
}

function fallbackClock() {
  const update = () => {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;

    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', options);
  };
  update();
  setInterval(update, 1000);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    document.querySelector('.content-wrapper').style.opacity = uiVisible ? '1' : '0';
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 3500);

window.addEventListener('load', () => {
  loadTheme();
  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      fallbackClock();
    }
  } catch (err) {
    fallbackClock();
  }
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
