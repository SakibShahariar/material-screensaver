<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>n-body-galaxies</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --surface_rgb: 4 8 14;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .9) 0%,
    rgb(var(--surface_rgb) / .55) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle · R reset</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0;
let theme = {};
let stars = [];
let hubs = []; // two massive centers
let start = performance.now();
let cursorTimer;
let camX = 0, camY = 0;

const G = 48;
const DT = 0.028;
const STAR_COUNT = 900;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.35 : 0.85;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:   readRGB("--surface_rgb", [4, 8, 14]),
    primary:   readRGB("--primary_rgb", [138, 206, 255]),
    secondary: readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:  readRGB("--tertiary_rgb", [186, 196, 250]),
    outline:   readRGB("--outline_rgb", [137, 146, 154])
  };
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function spawnDisk(hx, hy, mass, color, count, radius, spin) {
  // Circular disk with approximate Keplerian tangential velocity around hub
  for (let i = 0; i < count; i++) {
    const a = Math.random() * Math.PI * 2;
    const r = Math.sqrt(Math.random()) * radius;
    const x = hx + Math.cos(a) * r;
    const y = hy + Math.sin(a) * r;
    // tangential speed ~ sqrt(GM/r) softened
    const speed = Math.sqrt(G * mass / (r + 30)) * spin;
    const vx = -Math.sin(a) * speed;
    const vy =  Math.cos(a) * speed;
    stars.push({
      x, y, vx, vy,
      color,
      size: 0.7 + Math.random() * 1.4,
      trail: []
    });
  }
}

function initGalaxies() {
  stars = [];
  const colors = [theme.primary, theme.secondary, theme.tertiary];

  // Two hubs approaching on a gentle collision course
  hubs = [
    { x: cx - W * 0.22, y: cy - H * 0.05, vx: 0.35, vy: 0.05, m: 140, color: colors[0] },
    { x: cx + W * 0.2,  y: cy + H * 0.06, vx: -0.3, vy: -0.04, m: 110, color: colors[1] }
  ];

  spawnDisk(hubs[0].x, hubs[0].y, hubs[0].m, colors[0], 480, Math.min(W, H) * 0.2, 1);
  spawnDisk(hubs[1].x, hubs[1].y, hubs[1].m, colors[1], 420, Math.min(W, H) * 0.16, -1);

  // A few halo stars
  for (let i = 0; i < 40; i++) {
    stars.push({
      x: cx + (Math.random() - 0.5) * W * 0.9,
      y: cy + (Math.random() - 0.5) * H * 0.9,
      vx: (Math.random() - 0.5) * 0.2,
      vy: (Math.random() - 0.5) * 0.2,
      color: colors[2],
      size: 0.5 + Math.random(),
      trail: []
    });
  }

  camX = 0; camY = 0;
}

function accelAt(x, y) {
  let ax = 0, ay = 0;
  for (const h of hubs) {
    const dx = h.x - x;
    const dy = h.y - y;
    const d2 = dx * dx + dy * dy + 400; // softening
    const inv = G * h.m / (d2 * Math.sqrt(d2));
    ax += dx * inv;
    ay += dy * inv;
  }
  return { ax, ay };
}

function step() {
  const dt = DT * speedMul;

  // Hubs attract each other
  for (let i = 0; i < hubs.length; i++) {
    let ax = 0, ay = 0;
    for (let j = 0; j < hubs.length; j++) {
      if (i === j) continue;
      const dx = hubs[j].x - hubs[i].x;
      const dy = hubs[j].y - hubs[i].y;
      const d2 = dx * dx + dy * dy + 900;
      const inv = G * hubs[j].m / (d2 * Math.sqrt(d2));
      ax += dx * inv;
      ay += dy * inv;
    }
    hubs[i].vx += ax * dt;
    hubs[i].vy += ay * dt;
    hubs[i].x += hubs[i].vx * dt * 12;
    hubs[i].y += hubs[i].vy * dt * 12;
  }

  // Stars
  for (const s of stars) {
    const { ax, ay } = accelAt(s.x, s.y);
    s.vx += ax * dt;
    s.vy += ay * dt;
    s.x += s.vx * dt * 14;
    s.y += s.vy * dt * 14;

    s.trail.push({ x: s.x, y: s.y });
    if (s.trail.length > 10) s.trail.shift();
  }

  // Camera follows barycenter
  let bx = 0, by = 0, m = 0;
  for (const h of hubs) { bx += h.x * h.m; by += h.y * h.m; m += h.m; }
  bx /= m; by /= m;
  camX += (bx - cx - camX) * 0.02;
  camY += (by - cy - camY) * 0.02;
}

function frame() {
  step();

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 0.22);
  ctx.fillRect(0, 0, W, H);

  ctx.save();
  ctx.translate(-camX, -camY);

  ctx.globalCompositeOperation = "lighter";

  // Hub glow
  for (const h of hubs) {
    const g = ctx.createRadialGradient(h.x, h.y, 0, h.x, h.y, 50);
    g.addColorStop(0, rgba(h.color, 0.35));
    g.addColorStop(0.4, rgba(h.color, 0.08));
    g.addColorStop(1, "transparent");
    ctx.fillStyle = g;
    ctx.beginPath();
    ctx.arc(h.x, h.y, 50, 0, Math.PI * 2);
    ctx.fill();
  }

  // Stars + short trails
  for (const s of stars) {
    if (s.trail.length > 1) {
      ctx.beginPath();
      ctx.moveTo(s.trail[0].x, s.trail[0].y);
      for (let i = 1; i < s.trail.length; i++) {
        ctx.lineTo(s.trail[i].x, s.trail[i].y);
      }
      ctx.strokeStyle = rgba(s.color, 0.15);
      ctx.lineWidth = 1;
      ctx.stroke();
    }
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.size, 0, Math.PI * 2);
    ctx.fillStyle = rgba(s.color, 0.75);
    ctx.fill();
  }

  ctx.globalCompositeOperation = "source-over";
  ctx.restore();

  requestAnimationFrame(frame);
}

function resize() {
  W = innerWidth; H = innerHeight;
  cx = W * 0.5; cy = H * 0.5;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  initGalaxies();
}
addEventListener("resize", resize, { passive: true });

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") clockWrap.classList.toggle("hidden");
  if (e.key.toLowerCase() === "r") initGalaxies();
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();
  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);
  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
