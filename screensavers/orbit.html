<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Orbit</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_rgb: 219 227 237;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 48px; box-sizing: border-box;
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #ui-container.hidden { opacity: 0; transform: translateY(12px); }

  .vignette-card {
    background: radial-gradient(circle at bottom left, rgb(var(--surface_rgb) / 0.8) 0%, rgb(var(--surface_rgb) / 0.25) 70%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 28px 36px;
    width: fit-content;
    border-radius: 24px;
    border: 1px solid rgb(var(--outline_rgb) / 0.15);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  #clock {
    font-size: clamp(52px, 7vw, 84px);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    line-height: 0.95;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  #clock .ampm {
    font-size: 0.28em;
    margin-left: 8px;
    opacity: 0.75;
    font-weight: 500;
    text-transform: uppercase;
    vertical-align: super;
    letter-spacing: 1.5px;
  }
  #date {
    font-size: clamp(12px, 1.3vw, 15px);
    letter-spacing: 3.5px;
    text-transform: uppercase;
    margin-top: 10px;
    opacity: 0.9;
    font-weight: 500;
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    opacity: 0; transition: opacity 0.8s ease;
    padding: 10px 18px;
    background: rgb(var(--surface_rgb) / 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgb(var(--outline_rgb) / 0.1);
    border-radius: 12px;
    pointer-events: none;
    z-index: 10;
  }
  #hint.show { opacity: 0.7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-card">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
</div>
<div id="hint">Press <b>C</b> to toggle UI</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}
window.addEventListener('pointermove', triggerCursor);
window.addEventListener('pointerdown', triggerCursor);

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = rgba(theme.surface || [12, 20, 27], 1);
  ctx.fillRect(0, 0, W, H);
  layoutCenters();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.15 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    secondaryContainer: readRGB('--secondary_container_rgb', [53, 72, 99]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    inversePrimary: readRGB('--inverse_primary_rgb', [0, 100, 145]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer, theme.inversePrimary];

  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color = rgba(theme.secondary, 0.9);
  hintEl.style.color = rgba(theme.outline, 1);
  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;

  centers.forEach((c, i) => { c.color = roleList[i % roleList.length]; });
}

const CENTER_LAYOUT = [
  { fx: 0.22, fy: 0.28 },
  { fx: 0.78, fy: 0.24 },
  { fx: 0.28, fy: 0.76 },
  { fx: 0.80, fy: 0.72 },
];
let centers = [];

function layoutCenters() {
  centers = CENTER_LAYOUT.map((c, i) => {
    const existing = centers[i];
    return {
      x: c.fx * W,
      y: c.fy * H,
      color: existing ? existing.color : (roleList[i % roleList.length] || [200, 200, 200]),
      particles: existing ? existing.particles : makeOrbitParticles(),
      glowPhase: Math.random() * Math.PI * 2,
    };
  });
}

function makeOrbitParticles() {
  const count = 35 + Math.floor(Math.random() * 15);
  const particles = [];
  for (let i = 0; i < count; i++) {
    particles.push({
      radius: 40 + Math.random() * 220,
      speed: (0.2 + Math.random() * 0.4) * (Math.random() < 0.5 ? 1 : -1),
      phase: Math.random() * Math.PI * 2,
      squash: 0.3 + Math.random() * 0.6,
      tilt: Math.random() * Math.PI,
      size: 1.2 + Math.random() * 2.5,
    });
  }
  return particles;
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rgba(theme.surface || [12, 20, 27], 0.12);
  ctx.fillRect(0, 0, W, H);

  ctx.globalCompositeOperation = 'lighter';
  for (const c of centers) {
    for (const p of c.particles) {
      const angle = p.phase + t * p.speed;
      const ex = Math.cos(angle) * p.radius;
      const ey = Math.sin(angle) * p.radius * p.squash;
      const cosT = Math.cos(p.tilt), sinT = Math.sin(p.tilt);
      const x = c.x + ex * cosT - ey * sinT;
      const y = c.y + ex * sinT + ey * cosT;

      ctx.beginPath();
      ctx.arc(x, y, p.size, 0, Math.PI * 2);
      ctx.fillStyle = rgba(c.color, 0.9);
      ctx.fill();
    }
  }

  ctx.globalCompositeOperation = 'source-over';
  for (const c of centers) {
    const breathe = (Math.sin(t * 0.4 + c.glowPhase) + 1) / 2;
    const glowR = 30 + breathe * 15;
    const grad = ctx.createRadialGradient(c.x, c.y, 0, c.x, c.y, glowR);
    grad.addColorStop(0, rgba(c.color, 0.6));
    grad.addColorStop(1, rgba(c.color, 0));
    ctx.fillStyle = grad;
    ctx.beginPath();
    ctx.arc(c.x, c.y, glowR, 0, Math.PI * 2);
    ctx.fill();
  }
  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}

try {
  startClock(clockEl, dateEl);
} catch (e) {
  const update = () => {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;
    dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  };
  update();
  setInterval(update, 1000);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();
  resize();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
