<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Origami</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27;
    --surface_container_rgb: 24 33 39;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 48px; box-sizing: border-box;
    transition: opacity 0.6s cubic-bezier(0.16, 1, 0.3, 1), transform 0.6s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #ui-container.hidden { opacity: 0; transform: translateY(12px); }

  .vignette-card {
    background: radial-gradient(circle at bottom left, rgb(var(--surface_rgb) / 0.8) 0%, rgb(var(--surface_rgb) / 0.25) 70%);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    padding: 28px 36px;
    width: fit-content;
    border-radius: 24px;
    border: 1px solid rgb(var(--outline_rgb) / 0.15);
    box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6), inset 0 1px 0 rgba(255, 255, 255, 0.05);
  }

  #clock {
    font-size: clamp(52px, 7vw, 84px);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -2px;
    line-height: 0.95;
    text-shadow: 0 2px 12px rgba(0, 0, 0, 0.4);
  }
  #clock .ampm {
    font-size: 0.28em;
    margin-left: 8px;
    opacity: 0.75;
    font-weight: 500;
    text-transform: uppercase;
    vertical-align: super;
    letter-spacing: 1.5px;
  }
  #date {
    font-size: clamp(12px, 1.3vw, 15px);
    letter-spacing: 3.5px;
    text-transform: uppercase;
    margin-top: 10px;
    opacity: 0.9;
    font-weight: 500;
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 11px; letter-spacing: 2px; text-transform: uppercase;
    opacity: 0; transition: opacity 0.8s ease;
    padding: 10px 18px;
    background: rgb(var(--surface_rgb) / 0.6);
    backdrop-filter: blur(8px);
    border: 1px solid rgb(var(--outline_rgb) / 0.1);
    border-radius: 12px;
    pointer-events: none;
    z-index: 10;
  }
  #hint.show { opacity: 0.7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-card">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
</div>
<div id="hint">Press <b>C</b> to toggle UI</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}
window.addEventListener('pointermove', triggerCursor);
window.addEventListener('pointerdown', triggerCursor);

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  makeGrid();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.3 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'),
    surfaceContainer: readRGB('--surface_container_rgb'),
    primary: readRGB('--primary_rgb'),
    secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'),
    primaryContainer: readRGB('--primary_container_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'),
    outline: readRGB('--outline_rgb'),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer];
  
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color = rgba(theme.secondary, 0.9);
  hintEl.style.color = rgba(theme.outline, 1);
  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;

  for (const cell of grid) {
    cell.colorA = roleList[Math.floor(Math.random() * roleList.length)];
    cell.colorB = roleList[Math.floor(Math.random() * roleList.length)];
  }
}

const CELL_SIZE = 90;
let grid = [];
function makeGrid() {
  grid = [];
  const cols = Math.ceil(W / CELL_SIZE) + 1;
  const rows = Math.ceil(H / CELL_SIZE) + 1;
  const offsetX = (W - cols * CELL_SIZE) / 2;
  const offsetY = (H - rows * CELL_SIZE) / 2;
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      grid.push({
        cx: offsetX + c * CELL_SIZE + CELL_SIZE / 2,
        cy: offsetY + r * CELL_SIZE + CELL_SIZE / 2,
        colorA: roleList[Math.floor(Math.random() * (roleList.length || 1))] || [200, 200, 200],
        colorB: roleList[Math.floor(Math.random() * (roleList.length || 1))] || [180, 180, 180],
        state: 0,
        flipping: false,
        flipProgress: 0,
        nextFlip: Math.random() * 6,
      });
    }
  }
}

function drawCell(cell) {
  const size = CELL_SIZE * 0.82;
  let scaleX = 1;
  let color = cell.state === 0 ? cell.colorA : cell.colorB;

  if (cell.flipping) {
    scaleX = Math.cos(cell.flipProgress * Math.PI);
    color = cell.flipProgress < 0.5 ? cell.colorA : cell.colorB;
    if (cell.state === 1) color = cell.flipProgress < 0.5 ? cell.colorB : cell.colorA;
  }

  ctx.save();
  ctx.translate(cell.cx, cell.cy);
  ctx.scale(Math.max(0.02, Math.abs(scaleX)), 1);
  ctx.beginPath();
  ctx.moveTo(0, -size / 2);
  ctx.lineTo(size / 2, 0);
  ctx.lineTo(0, size / 2);
  ctx.lineTo(-size / 2, 0);
  ctx.closePath();
  ctx.fillStyle = rgba(color, 0.85);
  ctx.fill();
  ctx.strokeStyle = `rgb(${(theme.surface || [12, 20, 27]).join(',')})`;
  ctx.lineWidth = 3;
  ctx.stroke();
  ctx.restore();
}

let start = performance.now();
let lastT = 0;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgb(${(theme.surface || [12, 20, 27]).join(',')})`;
  ctx.fillRect(0, 0, W, H);

  for (const cell of grid) {
    if (!cell.flipping && t >= cell.nextFlip) {
      cell.flipping = true;
      cell.flipProgress = 0;
    }
    if (cell.flipping) {
      cell.flipProgress += dt * 1.6;
      if (cell.flipProgress >= 1) {
        cell.flipping = false;
        cell.state = cell.state === 0 ? 1 : 0;
        cell.nextFlip = t + 3 + Math.random() * 10;
      }
    }
    drawCell(cell);
  }

  requestAnimationFrame(frame);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  loadTheme();
  try {
    startClock(clockEl, dateEl);
  } catch (e) {
    const update = () => {
      const now = new Date();
      let hours = now.getHours();
      const minutes = String(now.getMinutes()).padStart(2, '0');
      const ampm = hours >= 12 ? 'PM' : 'AM';
      hours = hours % 12 || 12;
      clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;
      dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
    };
    update();
    setInterval(update, 1000);
  }
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
