<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Oscilloscope</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27;
    --surface_container_rgb: 24 33 39;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0c141b;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.8s ease;
  }
  #ui-container.hidden { opacity: 0; }

  .vignette-glass {
    background: radial-gradient(circle at center, rgba(12, 20, 27, 0.65) 0%, rgba(12, 20, 27, 0) 80%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 28px 40px;
    width: fit-content;
    border-radius: 24px;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-glass">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint">Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}

window.addEventListener('pointermove', triggerCursor);
window.addEventListener('pointerdown', triggerCursor);

let W = window.innerWidth;
let H = window.innerHeight;
let cx = W / 2;
let cy = H / 2;
let scale = Math.min(W, H) * 0.35;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  scale = Math.min(W, H) * 0.35;
  canvas.width = W;
  canvas.height = H;
  ctx.fillStyle = rgba(theme.surface || [12, 20, 27], 1);
  ctx.fillRect(0, 0, W, H);
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.15 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
let curves = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };

  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);

  curves = [
    { freqA: 3, freqB: 2, color: theme.primary, lag: 0 },
    { freqA: 5, freqB: 4, color: theme.secondary, lag: Math.PI / 3 },
    { freqA: 2, freqB: 3, color: theme.tertiary, lag: Math.PI / 6 },
  ];
}

function freqDrift(base, t, speed) {
  return base + Math.sin(t * speed) * 0.4;
}

function drawReticle() {
  ctx.strokeStyle = rgba(theme.outline, 0.05);
  ctx.lineWidth = 1;

  const gridCount = 6;
  const step = (scale * 2) / gridCount;

  ctx.beginPath();
  for (let i = -gridCount / 2; i <= gridCount / 2; i++) {
    ctx.moveTo(cx + i * step, cy - scale);
    ctx.lineTo(cx + i * step, cy + scale);
    ctx.moveTo(cx - scale, cy + i * step);
    ctx.lineTo(cx + scale, cy + i * step);
  }
  ctx.stroke();

  ctx.strokeStyle = rgba(theme.outline, 0.12);
  ctx.beginPath();
  ctx.moveTo(cx, cy - scale * 1.05);
  ctx.lineTo(cx, cy + scale * 1.05);
  ctx.moveTo(cx - scale * 1.05, cy);
  ctx.lineTo(cx + scale * 1.05, cy);
  ctx.stroke();
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.globalCompositeOperation = 'source-over';
  ctx.fillStyle = rgba(theme.surface, 0.12);
  ctx.fillRect(0, 0, W, H);

  drawReticle();

  for (const curve of curves) {
    const a = freqDrift(curve.freqA, t, 0.03);
    const b = freqDrift(curve.freqB, t, 0.021);
    const phaseShift = t * 0.25 + curve.lag;

    const steps = 500;
    const points = [];

    for (let i = 0; i <= steps; i++) {
      const u = (i / steps) * Math.PI * 2;
      const x = cx + Math.sin(a * u + phaseShift) * scale;
      const y = cy + Math.sin(b * u) * scale;
      points.push({ x, y });
    }

    ctx.globalCompositeOperation = 'lighter';

    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      i === 0 ? ctx.moveTo(points[i].x, points[i].y) : ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.strokeStyle = rgba(curve.color, 0.15);
    ctx.lineWidth = 6;
    ctx.stroke();

    ctx.beginPath();
    for (let i = 0; i < points.length; i++) {
      i === 0 ? ctx.moveTo(points[i].x, points[i].y) : ctx.lineTo(points[i].x, points[i].y);
    }
    ctx.strokeStyle = rgba(curve.color, 0.65);
    ctx.lineWidth = 1.8;
    ctx.stroke();

    const leaderIndex = Math.floor(((t * 80) % steps));
    const leaderPoint = points[leaderIndex] || points[0];

    ctx.beginPath();
    ctx.arc(leaderPoint.x, leaderPoint.y, 3, 0, Math.PI * 2);
    ctx.fillStyle = rgba([255, 255, 255], 0.9);
    ctx.fill();
  }

  ctx.globalCompositeOperation = 'source-over';

  requestAnimationFrame(frame);
}

function fallbackClock() {
  const update = () => {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;

    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', options);
  };
  update();
  setInterval(update, 1000);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();
  resize();

  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      fallbackClock();
    }
  } catch (err) {
    fallbackClock();
  }

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
