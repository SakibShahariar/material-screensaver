<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Paper Boats</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --secondary_rgb: 180 199 233; --tertiary_rgb: 186 196 250;
    --primary_container_rgb: 0 75 111; --secondary_container_rgb: 53 72 99; --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27; --surface_bright_rgb: 50 58 65; --outline_rgb: 137 146 154;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock { position: fixed; left: 32px; bottom: 28px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; font-size: clamp(28px,4vw,56px); text-shadow: 0 0 24px rgba(0,0,0,0.4); pointer-events: none; transition: opacity 0.6s ease; }
  #clock .ampm { font-size: 0.36em; margin-left: 6px; opacity: 0.82; vertical-align: middle; }
  #date { position: fixed; left: 34px; bottom: 14px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: clamp(12px,1.2vw,16px); letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; transition: opacity 0.6s ease; }
  #hint { position: fixed; right: 28px; bottom: 26px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: 13px; letter-spacing: 0.5px; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>
<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.25 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'), surfaceBright: readRGB('--surface_bright_rgb'),
    primary: readRGB('--primary_rgb'), secondary: readRGB('--secondary_rgb'), tertiary: readRGB('--tertiary_rgb'),
    primaryContainer: readRGB('--primary_container_rgb'), secondaryContainer: readRGB('--secondary_container_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'), outline: readRGB('--outline_rgb'),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer];
  boats.forEach((b, i) => { b.color = roleList[i % roleList.length]; });
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

// river meanders using a slowly-shifting sine centerline
function riverCenterY(x, t) {
  return H * 0.5 + Math.sin(x * 0.0022 + t * 0.05) * H * 0.16 + Math.sin(x * 0.0009 - t * 0.03) * H * 0.08;
}
const RIVER_WIDTH = 0; // computed relative to H below

let boats = [];
function spawnBoat(b) {
  b.x = -60 - Math.random() * 200;
  b.speed = 26 + Math.random() * 18;
  b.bobAmp = 3 + Math.random() * 3;
  b.bobFreq = 0.8 + Math.random() * 0.6;
  b.phase = Math.random() * Math.PI * 2;
  b.lateral = (Math.random() - 0.5) * H * 0.12;
  b.size = 14 + Math.random() * 10;
  b.color = [200, 200, 200];
}
function initBoats() {
  boats = [];
  for (let i = 0; i < 7; i++) {
    const b = {};
    spawnBoat(b);
    b.x = Math.random() * W;
    boats.push(b);
  }
}

function drawBoat(b, t, y, heading) {
  const bob = Math.sin(t * b.bobFreq + b.phase) * b.bobAmp;

  // wake: two small fading ellipses trailing behind, along the heading direction
  for (let i = 1; i <= 2; i++) {
    const wx = b.x - Math.cos(heading) * b.size * 1.4 * i;
    const wy = y + bob - Math.sin(heading) * b.size * 1.4 * i;
    ctx.beginPath();
    ctx.ellipse(wx, wy, b.size * 0.4 * i, b.size * 0.15 * i, heading, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(b.color, 0.15 / i);
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  ctx.save();
  ctx.translate(b.x, y + bob);
  ctx.rotate(heading * 0.15); // subtle tilt, not a full turn into the flow

  // reflection
  ctx.save();
  ctx.scale(1, -0.4);
  ctx.translate(0, -b.size * 0.3);
  ctx.beginPath();
  ctx.moveTo(-b.size, 0);
  ctx.lineTo(b.size, 0);
  ctx.lineTo(b.size * 0.5, b.size * 0.4);
  ctx.lineTo(-b.size * 0.5, b.size * 0.4);
  ctx.closePath();
  ctx.fillStyle = rgba(b.color, 0.18);
  ctx.fill();
  ctx.restore();

  ctx.beginPath();
  ctx.moveTo(-b.size, 0);
  ctx.lineTo(b.size, 0);
  ctx.lineTo(b.size * 0.5, b.size * 0.4);
  ctx.lineTo(-b.size * 0.5, b.size * 0.4);
  ctx.closePath();
  ctx.fillStyle = rgba(b.color, 0.85);
  ctx.fill();

  // fold crease down the hull center
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, b.size * 0.4);
  ctx.strokeStyle = rgba(theme.surface, 0.4);
  ctx.lineWidth = 1;
  ctx.stroke();

  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -b.size * 1.1);
  ctx.lineTo(b.size * 0.55, -b.size * 0.35);
  ctx.closePath();
  ctx.fillStyle = rgba(b.color, 0.6);
  ctx.fill();
  ctx.beginPath();
  ctx.moveTo(0, 0);
  ctx.lineTo(0, -b.size * 1.1);
  ctx.strokeStyle = rgba(theme.surface, 0.3);
  ctx.lineWidth = 1;
  ctx.stroke();
  ctx.restore();
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgb(${(theme.surfaceBright || [40, 46, 52]).join(',')})`;
  ctx.fillRect(0, 0, W, H);

  const riverW = H * 0.5;
  ctx.beginPath();
  const steps = 60;
  for (let i = 0; i <= steps; i++) {
    const x = (i / steps) * W;
    const y = riverCenterY(x, t) - riverW / 2;
    i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
  }
  for (let i = steps; i >= 0; i--) {
    const x = (i / steps) * W;
    const y = riverCenterY(x, t) + riverW / 2;
    ctx.lineTo(x, y);
  }
  ctx.closePath();
  const waterGrad = ctx.createLinearGradient(0, 0, 0, H);
  waterGrad.addColorStop(0, `rgb(${(theme.primaryContainer || [0,50,80]).join(',')})`);
  waterGrad.addColorStop(1, `rgb(${(theme.surface || [12,20,27]).join(',')})`);
  ctx.fillStyle = waterGrad;
  ctx.fill();

  // subtle flow lines
  ctx.strokeStyle = 'rgba(255,255,255,0.05)';
  ctx.lineWidth = 1;
  for (let lane = -2; lane <= 2; lane++) {
    ctx.beginPath();
    for (let i = 0; i <= steps; i++) {
      const x = (i / steps) * W;
      const y = riverCenterY(x, t) + lane * riverW * 0.15 + Math.sin(x * 0.03 + t * 2 + lane) * 4;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.stroke();
  }

  for (const b of boats) {
    b.x += b.speed * (1 / 60) * speedMul;
    if (b.x > W + 60) spawnBoat(b);
    const y = riverCenterY(b.x, t) + b.lateral;
    const yAhead = riverCenterY(b.x + 8, t) + b.lateral;
    const heading = Math.atan2(yAhead - y, 8);
    drawBoat(b, t, y, heading);
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});
hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  initBoats();
  loadTheme();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
