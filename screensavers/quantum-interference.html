<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Quantum Interference</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --tertiary_rgb: 186 196 250;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.6s ease;
  }
  #ui-container.hidden { opacity: 0; }

  .vignette-card {
    background: radial-gradient(circle at center, rgba(12, 20, 27, 0.65) 0%, rgba(12, 20, 27, 0) 80%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 24px 32px;
    width: fit-content;
    border-radius: 20px;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7);
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
    vertical-align: middle;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-card">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint">Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}
window.addEventListener('pointermove', triggerCursor);

// High fidelity scale factor (reduced slightly for performance during heavy matrix calculations)
let scale = 4; 
let W, H, cols, rows;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  cols = Math.floor(W / scale);
  rows = Math.floor(H / scale);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}

let theme = {};
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };

  document.body.style.backgroundColor = `rgb(${theme.surface.join(',')})`;
  clockEl.style.color = `rgba(${theme.primary.join(',')}, 0.95)`;
  dateEl.style.color = `rgba(${theme.secondary.join(',')}, 0.85)`;
  hintEl.style.color = `rgba(${theme.outline.join(',')}, 0.9)`;
}

// Wave emitters moving in complex Lissajous orbital paths
let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul * 0.6;

  ctx.fillStyle = `rgb(${theme.surface.join(',')})`;
  ctx.fillRect(0, 0, W, H);

  // Define 3 dynamic wave sources
  const s1 = { x: W * 0.5 + Math.sin(t * 0.7) * W * 0.3, y: H * 0.5 + Math.cos(t * 0.5) * H * 0.25, freq: 0.035 };
  const s2 = { x: W * 0.5 + Math.cos(t * 0.4) * W * 0.35, y: H * 0.5 + Math.sin(t * 0.6) * H * 0.25, freq: 0.028 };
  const s3 = { x: W * 0.5 + Math.sin(t * 0.9) * W * 0.2, y: H * 0.5 + Math.cos(t * 0.8) * H * 0.3, freq: 0.045 };

  // Render interference field via pixel manipulation buffer for maximum performance
  const imgData = ctx.createImageData(W, H);
  const data = imgData.data;

  const pR = theme.primary[0], pG = theme.primary[1], pB = theme.primary[2];
  const sR = theme.secondary[0], sG = theme.secondary[1], sB = theme.secondary[2];
  const tR = theme.tertiary[0], tG = theme.tertiary[1], tB = theme.tertiary[2];
  const surR = theme.surface[0], surG = theme.surface[1], surB = theme.surface[2];

  for (let y = 0; y < H; y += scale) {
    for (let x = 0; x < W; x += scale) {
      // Calculate distances to wave emitters
      const d1 = Math.hypot(x - s1.x, y - s1.y);
      const d2 = Math.hypot(x - s2.x, y - s2.y);
      const d3 = Math.hypot(x - s3.x, y - s3.y);

      // Superposition interference equation
      const waveVal = Math.sin(d1 * s1.freq - t * 4) +
                      Math.sin(d2 * s2.freq + t * 3) +
                      Math.cos(d3 * s3.freq - t * 2);

      // Normalize interference value between 0 and 1
      const intensity = (waveVal + 3) / 6;
      const alpha = Math.pow(intensity, 2.2) * 0.85;

      // Color mapping blend between primary, secondary, and tertiary based on interference phase
      const r = Math.floor(surR + (pR * intensity + sR * (1 - intensity)) * alpha);
      const g = Math.floor(surG + (pG * intensity + sG * (1 - intensity)) * alpha);
      const b = Math.floor(surB + (pB * intensity + sB * (1 - intensity)) * alpha);

      // Fast block fill for scale grid
      for (let sy = 0; sy < scale && (y + sy) < H; sy++) {
        for (let sx = 0; sx < scale && (x + sx) < W; sx++) {
          const idx = ((y + sy) * W + (x + sx)) * 4;
          data[idx] = r;
          data[idx + 1] = g;
          data[idx + 2] = b;
          data[idx + 3] = 255;
        }
      }
    }
  }

  ctx.putImageData(imgData, 0, 0);

  requestAnimationFrame(frame);
}

function fallbackClock() {
  const update = () => {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;

    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', options);
  };
  update();
  setInterval(update, 1000);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();

  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      fallbackClock();
    }
  } catch (err) {
    fallbackClock();
  }

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
