<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Modern Radar</title>
<style>
:root {
  --primary_rgb: 126 212 255;
  --secondary_rgb: 194 225 255;
  --tertiary_rgb: 235 221 255;
  --secondary_container_rgb: 53 72 99;
  --surface_rgb: 8 13 18;
  --outline_rgb: 142 151 160;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .88) 0%,
    rgb(var(--surface_rgb) / .55) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, radarR = 1;
let theme = {};
let blips = [];
let start = performance.now();
let cursorTimer;

const SWEEP_PERIOD = 5.5;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.3 : 0.85;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:            readRGB("--surface_rgb", [8, 13, 18]),
    primary:            readRGB("--primary_rgb", [126, 212, 255]),
    secondary:          readRGB("--secondary_rgb", [194, 225, 255]),
    tertiary:           readRGB("--tertiary_rgb", [235, 221, 255]),
    secondaryContainer: readRGB("--secondary_container_rgb", [53, 72, 99]),
    outline:            readRGB("--outline_rgb", [142, 151, 160])
  };

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function initBlips() {
  blips = [];
  for (let i = 0; i < 12; i++) {
    blips.push({
      angle: Math.random() * Math.PI * 2,
      dist: (0.22 + Math.random() * 0.72) * radarR,
      lit: 0,
      lastHit: -10,
      size: 2.4 + Math.random() * 2.2
    });
  }
}

function resize() {
  W = innerWidth; H = innerHeight;
  cx = W * 0.5; cy = H * 0.5;
  radarR = Math.min(W, H) * 0.38;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  initBlips();
}
addEventListener("resize", resize, { passive: true });

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const sweepAngle = ((t / SWEEP_PERIOD) % 1) * Math.PI * 2;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Full background — always dark surface
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  // Outer bezel (subtle)
  ctx.beginPath();
  ctx.arc(cx, cy, radarR + 14, 0, Math.PI * 2);
  ctx.strokeStyle = rgba(theme.primary, 0.25);
  ctx.lineWidth = 2;
  ctx.stroke();

  // Dark radar face (never fill with primary)
  ctx.beginPath();
  ctx.arc(cx, cy, radarR, 0, Math.PI * 2);
  ctx.fillStyle = "rgb(6, 10, 14)";
  ctx.fill();
  ctx.strokeStyle = rgba(theme.primary, 0.45);
  ctx.lineWidth = 1.5;
  ctx.stroke();

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, radarR - 1, 0, Math.PI * 2);
  ctx.clip();

  // Range rings
  ctx.strokeStyle = rgba(theme.primary, 0.28);
  ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, (radarR / 4) * i, 0, Math.PI * 2);
    ctx.stroke();
  }

  // Crosshairs
  ctx.beginPath();
  ctx.moveTo(cx - radarR, cy);
  ctx.lineTo(cx + radarR, cy);
  ctx.moveTo(cx, cy - radarR);
  ctx.lineTo(cx, cy + radarR);
  ctx.stroke();

  // Sweep fan — primary on dark = visible
  const segments = 56;
  for (let k = 0; k < segments; k++) {
    const a = sweepAngle - (k / segments) * 0.7;
    const alpha = Math.max(0, 0.55 * (1 - k / segments));
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radarR, a, a - 0.025, true);
    ctx.closePath();
    ctx.fillStyle = rgba(theme.primary, alpha);
    ctx.fill();
  }

  // Leading edge
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(
    cx + Math.cos(sweepAngle) * radarR,
    cy + Math.sin(sweepAngle) * radarR
  );
  ctx.strokeStyle = rgba(theme.secondary, 0.95);
  ctx.lineWidth = 2.2;
  ctx.stroke();

  // Blips
  for (const b of blips) {
    let diff = ((sweepAngle - b.angle) % (Math.PI * 2) + Math.PI * 2) % (Math.PI * 2);
    if (diff > Math.PI) diff -= Math.PI * 2;
    if (Math.abs(diff) < 0.05 && t - b.lastHit > SWEEP_PERIOD * 0.35) {
      b.lit = 1;
      b.lastHit = t;
    }
    b.lit *= 0.982;

    const bx = cx + Math.cos(b.angle) * b.dist;
    const by = cy + Math.sin(b.angle) * b.dist;

    if (b.lit > 0.06) {
      const pingR = b.size + (1 - b.lit) * 22;
      ctx.beginPath();
      ctx.arc(bx, by, pingR, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(theme.tertiary, b.lit * 0.7);
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if (b.lit > 0.02) {
      const glow = ctx.createRadialGradient(bx, by, 0, bx, by, b.size * 6);
      glow.addColorStop(0, rgba(theme.tertiary, b.lit * 0.9));
      glow.addColorStop(1, "transparent");
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(bx, by, b.size * 6, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(bx, by, b.size, 0, Math.PI * 2);
      ctx.fillStyle = rgba(theme.tertiary, Math.min(1, b.lit * 1.5));
      ctx.fill();
    }
  }

  ctx.restore();
  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockWrap.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
