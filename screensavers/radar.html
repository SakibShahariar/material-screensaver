<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Modern Radar</title>
<style>
  :root {
    --primary_rgb: 126 211.5 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 194 225 255;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 235 221 255;
    --tertiary_container_rgb: 74 62 104;
    --surface_rgb: 8 13 18;
    --outline_rgb: 142 151 160;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  /* Ambient depth vignette */
  body::after {
    content: '';
    position: fixed; inset: 0; pointer-events: none; z-index: 5;
    background: radial-gradient(circle at center, transparent 40%, rgb(var(--surface_rgb) / 0.7) 100%);
  }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 56px; box-sizing: border-box;
    transition: opacity 0.5s cubic-bezier(0.16, 1, 0.3, 1), transform 0.5s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #ui-container.hidden { opacity: 0; transform: translateY(16px); }

  .glass-card {
    background: linear-gradient(135deg, rgb(var(--surface_rgb) / 0.75) 0%, rgb(var(--surface_rgb) / 0.4) 100%);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border: 1px solid rgb(var(--outline_rgb) / 0.12);
    padding: 32px 40px;
    width: fit-content;
    border-radius: 28px;
    box-shadow: 0 24px 60px rgba(0, 0, 0, 0.5), inset 0 1px 0 rgba(255, 255, 255, 0.06);
  }

  #clock {
    font-size: clamp(56px, 8vw, 92px);
    font-weight: 200;
    font-variant-numeric: tabular-nums;
    letter-spacing: -3px;
    line-height: 0.9;
    text-shadow: 0 4px 24px rgba(0, 0, 0, 0.45);
  }
  #clock .ampm {
    font-size: 0.26em;
    margin-left: 10px;
    opacity: 0.7;
    font-weight: 500;
    text-transform: uppercase;
    vertical-align: super;
    letter-spacing: 2px;
  }
  #date {
    font-size: clamp(13px, 1.4vw, 16px);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-top: 12px;
    opacity: 0.85;
    font-weight: 500;
  }
  #hint {
    position: fixed; right: 40px; bottom: 40px;
    font-size: 11px; letter-spacing: 2.5px; text-transform: uppercase;
    opacity: 0; transition: opacity 0.6s ease;
    padding: 10px 20px;
    background: rgb(var(--surface_rgb) / 0.5);
    backdrop-filter: blur(12px);
    border: 1px solid rgb(var(--outline_rgb) / 0.1);
    border-radius: 14px;
    pointer-events: none;
    z-index: 10;
  }
  #hint.show { opacity: 0.65; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-container">
  <div class="glass-card">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
</div>
<div id="hint">Press <b>C</b> to toggle UI</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}
window.addEventListener('pointermove', triggerCursor);
window.addEventListener('pointerdown', triggerCursor);

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, cx, cy, radarR;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  cx = W / 2;
  cy = H / 2;
  radarR = Math.min(W, H) * 0.38;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  initBlips();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.3 : 0.9;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [8, 13, 18]),
    primary: readRGB('--primary_rgb', [126, 211, 255]),
    secondary: readRGB('--secondary_rgb', [194, 225, 255]),
    tertiary: readRGB('--tertiary_rgb', [235, 221, 255]),
    secondaryContainer: readRGB('--secondary_container_rgb', [53, 72, 99]),
    outline: readRGB('--outline_rgb', [142, 151, 160]),
  };
  clockEl.style.color = rgba(theme.primary, 0.98);
  dateEl.style.color = rgba(theme.secondary, 0.9);
  hintEl.style.color = rgba(theme.outline, 0.95);
}

let blips = [];
function initBlips() {
  blips = [];
  for (let i = 0; i < 12; i++) {
    blips.push({
      angle: Math.random() * Math.PI * 2,
      dist: (0.25 + Math.random() * 0.7) * radarR,
      lit: 0,
      lastHit: -10,
      size: 2.5 + Math.random() * 2
    });
  }
}

const SWEEP_PERIOD = 5.5;
let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const sweepAngle = ((t / SWEEP_PERIOD) % 1) * Math.PI * 2;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  
  // Background Fill
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  // Outer Bezel Ring
  ctx.beginPath();
  ctx.arc(cx, cy, radarR + 16, 0, Math.PI * 2);
  ctx.fillStyle = rgba(theme.secondaryContainer, 0.22);
  ctx.fill();
  ctx.strokeStyle = rgba(theme.primary, 0.35);
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Radar Inner Well
  ctx.beginPath();
  ctx.arc(cx, cy, radarR, 0, Math.PI * 2);
  const wellGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, radarR);
  wellGrad.addColorStop(0, rgba(theme.surface, 0.98));
  wellGrad.addColorStop(1, 'rgba(3, 7, 12, 0.99)');
  ctx.fillStyle = wellGrad;
  ctx.fill();

  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, radarR, 0, Math.PI * 2);
  ctx.clip();

  // Grid Rings & Crosshairs
  ctx.strokeStyle = rgba(theme.primary, 0.22);
  ctx.lineWidth = 1;
  for (let i = 1; i <= 4; i++) {
    ctx.beginPath();
    ctx.arc(cx, cy, (radarR / 4) * i, 0, Math.PI * 2);
    ctx.stroke();
  }

  ctx.beginPath();
  ctx.moveTo(cx - radarR, cy); ctx.lineTo(cx + radarR, cy);
  ctx.moveTo(cx, cy - radarR); ctx.lineTo(cx, cy + radarR);
  ctx.stroke();

  // Sweeping Radar Beam
  const segments = 50;
  for (let k = 0; k < segments; k++) {
    const a = sweepAngle - (k / segments) * 0.8;
    const alpha = Math.max(0, 0.45 * (1 - k / segments));
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radarR, a, a - 0.02);
    ctx.closePath();
    ctx.fillStyle = rgba(theme.primary, alpha);
    ctx.fill();
  }

  // Sharp Leading Edge Ray
  ctx.beginPath();
  ctx.moveTo(cx, cy);
  ctx.lineTo(cx + Math.cos(sweepAngle) * radarR, cy + Math.sin(sweepAngle) * radarR);
  ctx.strokeStyle = rgba(theme.secondary, 0.95);
  ctx.lineWidth = 2;
  ctx.stroke();

  // Target Blips
  for (const b of blips) {
    const diff = ((sweepAngle - b.angle + Math.PI * 3) % (Math.PI * 2)) - Math.PI;
    if (Math.abs(diff) < 0.04 && t - b.lastHit > SWEEP_PERIOD * 0.4) {
      b.lit = 1.0;
      b.lastHit = t;
    }
    b.lit *= 0.985;

    const bx = cx + Math.cos(b.angle) * b.dist;
    const by = cy + Math.sin(b.angle) * b.dist;

    if (b.lit > 0.1) {
      const pingR = b.size + (1 - b.lit) * 20;
      ctx.beginPath();
      ctx.arc(bx, by, pingR, 0, Math.PI * 2);
      ctx.strokeStyle = rgba(theme.tertiary, b.lit * 0.7);
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    if (b.lit > 0.02) {
      const glow = ctx.createRadialGradient(bx, by, 0, bx, by, b.size * 5);
      glow.addColorStop(0, rgba(theme.tertiary, b.lit));
      glow.addColorStop(1, rgba(theme.tertiary, 0));
      ctx.fillStyle = glow;
      ctx.beginPath();
      ctx.arc(bx, by, b.size * 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.beginPath();
      ctx.arc(bx, by, b.size, 0, Math.PI * 2);
      ctx.fillStyle = rgba(theme.tertiary, Math.min(1, b.lit * 1.5));
      ctx.fill();
    }
  }

  ctx.restore();

  requestAnimationFrame(frame);
}

function fallbackClock() {
  const update = () => {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;
    dateEl.textContent = now.toLocaleDateString('en-US', { weekday: 'short', month: 'short', day: 'numeric' });
  };
  update();
  setInterval(update, 1000);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  loadTheme();
  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      fallbackClock();
    }
  } catch (err) {
    fallbackClock();
  }
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
