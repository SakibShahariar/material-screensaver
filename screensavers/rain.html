<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Rain</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0c141b;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.8s ease;
  }
  #ui-container.hidden { opacity: 0; }

  .vignette-glass {
    background: radial-gradient(circle at center, rgba(12, 20, 27, 0.65) 0%, rgba(12, 20, 27, 0) 80%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 28px 40px;
    width: fit-content;
    border-radius: 24px;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-glass">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint">Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}

window.addEventListener('pointermove', triggerCursor);
window.addEventListener('pointerdown', triggerCursor);

let W = window.innerWidth;
let H = window.innerHeight;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W;
  canvas.height = H;
  makeDrops();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.25 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    surfaceBright: readRGB('--surface_bright_rgb', [50, 58, 65]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };

  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

let streaks = [], beads = [], ripples = [];

function makeDrops() {
  streaks = [];
  for (let i = 0; i < 260; i++) {
    streaks.push({
      x: Math.random() * (W + 200) - 100,
      y: Math.random() * H,
      len: 18 + Math.random() * 32,
      speed: 650 + Math.random() * 450,
      drift: -45 - Math.random() * 25,
      alpha: 0.12 + Math.random() * 0.35,
      width: 0.8 + Math.random() * 0.8
    });
  }

  beads = [];
  for (let i = 0; i < 24; i++) {
    beads.push({
      x: Math.random() * W,
      y: Math.random() * H,
      speed: 20 + Math.random() * 35,
      wob: Math.random() * Math.PI * 2,
      r: 1.8 + Math.random() * 2.8
    });
  }
}

function spawnRipple(x, y) {
  if (ripples.length < 35) {
    ripples.push({ x, y, r: 1, maxR: 6 + Math.random() * 12, alpha: 0.45 });
  }
}

let nextFlash = 5 + Math.random() * 8;
let flashAlpha = 0;
let bolt = null;

function makeBolt() {
  const x0 = Math.random() * W;
  const main = [[x0, 0]];
  const forks = [];
  let x = x0, y = 0;

  while (y < H * 0.65) {
    y += 18 + Math.random() * 28;
    x += (Math.random() - 0.5) * 45;
    main.push([x, y]);

    if (Math.random() < 0.28 && forks.length < 3) {
      let fx = x, fy = y;
      const forkPoints = [[fx, fy]];
      for (let k = 0; k < 4; k++) {
        fy += 12 + Math.random() * 18;
        fx += (Math.random() - 0.2) * 35;
        forkPoints.push([fx, fy]);
      }
      forks.push(forkPoints);
    }
  }
  return { main, forks };
}

let start = performance.now();
let lastT = 0;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, rgba(theme.surface, 1));
  sky.addColorStop(1, rgba(theme.surfaceBright, 1));
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  // Lightning Trigger
  if (t >= nextFlash) {
    flashAlpha = 0.65;
    bolt = makeBolt();
    nextFlash = t + 7 + Math.random() * 12;
  }

  if (flashAlpha > 0.001) {
    ctx.fillStyle = `rgba(235, 245, 255, ${flashAlpha * 0.35})`;
    ctx.fillRect(0, 0, W, H);

    if (bolt) {
      ctx.strokeStyle = `rgba(255, 255, 255, ${flashAlpha})`;
      ctx.lineWidth = 2.5;
      ctx.beginPath();
      ctx.moveTo(bolt.main[0][0], bolt.main[0][1]);
      for (const p of bolt.main) ctx.lineTo(p[0], p[1]);
      ctx.stroke();

      ctx.lineWidth = 1.2;
      for (const fork of bolt.forks) {
        ctx.beginPath();
        ctx.moveTo(fork[0][0], fork[0][1]);
        for (const fp of fork) ctx.lineTo(fp[0], fp[1]);
        ctx.stroke();
      }
    }
    flashAlpha *= 0.88;
  }

  // Ground Ripples
  for (let i = ripples.length - 1; i >= 0; i--) {
    const rp = ripples[i];
    rp.r += dt * 28;
    rp.alpha -= dt * 0.8;

    if (rp.alpha <= 0 || rp.r >= rp.maxR) {
      ripples.splice(i, 1);
      continue;
    }

    ctx.beginPath();
    ctx.ellipse(rp.x, rp.y, rp.r, rp.r * 0.35, 0, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(theme.primary, rp.alpha);
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Rain Streaks
  for (const s of streaks) {
    s.y += s.speed * dt;
    s.x += s.drift * dt;

    if (s.y > H) {
      if (Math.random() < 0.4) spawnRipple(s.x, H - Math.random() * 20);
      s.y = -s.len;
      s.x = Math.random() * (W + 200) - 100;
    }

    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + s.drift * 0.06, s.y - s.len);
    ctx.strokeStyle = rgba(theme.primary, s.alpha);
    ctx.lineWidth = s.width;
    ctx.stroke();
  }

  // Foreground Water Beads
  for (const b of beads) {
    b.y += b.speed * dt;
    const x = b.x + Math.sin(t * 1.5 + b.wob) * 3;

    if (b.y > H) {
      b.y = -10;
      b.x = Math.random() * W;
    }

    ctx.beginPath();
    ctx.arc(x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = rgba(theme.secondary, 0.35);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(x - b.r * 0.3, b.y - b.r * 0.3, b.r * 0.3, 0, Math.PI * 2);
    ctx.fillStyle = 'rgba(255, 255, 255, 0.4)';
    ctx.fill();
  }

  requestAnimationFrame(frame);
}

function fallbackClock() {
  const update = () => {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;

    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', options);
  };
  update();
  setInterval(update, 1000);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  makeDrops();
  loadTheme();
  resize();

  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      fallbackClock();
    }
  } catch (err) {
    fallbackClock();
  }

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
