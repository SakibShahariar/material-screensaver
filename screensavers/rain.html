<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Rain</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --secondary_rgb: 180 199 233; --tertiary_rgb: 186 196 250;
    --surface_rgb: 12 20 27; --surface_bright_rgb: 50 58 65; --outline_rgb: 137 146 154;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock { position: fixed; left: 32px; bottom: 28px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; font-size: clamp(28px,4vw,56px); text-shadow: 0 0 24px rgba(0,0,0,0.4); pointer-events: none; transition: opacity 0.6s ease; }
  #clock .ampm { font-size: 0.36em; margin-left: 6px; opacity: 0.82; vertical-align: middle; }
  #date { position: fixed; left: 34px; bottom: 14px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: clamp(12px,1.2vw,16px); letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; transition: opacity 0.6s ease; }
  #hint { position: fixed; right: 28px; bottom: 26px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: 13px; letter-spacing: 0.5px; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>
<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  makeDrops();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.25 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'), surfaceBright: readRGB('--surface_bright_rgb'),
    primary: readRGB('--primary_rgb'), secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'), outline: readRGB('--outline_rgb'),
  };
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

let streaks = [], beads = [];
function makeDrops() {
  streaks = [];
  for (let i = 0; i < 220; i++) {
    streaks.push({ x: Math.random() * W, y: Math.random() * H, len: 14 + Math.random() * 26, speed: 500 + Math.random() * 350, drift: -30 - Math.random() * 20, alpha: 0.15 + Math.random() * 0.25 });
  }
  beads = [];
  for (let i = 0; i < 18; i++) {
    beads.push({ x: Math.random() * W, y: Math.random() * H, speed: 25 + Math.random() * 30, wob: Math.random() * Math.PI * 2, r: 2 + Math.random() * 2.5 });
  }
}

let nextFlash = 6 + Math.random() * 10;
let flashAlpha = 0;
let bolt = null;

function makeBolt() {
  const x0 = Math.random() * W;
  const points = [[x0, 0]];
  let x = x0, y = 0;
  while (y < H * 0.6) {
    y += 20 + Math.random() * 30;
    x += (Math.random() - 0.5) * 40;
    points.push([x, y]);
  }
  return points;
}

let start = performance.now();
let lastT = 0;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const sky = ctx.createLinearGradient(0, 0, 0, H);
  sky.addColorStop(0, `rgb(${(theme.surface || [12,20,27]).join(',')})`);
  sky.addColorStop(1, `rgb(${(theme.surfaceBright || [40,46,52]).join(',')})`);
  ctx.fillStyle = sky;
  ctx.fillRect(0, 0, W, H);

  if (t >= nextFlash) {
    flashAlpha = 0.5;
    bolt = makeBolt();
    nextFlash = t + 8 + Math.random() * 14;
  }
  if (flashAlpha > 0.001) {
    ctx.fillStyle = `rgba(255,255,255,${flashAlpha})`;
    ctx.fillRect(0, 0, W, H);
    if (bolt) {
      ctx.strokeStyle = `rgba(255,255,255,${flashAlpha})`;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(bolt[0][0], bolt[0][1]);
      for (const p of bolt) ctx.lineTo(p[0], p[1]);
      ctx.stroke();
    }
    flashAlpha *= 0.86;
  }

  for (const s of streaks) {
    s.y += s.speed * dt;
    s.x += s.drift * dt;
    if (s.y > H) { s.y = -s.len; s.x = Math.random() * W; }
    ctx.beginPath();
    ctx.moveTo(s.x, s.y);
    ctx.lineTo(s.x + s.drift * 0.05, s.y - s.len);
    ctx.strokeStyle = rgba(theme.primary, s.alpha);
    ctx.lineWidth = 1.2;
    ctx.stroke();
  }

  for (const b of beads) {
    b.y += b.speed * dt;
    const x = b.x + Math.sin(t * 1.5 + b.wob) * 2.5;
    if (b.y > H) { b.y = -10; b.x = Math.random() * W; }
    ctx.beginPath();
    ctx.arc(x, b.y, b.r, 0, Math.PI * 2);
    ctx.fillStyle = rgba(theme.secondary, 0.3);
    ctx.fill();
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});
hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  loadTheme();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
