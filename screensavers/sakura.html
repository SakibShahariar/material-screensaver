<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Sakura</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --primary_container_rgb: 0 75 111;
  --tertiary_container_rgb: 58 68 114;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .88) 0%,
    rgb(var(--surface_rgb) / .55) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1;
let theme = {};
let roleList = [];
let petals = [];
let pile = [];
let nextGust = 4;
let gustStrength = 0;
let interactiveGust = { active: false, x: 0, y: 0, strength: 0 };
let start = performance.now();
let lastT = 0;
let lastPileReset = 0;
let cursorTimer;

const PILE_RES = 70;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.25 : 0.85;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:           readRGB("--surface_rgb", [12, 20, 27]),
    primary:           readRGB("--primary_rgb", [138, 206, 255]),
    secondary:         readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:          readRGB("--tertiary_rgb", [186, 196, 250]),
    primaryContainer:  readRGB("--primary_container_rgb", [0, 75, 111]),
    tertiaryContainer: readRGB("--tertiary_container_rgb", [58, 68, 114]),
    outline:           readRGB("--outline_rgb", [137, 146, 154])
  };

  roleList = [
    theme.primary,
    theme.secondary,
    theme.tertiary,
    theme.primaryContainer,
    theme.tertiaryContainer
  ];

  petals.forEach((p, i) => {
    p.color = roleList[i % roleList.length];
  });

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function pileIndex(x) {
  return Math.max(0, Math.min(PILE_RES - 1, Math.floor((x / W) * PILE_RES)));
}

function spawnPetal(p) {
  p.x = Math.random() * W * 1.2 - W * 0.1;
  p.y = -20 - Math.random() * 100;
  p.size = 6 + Math.random() * 8;
  p.fallSpeed = 16 + Math.random() * 22;
  p.swayAmp = 28 + Math.random() * 48;
  p.swayFreq = 0.28 + Math.random() * 0.4;
  p.phase = Math.random() * Math.PI * 2;
  p.rot = Math.random() * Math.PI * 2;
  p.rotSpeed = (Math.random() - 0.5) * 1.3;
  p.color = roleList[Math.floor(Math.random() * Math.max(1, roleList.length))] || [230, 180, 200];
}

function initPetals() {
  petals = [];
  pile = new Array(PILE_RES).fill(0);
  for (let i = 0; i < 60; i++) {
    const p = {};
    spawnPetal(p);
    p.y = Math.random() * H;
    petals.push(p);
  }
}

function drawPetal(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);

  ctx.beginPath();
  ctx.moveTo(0, -p.size);
  ctx.bezierCurveTo(p.size * 0.9, -p.size * 0.6, p.size * 0.9, p.size * 0.5, 0, p.size);
  ctx.bezierCurveTo(-p.size * 0.9, p.size * 0.5, -p.size * 0.9, -p.size * 0.6, 0, -p.size);
  ctx.closePath();
  ctx.fillStyle = rgba(p.color, 0.78);
  ctx.fill();

  const grad = ctx.createRadialGradient(0, -p.size * 0.2, 0, 0, 0, p.size);
  grad.addColorStop(0, "rgba(255,255,255,0.28)");
  grad.addColorStop(1, "transparent");
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.restore();
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT || 0.016);
  lastT = t;

  if (t - lastPileReset > 140) {
    pile = new Array(PILE_RES).fill(0);
    lastPileReset = t;
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  if (t >= nextGust) {
    gustStrength = 55 + Math.random() * 75;
    nextGust = t + 5.5 + Math.random() * 9;
  }
  gustStrength *= 0.955;

  if (interactiveGust.active) {
    interactiveGust.strength *= 0.91;
    if (interactiveGust.strength < 1) interactiveGust.active = false;
  }

  // Ground pile
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i < PILE_RES; i++) {
    const x = (i / (PILE_RES - 1)) * W;
    ctx.lineTo(x, H - (pile[i] || 0));
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = rgba(theme.primary, 0.32);
  ctx.fill();

  for (const p of petals) {
    let extraX = 0, extraY = 0;
    if (interactiveGust.active) {
      const dx = p.x - interactiveGust.x;
      const dy = p.y - interactiveGust.y;
      const distSq = dx * dx + dy * dy;
      const maxDist = 300;
      if (distSq < maxDist * maxDist && distSq > 1) {
        const dist = Math.sqrt(distSq);
        const force = (1 - dist / maxDist) * interactiveGust.strength;
        extraX += (dx / dist) * force;
        extraY += (dy / dist) * force * 0.45 - force * 0.25;
      }
    }

    p.y += (p.fallSpeed + extraY) * dt;
    p.x += (Math.sin(t * p.swayFreq + p.phase) * p.swayAmp * 0.28 + gustStrength + extraX) * dt;
    p.rot += p.rotSpeed * dt;

    const idx = pileIndex(p.x);
    const floorY = H - (pile[idx] || 0);
    if (p.y >= floorY) {
      pile[idx] = Math.min(H * 0.11, (pile[idx] || 0) + 0.55);
      spawnPetal(p);
      continue;
    }
    if (p.x > W + 35 || p.x < -35) spawnPetal(p);
    drawPetal(p);
  }

  requestAnimationFrame(frame);
}

addEventListener("pointerdown", e => {
  interactiveGust = { active: true, x: e.clientX, y: e.clientY, strength: 170 };
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
});

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockWrap.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();
  initPetals();
  loadTheme();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
