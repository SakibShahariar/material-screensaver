<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Sakura</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --secondary_rgb: 180 199 233; --tertiary_rgb: 186 196 250;
    --primary_container_rgb: 0 75 111; --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27; --outline_rgb: 137 146 154;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock { position: fixed; left: 32px; bottom: 28px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; font-size: clamp(28px,4vw,56px); text-shadow: 0 0 24px rgba(0,0,0,0.4); pointer-events: none; transition: opacity 0.6s ease; }
  #clock .ampm { font-size: 0.36em; margin-left: 6px; opacity: 0.82; vertical-align: middle; }
  #date { position: fixed; left: 34px; bottom: 14px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: clamp(12px,1.2vw,16px); letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; transition: opacity 0.6s ease; }
  #hint { position: fixed; right: 28px; bottom: 26px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: 13px; letter-spacing: 0.5px; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>
<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.25 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'), primary: readRGB('--primary_rgb'), secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'), primaryContainer: readRGB('--primary_container_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'), outline: readRGB('--outline_rgb'),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.tertiaryContainer];
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

let petals = [];
let pile = [];
const PILE_RES = 70;
let nextGust = 4 + Math.random() * 6;
let gustStrength = 0;
let interactiveGust = { active: false, x: 0, y: 0, strength: 0 };

function pileIndex(x) { return Math.max(0, Math.min(PILE_RES - 1, Math.floor((x / W) * PILE_RES))); }

function spawnPetal(p) {
  p.x = Math.random() * W * 1.2 - W * 0.1;
  p.y = -20 - Math.random() * 100;
  p.size = 6 + Math.random() * 8;
  p.fallSpeed = 18 + Math.random() * 22;
  p.swayAmp = 30 + Math.random() * 50;
  p.swayFreq = 0.3 + Math.random() * 0.4;
  p.phase = Math.random() * Math.PI * 2;
  p.rot = Math.random() * Math.PI * 2;
  p.rotSpeed = (Math.random() - 0.5) * 1.4;
  p.color = roleList.length ? roleList[Math.floor(Math.random() * roleList.length)] : [230, 180, 200];
}

function initPetals() {
  petals = [];
  pile = new Array(PILE_RES).fill(0);
  for (let i = 0; i < 60; i++) {
    const p = {};
    spawnPetal(p);
    p.y = Math.random() * H;
    petals.push(p);
  }
}

function drawPetal(p) {
  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  
  ctx.beginPath();
  ctx.moveTo(0, -p.size);
  ctx.bezierCurveTo(p.size * 0.9, -p.size * 0.6, p.size * 0.9, p.size * 0.5, 0, p.size);
  ctx.bezierCurveTo(-p.size * 0.9, p.size * 0.5, -p.size * 0.9, -p.size * 0.6, 0, -p.size);
  ctx.closePath();
  ctx.fillStyle = rgba(p.color, 0.75);
  ctx.fill();

  // Subtle interior translucency highlight
  const grad = ctx.createRadialGradient(0, -p.size * 0.2, 0, 0, 0, p.size);
  grad.addColorStop(0, rgba([255, 255, 255], 0.3));
  grad.addColorStop(1, rgba(p.color, 0));
  ctx.fillStyle = grad;
  ctx.fill();

  ctx.restore();
}

window.addEventListener('pointerdown', (e) => {
  interactiveGust = {
    active: true,
    x: e.clientX,
    y: e.clientY,
    strength: 180
  };
});

let start = performance.now();
let lastT = 0;
let lastPileReset = 0;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  if (t - lastPileReset > 150) {
    pile = new Array(PILE_RES).fill(0);
    lastPileReset = t;
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgb(${(theme.surface || [12, 20, 27]).join(',')})`;
  ctx.fillRect(0, 0, W, H);

  if (t >= nextGust) {
    gustStrength = 60 + Math.random() * 80;
    nextGust = t + 6 + Math.random() * 10;
  }
  gustStrength *= 0.96;

  if (interactiveGust.active) {
    interactiveGust.strength *= 0.92;
    if (interactiveGust.strength < 1) interactiveGust.active = false;
  }

  // accumulated pile along the bottom
  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i < PILE_RES; i++) {
    const x = (i / (PILE_RES - 1)) * W;
    ctx.lineTo(x, H - pile[i]);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = rgba(theme.primary, 0.35);
  ctx.fill();

  for (const p of petals) {
    let extraX = 0;
    let extraY = 0;

    if (interactiveGust.active) {
      const dx = p.x - interactiveGust.x;
      const dy = p.y - interactiveGust.y;
      const distSq = dx * dx + dy * dy;
      const maxDist = 300;
      if (distSq < maxDist * maxDist && distSq > 1) {
        const dist = Math.sqrt(distSq);
        const force = (1 - dist / maxDist) * interactiveGust.strength;
        extraX += (dx / dist) * force;
        extraY += (dy / dist) * force * 0.5 - force * 0.3;
      }
    }

    p.y += (p.fallSpeed + extraY) * dt;
    p.x += (Math.sin(t * p.swayFreq + p.phase) * p.swayAmp * 0.3 + gustStrength + extraX) * dt;
    p.rot += p.rotSpeed * dt;

    const idx = pileIndex(p.x);
    const floorY = H - (pile[idx] || 0);
    if (p.y >= floorY) {
      pile[idx] = Math.min(H * 0.12, (pile[idx] || 0) + 0.6);
      spawnPetal(p);
      continue;
    }
    if (p.x > W + 30 || p.x < -30) spawnPetal(p);
    drawPetal(p);
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});
hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();
  initPetals();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
