<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Sakura</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0c141b;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.8s ease;
  }
  #ui-container.hidden { opacity: 0; }

  .vignette-glass {
    background: radial-gradient(circle at center, rgba(12, 20, 27, 0.65) 0%, rgba(12, 20, 27, 0) 80%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 28px 40px;
    width: fit-content;
    border-radius: 24px;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-glass">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint">Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
let windBoost = 0;

function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}

window.addEventListener('pointermove', (e) => {
  triggerCursor();
  windBoost = (e.movementX || 0) * 0.15;
});
window.addEventListener('pointerdown', () => {
  triggerCursor();
  windBoost = 15;
});

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.25 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    surfaceBright: readRGB('--surface_bright_rgb', [32, 40, 48]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };
  roleList = [
    theme.primary, theme.secondary, theme.tertiary,
    theme.primaryContainer, theme.tertiaryContainer
  ];

  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

let petals = [];
let groundPetals = [];

function spawnPetal(p) {
  p.x = Math.random() * W * 1.3 - W * 0.15;
  p.y = -20 - Math.random() * 120;
  p.size = 7 + Math.random() * 9;
  p.fallSpeed = 22 + Math.random() * 26;
  p.swayAmp = 35 + Math.random() * 55;
  p.swayFreq = 0.4 + Math.random() * 0.5;
  p.phase = Math.random() * Math.PI * 2;
  p.rot = Math.random() * Math.PI * 2;
  p.rotSpeed = (Math.random() - 0.5) * 1.8;
  p.flipSpeed = 1.2 + Math.random() * 1.8;
  p.color = roleList.length ? roleList[Math.floor(Math.random() * roleList.length)] : [230, 180, 200];
  p.alpha = 0.65 + Math.random() * 0.25;
}

function initPetals() {
  petals = [];
  groundPetals = [];
  for (let i = 0; i < 75; i++) {
    const p = {};
    spawnPetal(p);
    p.y = Math.random() * H;
    petals.push(p);
  }
}

function drawPetalShape(s) {
  ctx.beginPath();
  ctx.moveTo(0, -s);
  // Organic notched petal tip
  ctx.bezierCurveTo(s * 0.85, -s * 0.65, s * 0.95, s * 0.45, s * 0.1, s);
  ctx.lineTo(0, s * 0.85);
  ctx.lineTo(-s * 0.1, s);
  ctx.bezierCurveTo(-s * 0.95, s * 0.45, -s * 0.85, -s * 0.65, 0, -s);
  ctx.closePath();
}

function drawPetal(p, t) {
  const flip = Math.sin(t * p.flipSpeed + p.phase);
  const s = p.size;

  ctx.save();
  ctx.translate(p.x, p.y);
  ctx.rotate(p.rot);
  ctx.scale(1, flip);

  drawPetalShape(s);
  ctx.fillStyle = rgba(p.color, p.alpha);
  ctx.fill();

  // Gentle center crease line
  ctx.beginPath();
  ctx.moveTo(0, -s * 0.7);
  ctx.lineTo(0, s * 0.6);
  ctx.strokeStyle = 'rgba(255, 255, 255, 0.25)';
  ctx.lineWidth = 0.8;
  ctx.stroke();

  ctx.restore();
}

let start = performance.now();
let lastT = 0;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  windBoost *= 0.95;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  // Soft atmospheric background gradient
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, rgba(theme.surface, 1));
  bgGrad.addColorStop(1, rgba(theme.surfaceBright, 1));
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  // Ground Resting Petals
  for (let i = groundPetals.length - 1; i >= 0; i--) {
    const gp = groundPetals[i];
    gp.alpha -= dt * 0.035;
    if (gp.alpha <= 0) {
      groundPetals.splice(i, 1);
      continue;
    }
    ctx.save();
    ctx.translate(gp.x, gp.y);
    ctx.rotate(gp.rot);
    ctx.scale(1, 0.3);
    drawPetalShape(gp.size);
    ctx.fillStyle = rgba(gp.color, gp.alpha);
    ctx.fill();
    ctx.restore();
  }

  // Active Falling Petals
  for (const p of petals) {
    p.y += p.fallSpeed * dt;
    const sway = Math.sin(t * p.swayFreq + p.phase) * p.swayAmp;
    p.x += (sway * 0.35 + windBoost) * dt;
    p.rot += p.rotSpeed * dt;

    // Land on ground or recycled
    if (p.y > H - 8) {
      if (Math.random() < 0.35 && groundPetals.length < 30) {
        groundPetals.push({
          x: p.x,
          y: H - 4 - Math.random() * 8,
          size: p.size,
          rot: p.rot,
          color: p.color,
          alpha: p.alpha * 0.6
        });
      }
      spawnPetal(p);
    }

    drawPetal(p, t);
  }

  requestAnimationFrame(frame);
}

function fallbackClock() {
  const update = () => {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;

    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', options);
  };
  update();
  setInterval(update, 1000);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  loadTheme();
  initPetals();

  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      fallbackClock();
    }
  } catch (err) {
    fallbackClock();
  }

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
