<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Solar Orbit</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .88) 0%,
    rgb(var(--surface_rgb) / .55) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0;
let theme = {};
let start = performance.now();
let cursorTimer;

const orbits = [
  { radiusFactor: 0.18, speed: 0.32, size: 4, colorKey: "tertiary" },
  { radiusFactor: 0.30, speed: 0.20, size: 7, colorKey: "primary" },
  { radiusFactor: 0.44, speed: 0.14, size: 5, colorKey: "secondary" },
  { radiusFactor: 0.60, speed: 0.085, size: 9, colorKey: "primary" },
  { radiusFactor: 0.78, speed: 0.048, size: 6, colorKey: "tertiary" }
];

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.2 : 0.8;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:   readRGB("--surface_rgb", [12, 20, 27]),
    primary:   readRGB("--primary_rgb", [138, 206, 255]),
    secondary: readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:  readRGB("--tertiary_rgb", [186, 196, 250]),
    outline:   readRGB("--outline_rgb", [137, 146, 154])
  };

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  cx = W * 0.5; cy = H * 0.5;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  const baseRadius = Math.min(W, H) * 0.52;

  // Star core glow
  const coreGrad = ctx.createRadialGradient(cx, cy, 0, cx, cy, 70);
  coreGrad.addColorStop(0, rgba(theme.primary, 0.35));
  coreGrad.addColorStop(0.45, rgba(theme.primary, 0.1));
  coreGrad.addColorStop(1, "transparent");
  ctx.fillStyle = coreGrad;
  ctx.beginPath();
  ctx.arc(cx, cy, 70, 0, Math.PI * 2);
  ctx.fill();

  ctx.beginPath();
  ctx.arc(cx, cy, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = rgba(theme.primary, 0.98);
  ctx.fill();

  // Orbits + planets
  orbits.forEach((orbit, index) => {
    const r = baseRadius * orbit.radiusFactor;

    // Path ring
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = rgba(theme.outline, 0.14 + index * 0.02);
    ctx.lineWidth = 1;
    ctx.stroke();

    const angle = t * orbit.speed + index * 1.7;
    const x = cx + Math.cos(angle) * r;
    const y = cy + Math.sin(angle) * r;
    const pColor = theme[orbit.colorKey] || theme.primary;

    // Planet glow
    const pGrad = ctx.createRadialGradient(x, y, 0, x, y, orbit.size * 2.8);
    pGrad.addColorStop(0, rgba(pColor, 0.45));
    pGrad.addColorStop(1, "transparent");
    ctx.fillStyle = pGrad;
    ctx.beginPath();
    ctx.arc(x, y, orbit.size * 2.8, 0, Math.PI * 2);
    ctx.fill();

    // Planet body
    ctx.beginPath();
    ctx.arc(x, y, orbit.size, 0, Math.PI * 2);
    ctx.fillStyle = rgba(pColor, 0.95);
    ctx.fill();
  });

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockWrap.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
