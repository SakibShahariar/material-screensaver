<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Solar System 3D</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --secondary_rgb: 180 199 233;
    --surface_rgb: 4 6 10;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb)); cursor: default;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }
  canvas { display: block; width: 100%; height: 100%; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 32px; box-sizing: border-box;
    transition: opacity 0.8s cubic-bezier(0.16, 1, 0.3, 1);
  }
  #ui-container.hidden { opacity: 0; }

  .glass-panel {
  background: radial-gradient(circle at center, rgba(12, 20, 27, 0.5) 0%, rgba(12, 20, 27, 0) 75%);
  backdrop-filter: none;
  -webkit-backdrop-filter: none;
  border: none;
  border-radius: 0;
  padding: 24px 36px;
  width: fit-content;
  box-shadow: none;
  }

  #clock {
    font-size: clamp(36px, 5vw, 68px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.75;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 6px;
    opacity: 0.85;
  }

  #controls-hint {
    position: fixed; right: 32px; bottom: 32px;
    font-size: 12px; letter-spacing: 1px;
    opacity: 0.6; transition: opacity 0.4s ease;
  }

  .planet-label {
    position: fixed;
    font-size: 11px;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    pointer-events: none;
    padding: 4px 8px;
    border-radius: 6px;
    background: rgba(6, 9, 14, 0.6);
    backdrop-filter: blur(6px);
    border: 1px solid rgba(255, 255, 255, 0.1);
    transform: translate(-50%, -140%);
    white-space: nowrap;
    z-index: 5;
    transition: opacity 0.3s ease;
  }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<div id="ui-container">
  <div class="glass-card">
    <div id="clock">12:00<span class="ampm">PM</span></div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="controls-hint" class="glass-card">Press <b>C</b> to toggle UI | Click planet to focus</div>
</div>

<script src="clock-shared.js"></script>
<script>
// --- Theme Utilities ---
function readRGB(name, defaultRgb) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : defaultRgb;
}
function rgbCss(rgb) { return `rgb(${rgb[0]}, ${rgb[1]}, ${rgb[2]})`; }
function rgbHex(rgb) { return (rgb[0] << 16) | (rgb[1] << 8) | rgb[2]; }

const theme = {
  surface: readRGB('--surface_rgb', [4, 6, 10]),
  primary: readRGB('--primary_rgb', [138, 206, 255]),
  secondary: readRGB('--secondary_rgb', [180, 199, 233]),
  onSurfaceVariant: readRGB('--on_surface_variant_rgb', [191, 199, 209]),
  outline: readRGB('--outline_rgb', [137, 146, 154]),
};

document.getElementById('clock').style.color = rgbCss(theme.primary);
document.getElementById('date').style.color = rgbCss(theme.secondary);
document.getElementById('controls-hint').style.color = rgbCss(theme.outline);

// --- Clock: shared across all screensavers, respects the AM/PM setting from the GUI ---
startClock(document.getElementById('clock'), document.getElementById('date'));

// --- Procedural Textures ---
function createSunTexture() {
  const canvas = document.createElement('canvas');
  canvas.width = 1024; canvas.height = 512;
  const ctx = canvas.getContext('2d');
  
  const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
  grad.addColorStop(0, '#ffcc00');
  grad.addColorStop(0.5, '#ff3300');
  grad.addColorStop(1, '#ffaa00');
  ctx.fillStyle = grad;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  // Noise detail layer
  for (let i = 0; i < 8000; i++) {
    ctx.fillStyle = Math.random() > 0.5 ? 'rgba(255,255,255,0.15)' : 'rgba(0,0,0,0.15)';
    ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 6, Math.random() * 6);
  }
  return new THREE.CanvasTexture(canvas);
}

function createPlanetTexture(baseHex, bandHex) {
  const canvas = document.createElement('canvas');
  canvas.width = 512; canvas.height = 256;
  const ctx = canvas.getContext('2d');
  
  ctx.fillStyle = baseHex;
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  if (bandHex) {
    ctx.fillStyle = bandHex;
    for (let i = 0; i < 12; i++) {
      const y = Math.random() * canvas.height;
      const h = Math.random() * 25 + 5;
      ctx.globalAlpha = Math.random() * 0.4 + 0.1;
      ctx.fillRect(0, y, canvas.width, h);
    }
  }
  return new THREE.CanvasTexture(canvas);
}

// --- Data Configuration ---
const DAYS_PER_SECOND = 8;
const PLANETS = [
  { name: 'Mercury', au: 0.39, periodDays: 88,    e: 0.2056, incl: 7.00, color: '#a6a6a6', band: '#737373', r: 0.5 },
  { name: 'Venus',   au: 0.72, periodDays: 225,   e: 0.0068, incl: 3.39, color: '#e6c280', band: '#cc9900', r: 0.95 },
  { name: 'Earth',   au: 1.00, periodDays: 365.25,e: 0.0167, incl: 0.00, color: '#2b82c5', band: '#1b4d73', r: 1.0,
    moons: [{ name: 'Moon', periodSec: 6, color: '#d9d9d9', dist: 2.0, size: 0.26 }] },
  { name: 'Mars',    au: 1.52, periodDays: 687,   e: 0.0934, incl: 1.85, color: '#c85232', band: '#802a15', r: 0.75 },
  { name: 'Jupiter', au: 5.20, periodDays: 4333,  e: 0.0484, incl: 1.30, color: '#b08d57', band: '#e3c08d', r: 2.6,
    moons: [
      { name: 'Io',       periodSec: 3,  color: '#f2cf63', dist: 3.8, size: 0.22 },
      { name: 'Europa',   periodSec: 5,  color: '#d0c8b8', dist: 4.8, size: 0.20 },
      { name: 'Ganymede', periodSec: 9,  color: '#9e9285', dist: 6.0, size: 0.30 },
      { name: 'Callisto', periodSec: 16, color: '#6e655c', dist: 7.4, size: 0.28 },
    ] },
  { name: 'Saturn',  au: 9.58, periodDays: 10759, e: 0.0542, incl: 2.49, color: '#e2ca84', band: '#a89250', r: 2.2, ring: true,
    moons: [{ name: 'Titan', periodSec: 10, color: '#cca250', dist: 4.6, size: 0.32 }] },
  { name: 'Uranus',  au: 19.2, periodDays: 30687, e: 0.0472, incl: 0.77, color: '#7bc8d0', band: '#418b94', r: 1.6 },
  { name: 'Neptune', au: 30.05,periodDays: 60190, e: 0.0086, incl: 1.77, color: '#3f62c6', band: '#1d3480', r: 1.55 },
];

// Scaled orbital major axes
const sqrtAUs = PLANETS.map(p => Math.sqrt(p.au));
const sqrtMin = Math.min(...sqrtAUs), sqrtMax = Math.max(...sqrtAUs);
const MIN_ORBIT = 8, MAX_ORBIT = 38;
for (const p of PLANETS) {
  const s = Math.sqrt(p.au);
  p.a = MIN_ORBIT + (s - sqrtMin) / (sqrtMax - sqrtMin) * (MAX_ORBIT - MIN_ORBIT);
  p.phase = Math.random() * Math.PI * 2;
  p.inclRad = p.incl * (Math.PI / 180) * 0.25;
}

// --- Three.js Setup ---
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(rgbHex(theme.surface), 0.003);

const camera = new THREE.PerspectiveCamera(50, window.innerWidth / window.innerHeight, 0.1, 1000);
const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: 'high-performance' });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setClearColor(rgbHex(theme.surface));
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.2;
document.body.appendChild(renderer.domElement);

// --- Deep Space Background & Starfield ---
{
  const count = 3500;
  const positions = new Float32Array(count * 3);
  const colors = new Float32Array(count * 3);
  for (let i = 0; i < count; i++) {
    const r = 250 + Math.random() * 350;
    const theta = Math.random() * Math.PI * 2;
    const phi = Math.acos(2 * Math.random() - 1);
    positions[i * 3]     = r * Math.sin(phi) * Math.cos(theta);
    positions[i * 3 + 1] = r * Math.cos(phi);
    positions[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);

    const c = new THREE.Color().setHSL(0.55 + Math.random() * 0.15, 0.6, 0.6 + Math.random() * 0.4);
    colors[i * 3]     = c.r;
    colors[i * 3 + 1] = c.g;
    colors[i * 3 + 2] = c.b;
  }
  const geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
  geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));
  const mat = new THREE.PointsMaterial({ size: 1.2, vertexColors: true, transparent: true, opacity: 0.85 });
  scene.add(new THREE.Points(geo, mat));
}

// --- Sun & Lighting ---
const sunGeo = new THREE.SphereGeometry(3.0, 48, 48);
const sunMat = new THREE.MeshBasicMaterial({ map: createSunTexture() });
const sun = new THREE.Mesh(sunGeo, sunMat);
scene.add(sun);

// Sun Glow / Atmosphere Shader Sprite
const glowMat = new THREE.SpriteMaterial({
  map: (() => {
    const canvas = document.createElement('canvas');
    canvas.width = 256; canvas.height = 256;
    const ctx = canvas.getContext('2d');
    const grad = ctx.createRadialGradient(128, 128, 0, 128, 128, 128);
    grad.addColorStop(0, 'rgba(255,200,120,1)');
    grad.addColorStop(0.3, 'rgba(255,140,40,0.4)');
    grad.addColorStop(1, 'rgba(0,0,0,0)');
    ctx.fillStyle = grad; ctx.fillRect(0,0,256,256);
    return new THREE.CanvasTexture(canvas);
  })(),
  transparent: true,
  blending: THREE.AdditiveBlending,
  depthWrite: false
});
const sunGlow = new THREE.Sprite(glowMat);
sunGlow.scale.set(22, 22, 1);
scene.add(sunGlow);

const sunLight = new THREE.PointLight(0xfff2d4, 3.0, 400, 0.5);
scene.add(sunLight);
scene.add(new THREE.AmbientLight(0x222838, 0.6));

// --- Planet Construction ---
const labelContainer = document.body;

PLANETS.forEach(p => {
  // Orbit Path
  const points = [];
  for (let i = 0; i <= 128; i++) {
    const ang = (i / 128) * Math.PI * 2;
    const r = p.a * (1 - p.e * p.e) / (1 + p.e * Math.cos(ang));
    const x = r * Math.cos(ang);
    const z0 = r * Math.sin(ang);
    points.push(new THREE.Vector3(x, z0 * Math.sin(p.inclRad), z0 * Math.cos(p.inclRad)));
  }
  const orbitGeo = new THREE.BufferGeometry().setFromPoints(points);
  const orbitMat = new THREE.LineBasicMaterial({ color: rgbHex(theme.outline), transparent: true, opacity: 0.18 });
  scene.add(new THREE.Line(orbitGeo, orbitMat));

  // Planet Mesh
  const texture = createPlanetTexture(p.color, p.band);
  const pGeo = new THREE.SphereGeometry(p.r, 32, 32);
  const pMat = new THREE.MeshStandardMaterial({
    map: texture,
    roughness: 0.7,
    metalness: 0.1,
  });
  p.mesh = new THREE.Mesh(pGeo, pMat);
  scene.add(p.mesh);

  // Saturn Rings
  if (p.ring) {
    const ringGeo = new THREE.RingGeometry(p.r * 1.4, p.r * 2.5, 64);
    // Rotate texture mapping across the ring
    const pos = ringGeo.attributes.position;
    const uv = ringGeo.attributes.uv;
    for (let i = 0; i < pos.count; i++) {
      const x = pos.getX(i), y = pos.getY(i);
      const len = Math.sqrt(x * x + y * y);
      uv.setXY(i, (len - p.r * 1.4) / (p.r * 1.1), 0.5);
    }
    const ringMat = new THREE.MeshStandardMaterial({
      color: 0xd2bd8a, side: THREE.DoubleSide, transparent: true, opacity: 0.75, roughness: 0.5
    });
    const ring = new THREE.Mesh(ringGeo, ringMat);
    ring.rotation.x = Math.PI / 2 - 0.2;
    p.mesh.add(ring);
  }

  // Moons
  if (p.moons) {
    p.moons.forEach(m => {
      m.anchor = new THREE.Object3D();
      p.mesh.add(m.anchor);
      m.mesh = new THREE.Mesh(
        new THREE.SphereGeometry(m.size, 16, 16),
        new THREE.MeshStandardMaterial({ color: m.color, roughness: 0.8 })
      );
      m.mesh.position.set(m.dist, 0, 0);
      m.anchor.add(m.mesh);
    });
  }

  // Label UI
  p.label = document.createElement('div');
  p.label.className = 'planet-label';
  p.label.textContent = p.name;
  p.label.style.color = rgbCss(theme.onSurfaceVariant);
  labelContainer.appendChild(p.label);
});

// --- Camera Focus & Interactive State ---
let focusTarget = null;
const tempVec = new THREE.Vector3();

const raycaster = new THREE.Raycaster();
const mouse = new THREE.Vector2();

window.addEventListener('click', (e) => {
  mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
  mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
  raycaster.setFromCamera(mouse, camera);

  const meshes = PLANETS.map(p => p.mesh);
  const intersects = raycaster.intersectObjects(meshes);

  if (intersects.length > 0) {
    const hitMesh = intersects[0].object;
    focusTarget = PLANETS.find(p => p.mesh === hitMesh) || null;
  } else {
    focusTarget = null; // Reset view
  }
});

// --- Animation Loop ---
let start = performance.now();
const defaultCamDist = 65;

function animate(now) {
  const elapsed = (now - start) / 1000;
  const elapsedDays = elapsed * DAYS_PER_SECOND;

  // Rotate Sun
  sun.rotation.y = elapsed * 0.05;

  // Orbit Planets
  PLANETS.forEach(p => {
    const angle = p.phase + (Math.PI * 2) * (elapsedDays / p.periodDays);
    const r = p.a * (1 - p.e * p.e) / (1 + p.e * Math.cos(angle));
    const x = r * Math.cos(angle);
    const z0 = r * Math.sin(angle);
    
    p.mesh.position.set(x, z0 * Math.sin(p.inclRad), z0 * Math.cos(p.inclRad));
    p.mesh.rotation.y += 0.008;

    if (p.moons) {
      p.moons.forEach(m => {
        m.anchor.rotation.y = (elapsed / m.periodSec) * Math.PI * 2;
      });
    }

    // Label position projection
    p.mesh.getWorldPosition(tempVec);
    tempVec.project(camera);
    if (tempVec.z < 1) {
      p.label.style.display = 'block';
      p.label.style.left = `${(tempVec.x * 0.5 + 0.5) * window.innerWidth}px`;
      p.label.style.top = `${(-tempVec.y * 0.5 + 0.5) * window.innerHeight}px`;
    } else {
      p.label.style.display = 'none';
    }
  });

  // Smooth Camera Dynamics
  if (focusTarget) {
    focusTarget.mesh.getWorldPosition(tempVec);
    const targetCamPos = new THREE.Vector3()
      .copy(tempVec)
      .add(new THREE.Vector3(focusTarget.r * 4, focusTarget.r * 2.5, focusTarget.r * 5));
    
    camera.position.lerp(targetCamPos, 0.04);
    camera.lookAt(tempVec);
  } else {
    const orbitAngle = elapsed * 0.02;
    const targetCamPos = new THREE.Vector3(
      Math.cos(orbitAngle) * defaultCamDist,
      32 + Math.sin(elapsed * 0.05) * 5,
      Math.sin(orbitAngle) * defaultCamDist
    );
    camera.position.lerp(targetCamPos, 0.03);
    camera.lookAt(0, 0, 0);
  }

  renderer.render(scene, camera);
  requestAnimationFrame(animate);
}

// --- Window & Keyboard Listeners ---
window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    document.getElementById('ui-container').classList.toggle('hidden', !uiVisible);
  }
});

requestAnimationFrame(animate);
</script>
</body>
</html>
