<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Material Solar Orbit</title>
<style>
:root{
  --primary_rgb:138 206 255;
  --secondary_rgb:180 199 233;
  --tertiary_rgb:186 196 250;
  --surface_rgb:5 9 14;
  --outline_rgb:137 146 154;
}
*{box-sizing:border-box}
html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#05090e}
body{font-family:"Google Sans","Segoe UI",Roboto,system-ui,sans-serif;cursor:none;user-select:none}
body.show-cursor{cursor:default}
canvas{display:block;width:100vw;height:100vh}
#ui{position:fixed;inset:0;pointer-events:none;transition:opacity .7s ease}
#ui.hidden{opacity:0}
.card{
  position:absolute;left:clamp(28px,3.2vw,58px);bottom:clamp(28px,3.2vw,52px);
  width:clamp(310px,26vw,430px);padding:28px 38px 27px;
  border:1px solid rgba(210,230,255,.17);
  border-radius:27px;
  background:linear-gradient(145deg,rgba(9,17,25,.70),rgba(5,11,17,.45));
  box-shadow:0 28px 80px rgba(0,0,0,.48),inset 0 1px rgba(255,255,255,.06);
  backdrop-filter:blur(18px) saturate(125%);
  -webkit-backdrop-filter:blur(18px) saturate(125%);
}
#clock{font-size:clamp(46px,5.3vw,82px);font-weight:300;line-height:.9;letter-spacing:-3px;font-variant-numeric:tabular-nums;text-shadow:0 4px 25px rgba(0,0,0,.9)}
.ampm{font-size:.27em;vertical-align:18%;margin-left:11px;letter-spacing:1px;opacity:.78}
#date{margin-top:16px;font-size:clamp(11px,1.05vw,15px);letter-spacing:4px;text-transform:uppercase;opacity:.82}
#hint{position:absolute;left:clamp(42px,3.5vw,72px);bottom:13px;font-size:12px;letter-spacing:1px;opacity:0;transition:opacity .8s}
#hint.show{opacity:.72}
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="ui">
  <div class="card">
    <div id="clock">00:00<span class="ampm">AM</span></div>
    <div id="date">MON, JAN 1</div>
  </div>
  <div id="hint">Press <b>C</b> to toggle UI</div>
</div>

<script>
"use strict";

const canvas=document.getElementById("c");
const ctx=canvas.getContext("2d",{alpha:false,desynchronized:true});
const clockEl=document.getElementById("clock");
const dateEl=document.getElementById("date");
const ui=document.getElementById("ui");
const hint=document.getElementById("hint");

let W=0,H=0,DPR=1,cx=0,cy=0;
let theme={},stars=[],milky=[],particles=[];
let start=performance.now();
let last=performance.now();
let cursorTimer;

const reduced=matchMedia("(prefers-reduced-motion: reduce)").matches;
const motion=reduced?.12:1;

function rgb(name,fallback){
  const v=getComputedStyle(document.documentElement)
    .getPropertyValue(name).trim().split(/\s+/).map(Number);
  return v.length===3&&v.every(Number.isFinite)?v:fallback;
}
function rgba(c,a=1){return`rgba(${c[0]},${c[1]},${c[2]},${a})`}

function loadTheme(){
  theme={
    p:rgb("--primary_rgb",[138,206,255]),
    s:rgb("--secondary_rgb",[180,199,233]),
    t:rgb("--tertiary_rgb",[186,196,250]),
    bg:rgb("--surface_rgb",[5,9,14]),
    o:rgb("--outline_rgb",[137,146,154])
  };
  document.body.style.background=rgba(theme.bg);
  clockEl.style.color=rgba(theme.p,.96);
  dateEl.style.color=rgba(theme.s,.84);
  hint.style.color=rgba(theme.o,.9);
}

function resize(){
  W=innerWidth; H=innerHeight;
  DPR=Math.min(devicePixelRatio||1,2);
  canvas.width=Math.max(1,Math.floor(W*DPR));
  canvas.height=Math.max(1,Math.floor(H*DPR));
  ctx.setTransform(DPR,0,0,DPR,0,0);

  cx=W*.56;
  cy=H*.51;
  buildSpace();
}
addEventListener("resize",resize,{passive:true});

/* deterministic random generator */
let seed=48291;
function rnd(){
  seed^=seed<<13; seed^=seed>>>17; seed^=seed<<5;
  return (seed>>>0)/4294967296;
}

function buildSpace(){
  seed=48291;
  stars=[];
  milky=[];
  particles=[];

  const count=Math.min(1150,Math.max(600,Math.floor(W*H/2100)));

  for(let i=0;i<count;i++){
    stars.push({
      x:rnd()*W,
      y:rnd()*H,
      r:.18+rnd()*1.15,
      a:.10+rnd()*.62,
      phase:rnd()*Math.PI*2,
      twinkle:.15+rnd()*.8
    });
  }

  /* Milky Way star/dust band running diagonally behind the system. */
  for(let i=0;i<1150;i++){
    const u=rnd();
    const x=W*(.03+.94*u);
    const center=H*(.18+.60*u);
    const spread=H*(.025+rnd()*.09);
    const y=center+(rnd()-.5)*spread;
    milky.push({
      x,y,
      r:.15+rnd()*1.15,
      a:.015+rnd()*.20,
      warm:rnd()>.68
    });
  }

  for(let i=0;i<90;i++){
    particles.push({
      x:rnd()*W,y:rnd()*H,
      r:8+rnd()*60,
      a:.003+rnd()*.018,
      rot:-.7+rnd()*1.4
    });
  }
}

/* Orbit definitions. radius is normalized to the available canvas. */
const planets=[
  {name:"Mercury",radius:.095,size:3.2,speed:.58,e:.025,phase:.2,type:"mercury",tone:[160,150,137]},
  {name:"Venus",radius:.145,size:4.7,speed:.43,e:.018,phase:1.7,type:"venus",tone:[205,174,118]},
  {name:"Earth",radius:.205,size:5.6,speed:.34,e:.035,phase:3.4,type:"earth",tone:[55,130,190]},
  {name:"Mars",radius:.265,size:4.7,speed:.27,e:.045,phase:4.8,type:"mars",tone:[182,83,52]},
  {name:"Jupiter",radius:.39,size:13.5,speed:.145,e:.035,phase:5.8,type:"jupiter",tone:[196,156,116]},
  {name:"Saturn",radius:.55,size:12.5,speed:.094,e:.045,phase:2.8,type:"saturn",tone:[205,184,142]},
  {name:"Uranus",radius:.70,size:8.2,speed:.063,e:.025,phase:4.2,type:"uranus",tone:[106,190,196]},
  {name:"Neptune",radius:.82,size:8.7,speed:.047,e:.025,phase:1.2,type:"neptune",tone:[64,106,200]}
];

function orbitRadius(){return Math.min(W,H)*.72}

function orbitalPoint(b,t){
  const R=orbitRadius()*b.radius;
  const a=t*b.speed+b.phase;
  const rr=R*(1-b.e*b.e)/(1+b.e*Math.cos(a));

  /* Camera is above the orbital plane: vertical compression + slight tilt. */
  const rawX=Math.cos(a)*rr;
  const rawY=Math.sin(a)*rr;
  const tilt=-.12;

  const x=rawX*Math.cos(tilt)-rawY*Math.sin(tilt);
  const y=(rawX*Math.sin(tilt)+rawY*Math.cos(tilt))*.44;

  return {x:cx+x,y:cy+y,z:y,a};
}

function drawMilkyWay(){
  ctx.save();
  ctx.globalCompositeOperation="screen";

  /* Broad hazy band */
  const g=ctx.createLinearGradient(0,H*.05,W,H*.78);
  g.addColorStop(0,"rgba(255,220,170,0)");
  g.addColorStop(.40,"rgba(215,190,145,.025)");
  g.addColorStop(.52,"rgba(255,225,180,.055)");
  g.addColorStop(.70,"rgba(180,205,240,.018)");
  g.addColorStop(1,"rgba(0,0,0,0)");
  ctx.fillStyle=g;
  ctx.fillRect(0,0,W,H);

  for(const p of milky){
    ctx.fillStyle=p.warm
      ? `rgba(244,213,170,${p.a})`
      : `rgba(175,200,235,${p.a*.72})`;
    ctx.beginPath();
    ctx.arc(p.x,p.y,p.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawSpaceDust(t){
  for(const p of particles){
    ctx.save();
    ctx.translate(p.x,p.y);
    ctx.rotate(p.rot);
    const g=ctx.createRadialGradient(0,0,0,0,0,p.r);
    g.addColorStop(0,rgba(theme.p,p.a));
    g.addColorStop(1,"rgba(0,0,0,0)");
    ctx.fillStyle=g;
    ctx.scale(1,.18);
    ctx.beginPath();
    ctx.arc(0,0,p.r,0,Math.PI*2);
    ctx.fill();
    ctx.restore();
  }
}

function drawStars(t){
  ctx.save();
  ctx.globalCompositeOperation="screen";
  for(const s of stars){
    const a=s.a*(1+Math.sin(t*s.twinkle+s.phase)*.12*motion);
    ctx.fillStyle=rgba(theme.s,a);
    ctx.beginPath();
    ctx.arc(s.x,s.y,s.r,0,Math.PI*2);
    ctx.fill();
  }
  ctx.restore();
}

function drawOrbit(b,index){
  const R=orbitRadius()*b.radius;
  const segments=220;
  const tilt=-.12;

  ctx.beginPath();

  for(let i=0;i<=segments;i++){
    const a=i/segments*Math.PI*2;
    const rr=R*(1-b.e*b.e)/(1+b.e*Math.cos(a));
    const rawX=Math.cos(a)*rr;
    const rawY=Math.sin(a)*rr;
    const x=rawX*Math.cos(tilt)-rawY*Math.sin(tilt);
    const y=(rawX*Math.sin(tilt)+rawY*Math.cos(tilt))*.44;

    if(i===0)ctx.moveTo(cx+x,cy+y);
    else ctx.lineTo(cx+x,cy+y);
  }

  ctx.strokeStyle=rgba(theme.o,.035+index*.008);
  ctx.lineWidth=index>4?1:.75;
  ctx.stroke();
}

function drawSun(t){
  const pulse=1+Math.sin(t*.7)*.025*motion;
  const outer=Math.min(W,H)*.12*pulse;

  const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,outer);
  glow.addColorStop(0,"rgba(255,245,205,.44)");
  glow.addColorStop(.09,"rgba(255,213,128,.18)");
  glow.addColorStop(.25,"rgba(255,174,70,.065)");
  glow.addColorStop(1,"rgba(0,0,0,0)");

  ctx.fillStyle=glow;
  ctx.beginPath();
  ctx.arc(cx,cy,outer,0,Math.PI*2);
  ctx.fill();

  const R=7.5*pulse;
  const core=ctx.createRadialGradient(cx-2,cy-2,0,cx,cy,R*2.2);
  core.addColorStop(0,"#fffef5");
  core.addColorStop(.22,"#fff1b5");
  core.addColorStop(.55,"#ffc96e");
  core.addColorStop(1,"rgba(255,160,50,0)");

  ctx.fillStyle=core;
  ctx.beginPath();
  ctx.arc(cx,cy,R*2.2,0,Math.PI*2);
  ctx.fill();
}

function planetGradient(b,p,r){
  const dx=cx-p.x,dy=cy-p.y,len=Math.hypot(dx,dy)||1;
  const lx=p.x+dx/len*r*.58;
  const ly=p.y+dy/len*r*.58;

  const g=ctx.createRadialGradient(lx,ly,.05*r,p.x,p.y,r*1.12);

  if(b.type==="earth"){
    g.addColorStop(0,"#b6edff");
    g.addColorStop(.27,"#429bd0");
    g.addColorStop(.55,"#1d5b86");
    g.addColorStop(.82,"#0a263d");
    g.addColorStop(1,"#02070d");
  }else if(b.type==="jupiter"||b.type==="saturn"){
    g.addColorStop(0,"#fff0c8");
    g.addColorStop(.35,rgba(b.tone,.98));
    g.addColorStop(.70,"#7b5a43");
    g.addColorStop(1,"#11151b");
  }else if(b.type==="uranus"){
    g.addColorStop(0,"#c7ffff");
    g.addColorStop(.45,"#6ec7ca");
    g.addColorStop(.80,"#1c5b65");
    g.addColorStop(1,"#071219");
  }else if(b.type==="neptune"){
    g.addColorStop(0,"#a6c7ff");
    g.addColorStop(.42,"#3c73c9");
    g.addColorStop(.78,"#142c63");
    g.addColorStop(1,"#040913");
  }else{
    g.addColorStop(0,"#fff0cf");
    g.addColorStop(.35,rgba(b.tone,.98));
    g.addColorStop(.72,rgba(b.tone,.55));
    g.addColorStop(1,"#06090d");
  }
  return g;
}

function drawPlanet(b,p,t){
  const r=b.size;
  ctx.save();
  ctx.beginPath();
  ctx.arc(p.x,p.y,r,0,Math.PI*2);
  ctx.clip();

  ctx.fillStyle=planetGradient(b,p,r);
  ctx.fillRect(p.x-r,p.y-r,r*2,r*2);

  /* Atmospheric / surface detail */
  if(b.type==="jupiter"||b.type==="saturn"){
    ctx.globalAlpha=.36;
    const bands=[
      [-.72,.13,"#b98d65"],[-.48,.09,"#efe0ba"],
      [-.28,.12,"#7e5c48"],[-.05,.10,"#d7b184"],
      [.16,.12,"#8a634c"],[.38,.10,"#e7c394"],[.58,.13,"#765445"]
    ];
    for(const band of bands){
      ctx.fillStyle=band[2];
      ctx.fillRect(p.x-r,p.y+r*band[0],r*2,r*band[1]);
    }
    ctx.globalAlpha=1;

    if(b.type==="jupiter"){
      ctx.fillStyle="rgba(118,65,43,.55)";
      ctx.beginPath();
      ctx.ellipse(p.x+r*.17,p.y+r*.22,r*.27,r*.095,-.12,0,Math.PI*2);
      ctx.fill();
    }
  }

  if(b.type==="earth"){
    ctx.fillStyle="rgba(78,168,104,.75)";
    for(let i=0;i<5;i++){
      const a=i*2.1+b.phase;
      ctx.beginPath();
      ctx.ellipse(
        p.x+Math.cos(a)*r*.34,
        p.y+Math.sin(a)*r*.38,
        r*.18,r*.065,a,0,Math.PI*2
      );
      ctx.fill();
    }
    ctx.fillStyle="rgba(225,249,255,.55)";
    ctx.beginPath();
    ctx.ellipse(p.x-r*.18,p.y-r*.58,r*.30,r*.06,-.2,0,Math.PI*2);
    ctx.fill();
  }

  if(b.type==="mars"){
    ctx.fillStyle="rgba(75,32,24,.42)";
    for(let i=0;i<3;i++){
      const a=i*2.5+b.phase;
      ctx.beginPath();
      ctx.arc(p.x+Math.cos(a)*r*.3,p.y+Math.sin(a)*r*.25,r*.08,0,Math.PI*2);
      ctx.fill();
    }
  }

  if(b.type==="neptune"||b.type==="uranus"){
    ctx.globalAlpha=.18;
    ctx.strokeStyle="#d6ffff";
    ctx.lineWidth=.45;
    for(let y=-r*.45;y<r*.6;y+=r*.32){
      ctx.beginPath();
      ctx.moveTo(p.x-r,p.y+y);
      ctx.lineTo(p.x+r,p.y+y+r*.04);
      ctx.stroke();
    }
    ctx.globalAlpha=1;
  }

  ctx.restore();

  /* thin atmospheric rim */
  ctx.beginPath();
  ctx.arc(p.x,p.y,r+.55,0,Math.PI*2);
  ctx.strokeStyle=rgba(theme.p,b.type==="earth"?.22:.07);
  ctx.lineWidth=.7;
  ctx.stroke();
}

function drawSaturnRings(p,b,front){
  const r=b.size;
  ctx.save();
  ctx.translate(p.x,p.y);
  ctx.rotate(-.12);

  ctx.beginPath();
  ctx.ellipse(0,0,r*1.72,r*.43,0,0,Math.PI*2);
  ctx.strokeStyle=front?"rgba(235,215,170,.62)":"rgba(190,170,135,.38)";
  ctx.lineWidth=front?2.1:1.6;
  ctx.stroke();

  ctx.beginPath();
  ctx.ellipse(0,0,r*2.05,r*.52,0,0,Math.PI*2);
  ctx.strokeStyle=front?"rgba(255,235,190,.18)":"rgba(220,200,160,.12)";
  ctx.lineWidth=.9;
  ctx.stroke();

  ctx.restore();
}

function drawPlanets(t){
  const list=planets.map(b=>({b,p:orbitalPoint(b,t)})).sort((a,b)=>a.p.z-b.p.z);

  for(const q of list){
    if(q.b.type==="saturn")drawSaturnRings(q.p,q.b,false);
    drawPlanet(q.b,q.p,t);
    if(q.b.type==="saturn")drawSaturnRings(q.p,q.b,true);
  }
}

function render(now){
  const t=(now-start)/1000;
  last=now;

  ctx.setTransform(DPR,0,0,DPR,0,0);
  ctx.fillStyle=rgba(theme.bg);
  ctx.fillRect(0,0,W,H);

  drawMilkyWay();
  drawSpaceDust(t);
  drawStars(t);

  for(let i=0;i<planets.length;i++)drawOrbit(planets[i],i);

  drawSun(t);
  drawPlanets(t);

  requestAnimationFrame(render);
}

/* Clock fallback. Existing clock-shared.js is not required. */
function fallbackClock(){
  function update(){
    const n=new Date();
    let h=n.getHours();
    const ap=h>=12?"PM":"AM";
    h=h%12||12;
    clockEl.innerHTML=
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}`+
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent=n.toLocaleDateString("en-US",{
      weekday:"short",month:"short",day:"numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update,1000);
}

let uiVisible=true;
addEventListener("keydown",e=>{
  if(e.key.toLowerCase()==="c"){
    uiVisible=!uiVisible;
    ui.classList.toggle("hidden",!uiVisible);
  }
});

addEventListener("pointermove",()=>{
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer=setTimeout(()=>document.body.classList.remove("show-cursor"),2500);
},{passive:true});

addEventListener("load",()=>{
  loadTheme();
  resize();

  /* Optional shared clock support. */
  const script=document.createElement("script");
  script.src="clock-shared.js";
  script.onload=()=>{
    try{
      if(typeof startClock==="function")startClock(clockEl,dateEl);
      else fallbackClock();
    }catch(e){fallbackClock()}
  };
  script.onerror=fallbackClock;
  document.head.appendChild(script);

  hint.classList.add("show");
  setTimeout(()=>hint.classList.remove("show"),4000);

  requestAnimationFrame(render);
});
</script>
</body>
</html>
