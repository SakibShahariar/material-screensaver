<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Material Screensaver — Spirograph</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --primary_container_rgb: 0 75 111;
  --secondary_rgb: 180 199 233;
  --secondary_container_rgb: 53 72 99;
  --tertiary_rgb: 186 196 250;
  --tertiary_container_rgb: 58 68 114;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock {
  position: fixed;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(38px, 4.2vw, 56px);
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  letter-spacing: -1.2px;
  font-size: clamp(34px, 4.6vw, 64px);
  color: rgb(var(--primary_rgb));
  text-shadow: 0 0 28px rgb(var(--primary_rgb) / .4), 0 2px 10px rgb(0 0 0 / .45);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock .ampm {
  font-size: .28em;
  margin-left: 8px;
  opacity: .78;
  vertical-align: 18%;
  letter-spacing: 1px;
}
#date {
  position: fixed;
  left: clamp(30px, 3.1vw, 50px);
  bottom: clamp(16px, 2.1vw, 26px);
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 6px rgb(0 0 0 / .4);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock.hidden, #date.hidden { opacity: 0; }

#hint {
  position: fixed;
  right: 28px;
  bottom: 24px;
  font-size: 12px;
  letter-spacing: 0.8px;
  color: rgb(var(--outline_rgb) / .7);
  pointer-events: none;
  opacity: 0;
  transition: opacity .9s ease;
}
#hint.show { opacity: 1; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00<span class="ampm">AM</span></div>
<div id="date">MON, JAN 1</div>
<div id="hint">C clock · R reset · T trails · Space pause</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, scale = 1;
let theme = {};
let curves = [];
let mouse = { x: 0, y: 0, active: false };
let focus = { x: 0, y: 0 };
let simSpeed = 0.55;
let paused = false;
let showTrails = true;
let start = 0;               // will be set to performance.now() at the real start
let lastFrame = 0;
let cursorTimer;
let started = false;         // prevents any drawing before t = 0

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const motionScale = reduceMotion ? 0.25 : 1;

const MAX_POINTS = 900;      // how long the trail grows

function readRGB(name, fallback = [160, 160, 160]) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:   readRGB("--surface_rgb", [12, 20, 27]),
    primary:   readRGB("--primary_rgb", [138, 206, 255]),
    secondary: readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:  readRGB("--tertiary_rgb", [186, 196, 250]),
    outline:   readRGB("--outline_rgb", [137, 146, 154]),
    pCont:     readRGB("--primary_container_rgb", [0, 75, 111]),
    sCont:     readRGB("--secondary_container_rgb", [53, 72, 99]),
    tCont:     readRGB("--tertiary_container_rgb", [58, 68, 114])
  };
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color  = rgba(theme.secondary, 0.85);
  hintEl.style.color  = rgba(theme.outline, 0.7);
  buildCurves();
}

function buildCurves() {
  // Classic Spirograph parameters (R, r, d)
  // Main stroke = primary, supporting colors for glow/particles
  curves = [
    { R: 185, r: 76,  d: 112, speed:  1.00, type: "hypo", phase: 0.0,  points: [] },
    { R: 142, r: 51,  d:  88, speed: -0.68, type: "hypo", phase: 2.1,  points: [] },
    { R: 228, r: 95,  d: 138, speed:  0.45, type: "hypo", phase: 4.0,  points: [] },
    { R: 105, r: 39,  d:  64, speed:  1.28, type: "epi",  phase: 1.3,  points: [] },
  ];
}

function trochoid(R, r, d, theta, type) {
  if (type === "epi") {
    const k = (R + r) / r;
    return [
      (R + r) * Math.cos(theta) - d * Math.cos(k * theta),
      (R + r) * Math.sin(theta) - d * Math.sin(k * theta)
    ];
  }
  // hypotrochoid (classic Spirograph)
  const k = (R - r) / r;
  return [
    (R - r) * Math.cos(theta) + d * Math.cos(k * theta),
    (R - r) * Math.sin(theta) - d * Math.sin(k * theta)
  ];
}

function hardClear() {
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface || [12, 20, 27], 1);
  ctx.fillRect(0, 0, W, H);
}

function resize() {
  W = innerWidth; H = innerHeight;
  cx = W * 0.5; cy = H * 0.52;
  scale = Math.min(W, H) * 0.00132;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.max(1, Math.floor(W * DPR));
  canvas.height = Math.max(1, Math.floor(H * DPR));
  hardClear();
}
addEventListener("resize", resize, { passive: true });

function resetAnimation() {
  start = performance.now();
  lastFrame = start;
  started = true;
  focus.x = focus.y = 0;
  for (const c of curves) c.points = [];
  hardClear();
}

function frame(now) {
  if (!started) {
    requestAnimationFrame(frame);
    return;
  }

  const dt = Math.min(0.05, (now - lastFrame) / 1000);
  lastFrame = now;

  // Gentle mouse influence (screensaver-safe)
  const targetX = mouse.active ? (mouse.x - cx) * 0.06 : 0;
  const targetY = mouse.active ? (mouse.y - cy) * 0.06 : 0;
  focus.x += (targetX - focus.x) * 0.03;
  focus.y += (targetY - focus.y) * 0.03;

  // True time from zero
  const t = paused
    ? (now - start) / 1000
    : ((now - start) / 1000) * simSpeed * motionScale;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  if (showTrails) {
    ctx.fillStyle = rgba(theme.surface, 0.045);
    ctx.fillRect(0, 0, W, H);
  } else {
    hardClear();
  }

  ctx.globalCompositeOperation = "lighter";

  for (const curve of curves) {
    // Organic drift of the classic Spirograph parameters
    const rMod = Math.sin(t * 0.05 * curve.speed + curve.phase) * 0.11;
    const dMod = Math.cos(t * 0.035 * curve.speed + curve.phase * 1.2) * 0.08;
    const r = curve.r * (1 + rMod);
    const d = curve.d * (1 + dMod);

    // Advance the pen
    if (!paused) {
      const theta = t * 0.48 * curve.speed + curve.phase;
      const [px, py] = trochoid(curve.R, r, d, theta, curve.type);
      const x = cx + focus.x + px * scale;
      const y = cy + focus.y + py * scale;
      curve.points.push({ x, y });
      if (curve.points.length > MAX_POINTS) curve.points.shift();
    }

    const pts = curve.points;
    if (pts.length < 2) continue;

    // --- Main stroke = PRIMARY ---
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.strokeStyle = rgba(theme.primary, 0.55);
    ctx.lineWidth = 1.25;
    ctx.lineCap = "round";
    ctx.lineJoin = "round";
    ctx.stroke();

    // --- Soft glow = primary container ---
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      ctx.lineTo(pts[i].x, pts[i].y);
    }
    ctx.strokeStyle = rgba(theme.pCont, 0.25);
    ctx.lineWidth = 4.2;
    ctx.stroke();

    // --- Outer halo = secondary / tertiary ---
    ctx.beginPath();
    ctx.moveTo(pts[0].x, pts[0].y);
    for (let i = 1; i < pts.length; i++) {
      ctx.lineTo(pts[i].x, pts[i].y);
    }
    const halo = (curve.phase < 2) ? theme.secondary : theme.tertiary;
    ctx.strokeStyle = rgba(halo, 0.09);
    ctx.lineWidth = 7;
    ctx.stroke();
  }

  ctx.globalCompositeOperation = "source-over";
  requestAnimationFrame(frame);
}

/* Interaction */
addEventListener("pointermove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => {
    document.body.classList.remove("show-cursor");
    mouse.active = false;
  }, 2800);
}, { passive: true });

addEventListener("keydown", e => {
  const k = e.key.toLowerCase();
  if (k === "c") {
    clockEl.classList.toggle("hidden");
    dateEl.classList.toggle("hidden");
  } else if (k === " " || k === "p") {
    e.preventDefault();
    paused = !paused;
  } else if (k === "r") {
    resetAnimation();          // true restart from zero
  } else if (k === "t") {
    showTrails = !showTrails;
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2, "0")}:${String(n.getMinutes()).padStart(2, "0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4500);

  // Real start from zero — after everything is ready
  resetAnimation();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
