<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Starfield</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --tertiary_rgb: 186 196 250;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb));
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: flex-end;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.8s ease;
  }
  #ui-container.hidden { opacity: 0; }

  .vignette-card {
    background: radial-gradient(circle at center, rgba(12, 20, 27, 0.65) 0%, rgba(12, 20, 27, 0) 80%);
    backdrop-filter: blur(10px);
    -webkit-backdrop-filter: blur(10px);
    padding: 24px 32px;
    width: fit-content;
    border-radius: 20px;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    text-shadow: 0 2px 16px rgba(0, 0, 0, 0.7);
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.7);
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-card">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint">Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}
window.addEventListener('pointermove', triggerCursor);

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H, fov;

function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  fov = Math.min(W, H) * 0.75;
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.35 : 1.0;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}

let theme = {};
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    surfaceBright: readRGB('--surface_bright_rgb', [50, 58, 65]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };

  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
}

const STAR_COUNT = 700;
const MAX_DEPTH = 1000;
let stars = [];

function resetStar(s) {
  s.x = (Math.random() - 0.5) * W * 2.5;
  s.y = (Math.random() - 0.5) * H * 2.5;
  s.z = MAX_DEPTH;
  s.pz = MAX_DEPTH;
  s.size = Math.random() * 1.5 + 0.5;
  const colors = [theme.primary, theme.secondary, theme.tertiary, [255, 255, 255]];
  s.color = colors[Math.floor(Math.random() * colors.length)];
}

function initStars() {
  stars = [];
  for (let i = 0; i < STAR_COUNT; i++) {
    const s = {};
    resetStar(s);
    s.z = Math.random() * MAX_DEPTH;
    s.pz = s.z;
    stars.push(s);
  }
}

function drawNebula(t) {
  const cx = W * 0.5 + Math.sin(t * 0.15) * (W * 0.15);
  const cy = H * 0.5 + Math.cos(t * 0.12) * (H * 0.15);

  const nGrad1 = ctx.createRadialGradient(cx, cy, 10, cx, cy, Math.max(W, H) * 0.65);
  nGrad1.addColorStop(0, rgba(theme.primaryContainer, 0.22));
  nGrad1.addColorStop(0.5, rgba(theme.tertiary, 0.08));
  nGrad1.addColorStop(1, rgba(theme.surface, 0));

  ctx.fillStyle = nGrad1;
  ctx.fillRect(0, 0, W, H);

  const cx2 = W * 0.3 + Math.cos(t * 0.1) * (W * 0.2);
  const cy2 = H * 0.6 + Math.sin(t * 0.18) * (H * 0.2);

  const nGrad2 = ctx.createRadialGradient(cx2, cy2, 20, cx2, cy2, Math.max(W, H) * 0.5);
  nGrad2.addColorStop(0, rgba(theme.secondary, 0.12));
  nGrad2.addColorStop(1, rgba(theme.surface, 0));

  ctx.fillStyle = nGrad2;
  ctx.fillRect(0, 0, W, H);
}

let lastTime = performance.now();

function frame(now) {
  const dt = Math.min((now - lastTime) / 1000, 0.1);
  lastTime = now;
  const t = now / 1000;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  ctx.fillStyle = rgba(theme.surface, 0.4);
  ctx.fillRect(0, 0, W, H);

  drawNebula(t);

  const speed = 280 * speedMul;
  const halfW = W / 2;
  const halfH = H / 2;

  for (let i = 0; i < stars.length; i++) {
    const s = stars[i];
    s.pz = s.z;
    s.z -= speed * dt;

    if (s.z <= 1) {
      resetStar(s);
      continue;
    }

    const k = fov / s.z;
    const px = s.x * k + halfW;
    const py = s.y * k + halfH;

    if (px < 0 || px >= W || py < 0 || py >= H) {
      resetStar(s);
      continue;
    }

    const pk = fov / s.pz;
    const prevX = s.x * pk + halfW;
    const prevY = s.y * pk + halfH;

    const alpha = Math.min(1, (1 - s.z / MAX_DEPTH) * 1.5);
    const size = Math.max(0.8, (1 - s.z / MAX_DEPTH) * s.size * 2.2);

    ctx.beginPath();
    ctx.moveTo(prevX, prevY);
    ctx.lineTo(px, py);
    ctx.strokeStyle = rgba(s.color || theme.primary, alpha * 0.85);
    ctx.lineWidth = size;
    ctx.lineCap = 'round';
    ctx.stroke();
  }

  requestAnimationFrame(frame);
}

function fallbackClock() {
  const update = () => {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;

    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', options);
  };
  update();
  setInterval(update, 1000);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  loadTheme();
  initStars();

  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      fallbackClock();
    }
  } catch (err) {
    fallbackClock();
  }

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
