<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Strange Attractor Flow</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --primary_container_rgb: 0 75 111;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
  user-select: none;
  cursor: none;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#ui {
  position: fixed; inset: 0;
  pointer-events: none; z-index: 10;
  transition: opacity .7s ease;
}
#ui.hidden { opacity: 0; }

#clock-wrap {
  position: absolute;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(28px, 3.5vw, 48px);
}
#clock {
  font-size: clamp(34px, 4.8vw, 68px);
  font-weight: 300;
  font-variant-numeric: tabular-nums;
  letter-spacing: -1.5px;
  line-height: 1;
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 30px rgb(var(--primary_rgb) / .35),
    0 2px 12px rgb(0 0 0 / .5);
}
#clock .ampm {
  font-size: .28em;
  margin-left: 8px;
  opacity: .78;
  vertical-align: 18%;
  letter-spacing: 1px;
}
#date {
  margin-top: 10px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 3px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 8px rgb(0 0 0 / .45);
}

#hint {
  position: fixed;
  right: 32px;
  bottom: 28px;
  font-size: 12px;
  letter-spacing: 0.8px;
  color: rgb(var(--outline_rgb) / .7);
  opacity: 0;
  transition: opacity .8s ease;
  text-shadow: 0 1px 6px rgb(0 0 0 / .5);
}
#hint.show { opacity: .8; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>

<div id="ui">
  <div id="clock-wrap">
    <div id="clock">00:00<span class="ampm">AM</span></div>
    <div id="date">MON, JAN 1</div>
  </div>
  <div id="hint">Press <b>C</b> to toggle UI</div>
</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const ui      = document.getElementById("ui");

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0;
let theme = {};
let particles = [];
let mouse = { x: 0, y: 0, active: false };
let focus = { x: 0, y: 0 };
let cursorTimer;
let start = performance.now();
let lastT = 0;

const PARTICLE_COUNT = 820;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.22 : 0.55;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:          readRGB("--surface_rgb", [12, 20, 27]),
    primary:          readRGB("--primary_rgb", [138, 206, 255]),
    primaryContainer: readRGB("--primary_container_rgb", [0, 75, 111]),
    secondary:        readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:         readRGB("--tertiary_rgb", [186, 196, 250]),
    outline:          readRGB("--outline_rgb", [137, 146, 154])
  };
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.96);
  dateEl.style.color  = rgba(theme.secondary, 0.86);
  hintEl.style.color  = rgba(theme.outline, 0.75);
}

function resize() {
  W = innerWidth; H = innerHeight;
  cx = W * 0.5; cy = H * 0.5;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.max(1, Math.floor(W * DPR));
  canvas.height = Math.max(1, Math.floor(H * DPR));
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });

function resetParticle(p) {
  p.x = (Math.random() - 0.5) * 2.8;
  p.y = (Math.random() - 0.5) * 2.8;
  p.z = (Math.random() - 0.5) * 2.8;

  // Primary-dominant palette
  const roll = Math.random();
  if (roll < 0.58)      p.color = theme.primary;
  else if (roll < 0.78) p.color = theme.secondary;
  else if (roll < 0.92) p.color = theme.tertiary;
  else                   p.color = theme.primaryContainer;

  p.size = 0.9 + Math.random() * 1.1;
}

function initParticles() {
  particles = [];
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = {};
    resetParticle(p);
    particles.push(p);
  }
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.035, t - lastT || 0.016);
  lastT = t;

  // Soft mouse influence
  const targetX = mouse.active ? (mouse.x - cx) * 0.05 : 0;
  const targetY = mouse.active ? (mouse.y - cy) * 0.05 : 0;
  focus.x += (targetX - focus.x) * 0.03;
  focus.y += (targetY - focus.y) * 0.03;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Smooth trail fade
  ctx.fillStyle = rgba(theme.surface, 0.12);
  ctx.fillRect(0, 0, W, H);

  const scale = Math.min(W, H) * 0.145;
  const b = 0.208886; // Thomas attractor parameter

  // Slow ambient rotation
  const rot = t * 0.13;
  const cosR = Math.cos(rot);
  const sinR = Math.sin(rot);

  for (const p of particles) {
    // Thomas' cyclically symmetric attractor
    const dx = Math.sin(p.y) - b * p.x;
    const dy = Math.sin(p.z) - b * p.y;
    const dz = Math.sin(p.x) - b * p.z;

    p.x += dx * dt * 3.2;
    p.y += dy * dt * 3.2;
    p.z += dz * dt * 3.2;

    // Rotate around Y
    const rotX = p.x * cosR - p.z * sinR;
    const rotZ = p.x * sinR + p.z * cosR;

    const screenX = cx + focus.x + rotX * scale;
    const screenY = cy + focus.y + p.y * scale;

    // Reset if it drifts too far or becomes invalid
    if (
      isNaN(screenX) || isNaN(screenY) ||
      Math.abs(rotX) > 9 || Math.abs(p.y) > 9 || Math.abs(rotZ) > 9
    ) {
      resetParticle(p);
      continue;
    }

    // Depth-ish size and alpha from z
    const depth = 1 - Math.min(1, (Math.abs(rotZ) + 1) / 8);
    const alpha = 0.35 + depth * 0.55;
    const r = p.size * (0.7 + depth * 0.7);

    // Soft glow
    ctx.beginPath();
    ctx.arc(screenX, screenY, r * 2.2, 0, Math.PI * 2);
    ctx.fillStyle = rgba(p.color, alpha * 0.18);
    ctx.fill();

    // Core
    ctx.beginPath();
    ctx.arc(screenX, screenY, r, 0, Math.PI * 2);
    ctx.fillStyle = rgba(p.color, alpha * 0.85);
    ctx.fill();
  }

  requestAnimationFrame(frame);
}

/* Interaction */
addEventListener("pointermove", e => {
  mouse.x = e.clientX;
  mouse.y = e.clientY;
  mouse.active = true;
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => {
    document.body.classList.remove("show-cursor");
    mouse.active = false;
  }, 2600);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    ui.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2, "0")}:${String(n.getMinutes()).padStart(2, "0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();
  initParticles();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4200);

  start = performance.now();
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
