<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Terrain</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --primary_container_rgb: 0 75 111;
  --secondary_rgb: 180 199 233;
  --secondary_container_rgb: 53 72 99;
  --tertiary_rgb: 186 196 250;
  --tertiary_container_rgb: 58 68 114;
  --surface_rgb: 12 20 27;
  --surface_bright_rgb: 50 58 65;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock {
  position: fixed;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(40px, 4.5vw, 56px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 40px rgb(var(--primary_rgb) / .4),
    0 2px 16px rgba(0,0,0,.65);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .7;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  position: fixed;
  left: clamp(30px, 3.1vw, 50px);
  bottom: clamp(18px, 2.2vw, 28px);
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 10px rgba(0,0,0,.55);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock.hidden, #date.hidden { opacity: 0; }

#hint {
  position: fixed; right: 28px; bottom: 24px;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00<span class="ampm">AM</span></div>
<div id="date">MON, JAN 1</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");

let W = 0, H = 0, DPR = 1;
let theme = {};
let layers = [];
let stars = [];
let start = performance.now();
let cursorTimer;

const LAYER_COUNT = 7;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.25 : 0.8;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
function darken(color, t) {
  const s = theme.surface || [12, 20, 27];
  return [
    Math.round(color[0] + (s[0] - color[0]) * t),
    Math.round(color[1] + (s[1] - color[1]) * t),
    Math.round(color[2] + (s[2] - color[2]) * t)
  ];
}

function loadTheme() {
  theme = {
    surface:            readRGB("--surface_rgb", [12, 20, 27]),
    surfaceBright:      readRGB("--surface_bright_rgb", [50, 58, 65]),
    primary:            readRGB("--primary_rgb", [138, 206, 255]),
    primaryContainer:   readRGB("--primary_container_rgb", [0, 75, 111]),
    secondary:          readRGB("--secondary_rgb", [180, 199, 233]),
    secondaryContainer: readRGB("--secondary_container_rgb", [53, 72, 99]),
    tertiary:           readRGB("--tertiary_rgb", [186, 196, 250]),
    tertiaryContainer:  readRGB("--tertiary_container_rgb", [58, 68, 114]),
    outline:            readRGB("--outline_rgb", [137, 146, 154])
  };

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.97);
  dateEl.style.color  = rgba(theme.secondary, 0.88);
  hintEl.style.color  = rgba(theme.outline, 0.6);

  // Far → near: soft Material tones, near layers darkened for clock contrast
  const base = [
    theme.primaryContainer,
    theme.secondaryContainer,
    theme.tertiaryContainer,
    theme.secondary,
    theme.tertiary,
    theme.primary,
    theme.primary
  ];
  layers.forEach((l, i) => {
    const depth = i / (LAYER_COUNT - 1);
    l.color = darken(base[i % base.length], depth * depth * 0.85);
  });
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeStars();
}
addEventListener("resize", resize, { passive: true });

function makeLayers() {
  layers = [];
  for (let i = 0; i < LAYER_COUNT; i++) {
    const depth = i / (LAYER_COUNT - 1);
    layers.push({
      color: [40, 48, 56],
      baseHeight: 0.24 + depth * 0.3,
      amp: (0.045 + Math.random() * 0.04) * (0.45 + depth * 0.8),
      freq: 0.55 + Math.random() * 0.5,
      freq2: 1.4 + Math.random() * 1.0,
      freq3: 2.8 + Math.random() * 1.4,
      seed: Math.random() * 2500,
      scrollSpeed: (14 + depth * 170) * 0.4,
      depth
    });
  }
}

function ridgeY(layer, x) {
  const n =
    Math.sin((x + layer.seed) * 0.0017 * layer.freq) +
    Math.sin((x + layer.seed * 1.41) * 0.0031 * layer.freq2) * 0.5 +
    Math.sin((x + layer.seed * 0.67) * 0.0058 * layer.freq3) * 0.25;
  return H * (1 - layer.baseHeight - n * layer.amp);
}

function drawLayer(layer, t) {
  const offset = t * layer.scrollSpeed;
  const steps = Math.max(60, Math.floor(W / 14));

  ctx.beginPath();
  ctx.moveTo(0, H);
  for (let i = 0; i <= steps; i++) {
    const x = (i / steps) * W;
    ctx.lineTo(x, ridgeY(layer, x + offset));
  }
  ctx.lineTo(W, H);
  ctx.closePath();

  const alpha = 0.75 + layer.depth * 0.25;
  ctx.fillStyle = rgba(layer.color, alpha);
  ctx.fill();
}

function makeStars() {
  stars = [];
  const count = Math.min(160, Math.floor((W * H) / 14000));
  for (let i = 0; i < count; i++) {
    const roll = Math.random();
    let color;
    if (roll < 0.55)      color = theme.primary || [138, 206, 255];
    else if (roll < 0.78) color = theme.secondary || [180, 199, 233];
    else if (roll < 0.92) color = theme.tertiary || [186, 196, 250];
    else                  color = [240, 245, 255];

    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.52,
      r: 0.35 + Math.random() * 1.15,
      phase: Math.random() * Math.PI * 2,
      twinkle: 0.35 + Math.random() * 0.65,
      color
    });
  }
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  // Sky
  const bg = ctx.createLinearGradient(0, 0, 0, H);
  bg.addColorStop(0, rgba(theme.surface, 1));
  bg.addColorStop(0.5, rgba(theme.surface, 1));
  bg.addColorStop(1, rgba(theme.surfaceBright || theme.surface, 0.75));
  ctx.fillStyle = bg;
  ctx.fillRect(0, 0, W, H);

  // Stars
  for (const s of stars) {
    const tw = 0.3 + 0.7 * Math.abs(Math.sin(t * s.twinkle + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = rgba(s.color, tw * 0.7);
    ctx.fill();
  }

  // Soft horizon glow
  const glow = ctx.createLinearGradient(0, H * 0.28, 0, H * 0.62);
  glow.addColorStop(0, "transparent");
  glow.addColorStop(0.45, rgba(theme.primaryContainer, 0.09));
  glow.addColorStop(1, "transparent");
  ctx.fillStyle = glow;
  ctx.fillRect(0, 0, W, H);

  // Ridges back → front
  for (const layer of layers) drawLayer(layer, t);

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockEl.classList.toggle("hidden");
    dateEl.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  makeLayers();
  loadTheme();
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
