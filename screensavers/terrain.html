<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Terrain</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none;
  }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock {
    position: fixed; left: 32px; bottom: 28px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px;
    font-size: clamp(28px, 4vw, 56px);
    text-shadow: 0 0 24px rgba(0,0,0,0.4);
    pointer-events: none; transition: opacity 0.6s ease;
  }
  #clock .ampm {
    font-size: 0.36em;
    margin-left: 6px;
    opacity: 0.82;
    vertical-align: middle;
  }
  #date {
    position: fixed; left: 34px; bottom: 14px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: clamp(12px, 1.2vw, 16px); letter-spacing: 1.5px; text-transform: uppercase;
    pointer-events: none; transition: opacity 0.6s ease;
  }
  #hint {
    position: fixed; right: 28px; bottom: 26px;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    font-size: 13px; letter-spacing: 0.5px;
    pointer-events: none; opacity: 0; transition: opacity 0.8s ease;
  }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
}
window.addEventListener('resize', resize);
resize();

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }
function lerp(a, b, t) { return a + (b - a) * t; }

let theme = {};
let layers = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'),
    surfaceBright: readRGB('--surface_bright_rgb'),
    primary: readRGB('--primary_rgb'),
    secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'),
    primaryContainer: readRGB('--primary_container_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'),
    tertiaryContainer: readRGB('--tertiary_container_rgb'),
    onSurfaceVariant: readRGB('--on_surface_variant_rgb'),
    outline: readRGB('--outline_rgb'),
  };
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);

  // atmospheric perspective: distant ridges lighter/hazier, near ridges darker —
  // this also keeps the bottom of the screen dark so the clock stays readable
  const palette = [theme.primary, theme.secondary, theme.tertiary, theme.secondaryContainer, theme.primaryContainer];
  layers.forEach((l, i) => { l.color = palette[i % palette.length]; });
}

const LAYER_COUNT = 5;
function makeLayers() {
  layers = [];
  for (let i = 0; i < LAYER_COUNT; i++) {
    const depth = i / (LAYER_COUNT - 1); // 0 = far, 1 = near
    layers.push({
      color: [120, 120, 120],
      baseHeight: 0.32 + depth * 0.22,
      amp: (0.06 + Math.random() * 0.05) * (0.6 + depth * 0.6),
      freq: 0.7 + Math.random() * 0.6,
      freq2: 1.8 + Math.random() * 1.2,
      seed: Math.random() * 1000,
      scrollSpeed: (30 + depth * 220) * 0.5,
      depth,
    });
  }
}

function ridgeY(layer, x) {
  const n = Math.sin((x + layer.seed) * 0.002 * layer.freq)
    + Math.sin((x + layer.seed * 1.3) * 0.0035 * layer.freq2) * 0.5;
  return H * (1 - layer.baseHeight - n * layer.amp);
}

function drawLayer(layer, t) {
  const offset = t * layer.scrollSpeed;
  ctx.beginPath();
  ctx.moveTo(0, H);
  const steps = 40;
  for (let i = 0; i <= steps; i++) {
    const x = (i / steps) * W;
    const y = ridgeY(layer, x + offset);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();
  ctx.fillStyle = rgba(layer.color, 1);
  ctx.fill();
}

let stars = [];
function makeStars() {
  stars = [];
  const count = Math.floor((W * H) / 14000);
  for (let i = 0; i < count; i++) {
    stars.push({ x: Math.random() * W, y: Math.random() * H * 0.55, r: 0.4 + Math.random() * 1, phase: Math.random() * Math.PI * 2 });
  }
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, `rgb(${(theme.surface || [12, 20, 27]).join(',')})`);
  bgGrad.addColorStop(1, `rgb(${(theme.surfaceBright || [40, 46, 52]).join(',')})`);
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const tw = 0.4 + 0.6 * Math.abs(Math.sin(t * 0.5 + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255,255,255,${tw * 0.7})`;
    ctx.fill();
  }

  for (const layer of layers) drawLayer(layer, t);

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  makeLayers();
  makeStars();
  loadTheme();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
