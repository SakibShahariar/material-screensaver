<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Terrain</title>
<style>
  :root {
    --primary_rgb: 138 206 255;
    --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233;
    --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250;
    --tertiary_container_rgb: 58 68 114;
    --surface_rgb: 12 20 27;
    --surface_bright_rgb: 50 58 65;
    --on_surface_variant_rgb: 191 199 209;
    --outline_rgb: 137 146 154;
  }
  html, body {
    margin: 0; padding: 0; width: 100%; height: 100%;
    overflow: hidden; background: #0c141b;
    font-family: "Google Sans", "Segoe UI", Roboto, system-ui, sans-serif;
    user-select: none;
  }

  body { cursor: none; }
  body.show-cursor { cursor: default; }

  canvas { display: block; width: 100vw; height: 100vh; }

  #ui-container {
    position: fixed; inset: 0; pointer-events: none; z-index: 10;
    display: flex; flex-direction: column; justify-content: space-between;
    padding: 36px; box-sizing: border-box;
    transition: opacity 0.8s ease;
  }
  #ui-container.hidden { opacity: 0; }

  .vignette-glass {
    background: radial-gradient(circle at center, rgba(12, 20, 27, 0.7) 0%, rgba(12, 20, 27, 0) 80%);
    backdrop-filter: blur(12px);
    -webkit-backdrop-filter: blur(12px);
    padding: 28px 40px;
    width: fit-content;
    border-radius: 24px;
  }

  #clock {
    font-size: clamp(32px, 4.5vw, 64px);
    font-weight: 300;
    font-variant-numeric: tabular-nums;
    letter-spacing: -0.5px;
    line-height: 1;
    text-shadow: 0 2px 14px rgba(0, 0, 0, 0.6);
  }
  #clock .ampm {
    font-size: 0.35em;
    margin-left: 8px;
    opacity: 0.8;
    font-weight: 400;
    text-transform: uppercase;
  }
  #date {
    font-size: clamp(12px, 1.2vw, 15px);
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-top: 8px;
    opacity: 0.85;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint {
    position: fixed; right: 36px; bottom: 36px;
    font-size: 12px; letter-spacing: 0.8px;
    opacity: 0; transition: opacity 0.8s ease;
    text-shadow: 0 2px 10px rgba(0, 0, 0, 0.6);
  }
  #hint.show { opacity: 0.75; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>

<canvas id="c"></canvas>

<div id="ui-container">
  <div class="vignette-glass">
    <div id="clock">00:00</div>
    <div id="date">Mon, Jan 1</div>
  </div>
  <div id="hint">Press <b>C</b> to toggle UI</div>
</div>

<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');
const uiContainer = document.getElementById('ui-container');

let cursorTimeout;
function triggerCursor() {
  document.body.classList.add('show-cursor');
  clearTimeout(cursorTimeout);
  cursorTimeout = setTimeout(() => {
    document.body.classList.remove('show-cursor');
  }, 2500);
}
window.addEventListener('pointermove', triggerCursor);

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth;
  H = window.innerHeight;
  canvas.width = W * dpr;
  canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  makeStars();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name, fallback) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  return (parts.length === 3 && parts.every(n => !isNaN(n))) ? parts : fallback;
}
function rgba(rgb, a) {
  const c = rgb || [200, 200, 200];
  return `rgba(${c[0]}, ${c[1]}, ${c[2]}, ${a})`;
}
function lerp(a, b, t) { return a + (b - a) * t; }

let theme = {};
let layers = [];

function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb', [12, 20, 27]),
    surfaceBright: readRGB('--surface_bright_rgb', [50, 58, 65]),
    primary: readRGB('--primary_rgb', [138, 206, 255]),
    secondary: readRGB('--secondary_rgb', [180, 199, 233]),
    tertiary: readRGB('--tertiary_rgb', [186, 196, 250]),
    primaryContainer: readRGB('--primary_container_rgb', [0, 75, 111]),
    secondaryContainer: readRGB('--secondary_container_rgb', [53, 72, 99]),
    tertiaryContainer: readRGB('--tertiary_container_rgb', [58, 68, 114]),
    outline: readRGB('--outline_rgb', [137, 146, 154]),
  };

  clockEl.style.color = rgba(theme.primary, 0.95);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);

  const colorSteps = [
    theme.tertiary,
    theme.primary,
    theme.secondary,
    theme.tertiaryContainer,
    theme.secondaryContainer,
    theme.primaryContainer
  ];

  layers.forEach((l, i) => {
    l.color = colorSteps[i % colorSteps.length];
  });
}

const LAYER_COUNT = 6;
function makeLayers() {
  layers = [];
  for (let i = 0; i < LAYER_COUNT; i++) {
    const depth = i / (LAYER_COUNT - 1); // 0 = far, 1 = near
    layers.push({
      color: [120, 120, 120],
      baseHeight: 0.28 + depth * 0.28,
      amp: (0.08 + Math.random() * 0.04) * (0.5 + depth * 0.7),
      freq: 0.5 + (1 - depth) * 0.6,
      seed: Math.random() * 1000,
      scrollSpeed: (20 + depth * 180) * 0.5,
      depth,
    });
  }
}

function ridgeNoise(x, seed, freq) {
  const p1 = Math.sin((x + seed) * 0.0018 * freq);
  const p2 = Math.sin((x + seed * 1.4) * 0.0042 * freq) * 0.45;
  const p3 = Math.sin((x + seed * 2.1) * 0.009 * freq) * 0.22;
  const p4 = Math.sin((x + seed * 3.7) * 0.018 * freq) * 0.1;
  return p1 + p2 + p3 + p4;
}

function ridgeY(layer, x) {
  const n = ridgeNoise(x, layer.seed, layer.freq);
  return H * (1 - layer.baseHeight - n * layer.amp);
}

function drawLayer(layer, t) {
  const offset = t * layer.scrollSpeed;
  ctx.beginPath();
  ctx.moveTo(0, H);

  const steps = Math.ceil(W / 12);
  for (let i = 0; i <= steps; i++) {
    const x = (i / steps) * W;
    const y = ridgeY(layer, x + offset);
    ctx.lineTo(x, y);
  }
  ctx.lineTo(W, H);
  ctx.closePath();

  const ridgeGrad = ctx.createLinearGradient(0, H * (1 - layer.baseHeight - 0.2), 0, H);
  const depthFactor = lerp(0.9, 0.45, layer.depth);
  const baseColor = (layer.color || [120, 120, 120]).map(c => Math.round(c * depthFactor));

  ridgeGrad.addColorStop(0, rgba(layer.color, 1));
  ridgeGrad.addColorStop(1, rgba(baseColor, 1));

  ctx.fillStyle = ridgeGrad;
  ctx.fill();

  if (layer.depth < 0.85) {
    const fogGrad = ctx.createLinearGradient(0, H * (1 - layer.baseHeight - 0.05), 0, H);
    fogGrad.addColorStop(0, rgba(theme.surfaceBright, 0.0));
    fogGrad.addColorStop(0.5, rgba(theme.surface, (1 - layer.depth) * 0.28));
    fogGrad.addColorStop(1, rgba(theme.surface, 0.0));
    ctx.fillStyle = fogGrad;
    ctx.fillRect(0, H * (1 - layer.baseHeight - 0.1), W, H * 0.3);
  }
}

let stars = [];
function makeStars() {
  stars = [];
  const count = Math.floor((W * H) / 12000);
  for (let i = 0; i < count; i++) {
    stars.push({
      x: Math.random() * W,
      y: Math.random() * H * 0.52,
      r: 0.4 + Math.random() * 1.2,
      phase: Math.random() * Math.PI * 2
    });
  }
}

let start = performance.now();

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);

  const bgGrad = ctx.createLinearGradient(0, 0, 0, H);
  bgGrad.addColorStop(0, rgba(theme.surface, 1));
  bgGrad.addColorStop(0.55, rgba(theme.surfaceBright, 0.85));
  bgGrad.addColorStop(1, rgba(theme.surface, 1));
  ctx.fillStyle = bgGrad;
  ctx.fillRect(0, 0, W, H);

  for (const s of stars) {
    const tw = 0.35 + 0.65 * Math.abs(Math.sin(t * 0.6 + s.phase));
    ctx.beginPath();
    ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
    ctx.fillStyle = `rgba(255, 255, 255, ${tw * 0.75})`;
    ctx.fill();
  }

  const sunX = W * 0.68;
  const sunY = H * 0.48;
  const sunGrad = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, Math.min(W, H) * 0.38);
  sunGrad.addColorStop(0, rgba(theme.primary, 0.22));
  sunGrad.addColorStop(0.4, rgba(theme.tertiary, 0.12));
  sunGrad.addColorStop(1, rgba(theme.surface, 0));
  ctx.fillStyle = sunGrad;
  ctx.fillRect(0, 0, W, H);

  ctx.beginPath();
  ctx.arc(sunX, sunY, 28, 0, Math.PI * 2);
  ctx.fillStyle = rgba(theme.primary, 0.35);
  ctx.fill();

  for (const layer of layers) drawLayer(layer, t);

  requestAnimationFrame(frame);
}

function fallbackClock() {
  const update = () => {
    const now = new Date();
    let hours = now.getHours();
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const ampm = hours >= 12 ? 'PM' : 'AM';
    hours = hours % 12 || 12;
    clockEl.innerHTML = `${String(hours).padStart(2, '0')}:${minutes}<span class="ampm">${ampm}</span>`;

    const options = { weekday: 'short', month: 'short', day: 'numeric' };
    dateEl.textContent = now.toLocaleDateString('en-US', options);
  };
  update();
  setInterval(update, 1000);
}

let uiVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    uiVisible = !uiVisible;
    uiContainer.classList.toggle('hidden', !uiVisible);
  }
});

hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  makeLayers();
  makeStars();
  loadTheme();

  try {
    if (typeof startClock === 'function') {
      startClock(clockEl, dateEl);
    } else {
      fallbackClock();
    }
  } catch (err) {
    fallbackClock();
  }

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
