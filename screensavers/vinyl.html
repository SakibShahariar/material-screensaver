<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Vinyl</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --surface_rgb: 12 20 27;
  --surface_container_rgb: 24 33 39;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock {
  position: fixed;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(40px, 4.5vw, 56px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 40px rgb(var(--primary_rgb) / .4),
    0 2px 16px rgba(0,0,0,.6);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .7;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  position: fixed;
  left: clamp(30px, 3.1vw, 50px);
  bottom: clamp(18px, 2.2vw, 28px);
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 10px rgba(0,0,0,.5);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock.hidden, #date.hidden { opacity: 0; }

#hint {
  position: fixed; right: 28px; bottom: 24px;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00<span class="ampm">AM</span></div>
<div id="date">MON, JAN 1</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");

let W = 0, H = 0, DPR = 1, cx = 0, cy = 0, R = 0;
let theme = {};
let start = performance.now();
let cursorTimer;

const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.2 : 1;

// Real 33⅓ RPM
const RPM = 33.333;
const RAD_PER_SEC = (RPM / 60) * Math.PI * 2;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:          readRGB("--surface_rgb", [12, 20, 27]),
    surfaceContainer: readRGB("--surface_container_rgb", [24, 33, 39]),
    primary:          readRGB("--primary_rgb", [138, 206, 255]),
    secondary:        readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:         readRGB("--tertiary_rgb", [186, 196, 250]),
    outline:          readRGB("--outline_rgb", [137, 146, 154])
  };
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.97);
  dateEl.style.color  = rgba(theme.secondary, 0.88);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function resize() {
  W = innerWidth; H = innerHeight;
  cx = W * 0.5; cy = H * 0.5;
  R = Math.min(W, H) * 0.34;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
}
addEventListener("resize", resize, { passive: true });

function drawRecord(angle) {
  ctx.save();
  ctx.translate(cx, cy);

  // Soft shadow
  ctx.beginPath();
  ctx.ellipse(8, 14, R * 1.02, R * 0.98, 0, 0, Math.PI * 2);
  ctx.fillStyle = "rgba(0,0,0,0.4)";
  ctx.fill();

  // Disc body
  ctx.beginPath();
  ctx.arc(0, 0, R, 0, Math.PI * 2);
  const body = ctx.createRadialGradient(-R * 0.2, -R * 0.2, R * 0.05, 0, 0, R);
  body.addColorStop(0, "rgb(32,32,36)");
  body.addColorStop(0.55, "rgb(16,16,18)");
  body.addColorStop(1, "rgb(8,8,10)");
  ctx.fillStyle = body;
  ctx.fill();

  // Grooves (rotate with disc)
  ctx.rotate(angle);
  const grooves = 120;
  for (let i = 0; i < grooves; i++) {
    const t = i / grooves;
    const r = R * (0.22 + t * 0.75);
    ctx.beginPath();
    ctx.arc(0, 0, r, 0, Math.PI * 2);
    ctx.strokeStyle = `rgba(255,255,255,${i % 3 === 0 ? 0.05 : 0.02})`;
    ctx.lineWidth = 1;
    ctx.stroke();
  }

  // Outer rim highlight
  ctx.beginPath();
  ctx.arc(0, 0, R - 0.5, 0, Math.PI * 2);
  ctx.strokeStyle = "rgba(255,255,255,0.06)";
  ctx.lineWidth = 2;
  ctx.stroke();

  // Label — Material tertiary → primary
  const labelR = R * 0.2;
  ctx.beginPath();
  ctx.arc(0, 0, labelR, 0, Math.PI * 2);
  const label = ctx.createRadialGradient(-labelR * 0.25, -labelR * 0.25, 0, 0, 0, labelR);
  label.addColorStop(0, rgba(theme.tertiary, 1));
  label.addColorStop(0.55, rgba(theme.primary, 1));
  label.addColorStop(1, rgba(theme.primary, 0.88));
  ctx.fillStyle = label;
  ctx.fill();

  // Label edge
  ctx.beginPath();
  ctx.arc(0, 0, labelR, 0, Math.PI * 2);
  ctx.strokeStyle = rgba(theme.primary, 0.35);
  ctx.lineWidth = 1.5;
  ctx.stroke();

  // Spindle hole
  ctx.beginPath();
  ctx.arc(0, 0, R * 0.016, 0, Math.PI * 2);
  ctx.fillStyle = "rgb(5,5,7)";
  ctx.fill();

  ctx.restore();

  // Sweeping light glint (disc rotates under fixed highlight)
  ctx.save();
  ctx.beginPath();
  ctx.arc(cx, cy, R, 0, Math.PI * 2);
  ctx.clip();
  ctx.translate(cx, cy);
  ctx.rotate(angle * 0.38 + 0.55);
  const glint = ctx.createLinearGradient(-R, -R * 0.2, R, R * 0.2);
  glint.addColorStop(0, "transparent");
  glint.addColorStop(0.42, "rgba(255,255,255,0.04)");
  glint.addColorStop(0.5, "rgba(255,255,255,0.07)");
  glint.addColorStop(0.58, "rgba(255,255,255,0.04)");
  glint.addColorStop(1, "transparent");
  ctx.fillStyle = glint;
  ctx.fillRect(-R, -R, R * 2, R * 2);
  ctx.restore();
}

function drawTonearm() {
  const pivotX = cx + R * 1.28;
  const pivotY = cy - R * 0.98;
  const tipX   = cx + R * 0.03;
  const tipY   = cy - R * 0.06;

  ctx.save();
  ctx.lineCap = "round";

  // Arm shadow
  ctx.beginPath();
  ctx.moveTo(pivotX + 2, pivotY + 3);
  ctx.lineTo(tipX + 2, tipY + 3);
  ctx.strokeStyle = "rgba(0,0,0,0.35)";
  ctx.lineWidth = 6;
  ctx.stroke();

  // Arm
  ctx.beginPath();
  ctx.moveTo(pivotX, pivotY);
  ctx.lineTo(tipX, tipY);
  ctx.strokeStyle = rgba(theme.outline, 0.9);
  ctx.lineWidth = 5.5;
  ctx.stroke();

  // Arm highlight
  ctx.beginPath();
  ctx.moveTo(pivotX, pivotY);
  ctx.lineTo(tipX, tipY);
  ctx.strokeStyle = rgba(theme.secondary, 0.28);
  ctx.lineWidth = 1.6;
  ctx.stroke();

  // Pivot base
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 14, 0, Math.PI * 2);
  ctx.fillStyle = rgba(theme.secondary, 0.95);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(pivotX, pivotY, 5.5, 0, Math.PI * 2);
  ctx.fillStyle = rgba(theme.surface, 0.95);
  ctx.fill();

  // Cartridge / stylus
  ctx.beginPath();
  ctx.arc(tipX, tipY, 5, 0, Math.PI * 2);
  ctx.fillStyle = rgba(theme.primary, 0.95);
  ctx.fill();
  ctx.beginPath();
  ctx.arc(tipX, tipY, 2, 0, Math.PI * 2);
  ctx.fillStyle = rgba(theme.primary, 0.45);
  ctx.fill();

  ctx.restore();
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const angle = t * RAD_PER_SEC;

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  drawRecord(angle);
  drawTonearm();

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockEl.classList.toggle("hidden");
    dateEl.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
