<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Material Screensaver — Voronoi</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --primary_container_rgb: 0 75 111;
  --secondary_rgb: 180 199 233;
  --secondary_container_rgb: 53 72 99;
  --tertiary_rgb: 186 196 250;
  --tertiary_container_rgb: 58 68 114;
  --inverse_primary_rgb: 0 100 145;
  --surface_rgb: 12 20 27;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock {
  position: fixed;
  left: clamp(28px, 3vw, 48px);
  bottom: clamp(40px, 4.5vw, 56px);
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 40px rgb(var(--primary_rgb) / .4),
    0 2px 16px rgba(0,0,0,.6);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .7;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  position: fixed;
  left: clamp(30px, 3.1vw, 50px);
  bottom: clamp(18px, 2.2vw, 28px);
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb) / .88);
  text-shadow: 0 1px 10px rgba(0,0,0,.5);
  pointer-events: none;
  transition: opacity .7s ease;
}
#clock.hidden, #date.hidden { opacity: 0; }

#hint {
  position: fixed; right: 28px; bottom: 24px;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00<span class="ampm">AM</span></div>
<div id="date">MON, JAN 1</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");

let W = 0, H = 0, DPR = 1;
let theme = {};
let seeds = [];
let roleList = [];
let start = performance.now();
let lastT = 0;
let cursorTimer;

const SEED_COUNT = 16;
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const speedMul = reduceMotion ? 0.2 : 0.65;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}
function blend(a, b, t) {
  return [
    a[0] + (b[0] - a[0]) * t,
    a[1] + (b[1] - a[1]) * t,
    a[2] + (b[2] - a[2]) * t
  ];
}

function loadTheme() {
  theme = {
    surface:            readRGB("--surface_rgb", [12, 20, 27]),
    primary:            readRGB("--primary_rgb", [138, 206, 255]),
    secondary:          readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:           readRGB("--tertiary_rgb", [186, 196, 250]),
    primaryContainer:   readRGB("--primary_container_rgb", [0, 75, 111]),
    secondaryContainer: readRGB("--secondary_container_rgb", [53, 72, 99]),
    tertiaryContainer:  readRGB("--tertiary_container_rgb", [58, 68, 114]),
    inversePrimary:     readRGB("--inverse_primary_rgb", [0, 100, 145]),
    outline:            readRGB("--outline_rgb", [137, 146, 154])
  };

  roleList = [
    theme.primary,
    theme.secondary,
    theme.tertiary,
    theme.primaryContainer,
    theme.secondaryContainer,
    theme.tertiaryContainer,
    theme.inversePrimary
  ];

  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 0.97);
  dateEl.style.color  = rgba(theme.secondary, 0.88);
  hintEl.style.color  = rgba(theme.outline, 0.6);

  seeds.forEach((s, i) => {
    const scaled = (i / Math.max(1, seeds.length - 1)) * (roleList.length - 1);
    const i0 = Math.floor(scaled) % roleList.length;
    const i1 = (i0 + 1) % roleList.length;
    s.color = blend(roleList[i0], roleList[i1], scaled - Math.floor(scaled));
  });
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  makeSeeds();
  loadTheme();
}
addEventListener("resize", resize, { passive: true });

function makeSeeds() {
  seeds = [];
  for (let i = 0; i < SEED_COUNT; i++) {
    const dir = Math.random() * Math.PI * 2;
    const speed = 3.5 + Math.random() * 4.5;
    seeds.push({
      x: Math.random() * W,
      y: Math.random() * H,
      vx: Math.cos(dir) * speed,
      vy: Math.sin(dir) * speed,
      color: [180, 180, 180]
    });
  }
}

/* True polygon Voronoi via half-plane clipping */
function clipHalfPlane(polygon, si, sj) {
  const mx = (si.x + sj.x) / 2;
  const my = (si.y + sj.y) / 2;
  const dx = sj.x - si.x;
  const dy = sj.y - si.y;

  const inside = p => (p[0] - mx) * dx + (p[1] - my) * dy < 0;
  const intersect = (p1, p2) => {
    const v1 = (p1[0] - mx) * dx + (p1[1] - my) * dy;
    const v2 = (p2[0] - mx) * dx + (p2[1] - my) * dy;
    const t = v1 / (v1 - v2);
    return [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])];
  };

  const result = [];
  for (let k = 0; k < polygon.length; k++) {
    const curr = polygon[k];
    const prev = polygon[(k - 1 + polygon.length) % polygon.length];
    const currIn = inside(curr);
    const prevIn = inside(prev);
    if (currIn) {
      if (!prevIn) result.push(intersect(prev, curr));
      result.push(curr);
    } else if (prevIn) {
      result.push(intersect(prev, curr));
    }
  }
  return result;
}

function computeCell(i) {
  const margin = Math.max(W, H) * 0.65;
  let poly = [
    [-margin, -margin],
    [W + margin, -margin],
    [W + margin, H + margin],
    [-margin, H + margin]
  ];
  for (let j = 0; j < seeds.length; j++) {
    if (j === i || poly.length === 0) continue;
    poly = clipHalfPlane(poly, seeds[i], seeds[j]);
  }
  return poly;
}

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT || 0.016);
  lastT = t;

  for (const s of seeds) {
    s.x += s.vx * dt;
    s.y += s.vy * dt;
    if (s.x < 0)  { s.x = 0;  s.vx =  Math.abs(s.vx); }
    if (s.x > W)  { s.x = W;  s.vx = -Math.abs(s.vx); }
    if (s.y < 0)  { s.y = 0;  s.vy =  Math.abs(s.vy); }
    if (s.y > H)  { s.y = H;  s.vy = -Math.abs(s.vy); }
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, 1);
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < seeds.length; i++) {
    const poly = computeCell(i);
    if (poly.length < 3) continue;
    const s = seeds[i];

    let maxR = 0;
    for (const p of poly) {
      const d = Math.hypot(p[0] - s.x, p[1] - s.y);
      if (d > maxR) maxR = d;
    }

    ctx.beginPath();
    ctx.moveTo(poly[0][0], poly[0][1]);
    for (let k = 1; k < poly.length; k++) {
      ctx.lineTo(poly[k][0], poly[k][1]);
    }
    ctx.closePath();

    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, Math.max(50, maxR));
    grad.addColorStop(0, rgba(s.color, 0.78));
    grad.addColorStop(0.55, rgba(s.color, 0.42));
    grad.addColorStop(1, rgba(s.color, 0.22));
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = rgba(theme.surface, 0.65);
    ctx.lineWidth = 1.6;
    ctx.stroke();
  }

  // Seed points + soft glow
  for (const s of seeds) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, 7, 0, Math.PI * 2);
    ctx.fillStyle = rgba(s.color, 0.18);
    ctx.fill();

    ctx.beginPath();
    ctx.arc(s.x, s.y, 2.6, 0, Math.PI * 2);
    ctx.fillStyle = rgba(s.color, 0.95);
    ctx.fill();
  }

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") {
    clockEl.classList.toggle("hidden");
    dateEl.classList.toggle("hidden");
  }
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  resize();

  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);

  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);

  requestAnimationFrame(frame);
});
</script>
</body>
</html>
