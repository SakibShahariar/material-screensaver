<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Material Screensaver — Voronoi</title>
<style>
  :root {
    --primary_rgb: 138 206 255; --primary_container_rgb: 0 75 111;
    --secondary_rgb: 180 199 233; --secondary_container_rgb: 53 72 99;
    --tertiary_rgb: 186 196 250; --tertiary_container_rgb: 58 68 114;
    --inverse_primary_rgb: 0 100 145;
    --surface_rgb: 12 20 27; --outline_rgb: 137 146 154;
  }
  html, body { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; background: rgb(var(--surface_rgb)); cursor: none; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #clock { position: fixed; left: 32px; bottom: 28px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-weight: 400; font-variant-numeric: tabular-nums; letter-spacing: 0.5px; font-size: clamp(28px,4vw,56px); text-shadow: 0 0 24px rgba(0,0,0,0.4); pointer-events: none; transition: opacity 0.6s ease; }
  #clock .ampm { font-size: 0.36em; margin-left: 6px; opacity: 0.82; vertical-align: middle; }
  #date { position: fixed; left: 34px; bottom: 14px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: clamp(12px,1.2vw,16px); letter-spacing: 1.5px; text-transform: uppercase; pointer-events: none; transition: opacity 0.6s ease; }
  #hint { position: fixed; right: 28px; bottom: 26px; font-family: "Google Sans","Segoe UI",Roboto,system-ui,sans-serif; font-size: 13px; letter-spacing: 0.5px; pointer-events: none; opacity: 0; transition: opacity 0.8s ease; }
  #hint.show { opacity: 1; }
  #clock.hidden, #date.hidden { opacity: 0; }
</style>
<link rel="stylesheet" href="file:///home/sakib/.config/matugen/matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock">00:00</div>
<div id="date">Mon, Jan 1</div>
<div id="hint">press C to toggle clock</div>
<script src="clock-shared.js"></script>
<script>
const canvas = document.getElementById('c');
const ctx = canvas.getContext('2d');
const clockEl = document.getElementById('clock');
const dateEl = document.getElementById('date');
const hintEl = document.getElementById('hint');

let dpr = Math.min(window.devicePixelRatio || 1, 2);
let W, H;
function resize() {
  W = window.innerWidth; H = window.innerHeight;
  canvas.width = W * dpr; canvas.height = H * dpr;
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  makeSeeds();
}
window.addEventListener('resize', resize);

const reduceMotion = window.matchMedia('(prefers-reduced-motion: reduce)').matches;
const speedMul = reduceMotion ? 0.2 : 1;

function readRGB(name) {
  const raw = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const parts = raw.split(/\s+/).map(Number);
  if (parts.length === 3 && parts.every(n => !isNaN(n))) return parts;
  return [200, 200, 200];
}
function rgba(rgb, a) { return `rgba(${rgb[0]}, ${rgb[1]}, ${rgb[2]}, ${a})`; }
function blendColor(a, b, t) {
  return [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];
}

let theme = {};
let roleList = [];
function loadTheme() {
  theme = {
    surface: readRGB('--surface_rgb'), primary: readRGB('--primary_rgb'), secondary: readRGB('--secondary_rgb'),
    tertiary: readRGB('--tertiary_rgb'), primaryContainer: readRGB('--primary_container_rgb'),
    secondaryContainer: readRGB('--secondary_container_rgb'), tertiaryContainer: readRGB('--tertiary_container_rgb'),
    inversePrimary: readRGB('--inverse_primary_rgb'), outline: readRGB('--outline_rgb'),
  };
  roleList = [theme.primary, theme.secondary, theme.tertiary, theme.primaryContainer, theme.secondaryContainer, theme.tertiaryContainer, theme.inversePrimary];
  clockEl.style.color = rgba(theme.primary, 0.92);
  dateEl.style.color = rgba(theme.secondary, 0.85);
  hintEl.style.color = rgba(theme.outline, 0.9);
  seeds.forEach((s, i) => {
    const scaled = (i / seeds.length) * roleList.length;
    const idx0 = Math.floor(scaled) % roleList.length;
    const idx1 = (idx0 + 1) % roleList.length;
    s.color = blendColor(roleList[idx0], roleList[idx1], scaled - Math.floor(scaled));
  });
}

let seeds = [];
function makeSeeds() {
  const count = 14;
  seeds = [];
  for (let i = 0; i < count; i++) {
    const dir = Math.random() * Math.PI * 2;
    seeds.push({
      x: Math.random() * W, y: Math.random() * H,
      vx: Math.cos(dir) * 7, vy: Math.sin(dir) * 7,
      color: [200, 200, 200],
    });
  }
}

// --- true polygon Voronoi via half-plane clipping (Sutherland-Hodgman) ---
// gives crisp, mathematically exact cell edges instead of a coarse pixel mosaic
function clipHalfPlane(polygon, si, sj) {
  const mx = (si.x + sj.x) / 2, my = (si.y + sj.y) / 2;
  const dx = sj.x - si.x, dy = sj.y - si.y;
  const inside = (p) => (p[0] - mx) * dx + (p[1] - my) * dy < 0;
  const intersect = (p1, p2) => {
    const v1 = (p1[0] - mx) * dx + (p1[1] - my) * dy;
    const v2 = (p2[0] - mx) * dx + (p2[1] - my) * dy;
    const t = v1 / (v1 - v2);
    return [p1[0] + t * (p2[0] - p1[0]), p1[1] + t * (p2[1] - p1[1])];
  };
  const result = [];
  for (let k = 0; k < polygon.length; k++) {
    const curr = polygon[k], prev = polygon[(k - 1 + polygon.length) % polygon.length];
    const currIn = inside(curr), prevIn = inside(prev);
    if (currIn) {
      if (!prevIn) result.push(intersect(prev, curr));
      result.push(curr);
    } else if (prevIn) {
      result.push(intersect(prev, curr));
    }
  }
  return result;
}

function computeCell(i) {
  const margin = Math.max(W, H) * 0.5;
  let poly = [[-margin, -margin], [W + margin, -margin], [W + margin, H + margin], [-margin, H + margin]];
  for (let j = 0; j < seeds.length; j++) {
    if (j === i || poly.length === 0) continue;
    poly = clipHalfPlane(poly, seeds[i], seeds[j]);
  }
  return poly;
}

let start = performance.now();
let lastT = 0;

function frame(now) {
  const t = ((now - start) / 1000) * speedMul;
  const dt = Math.min(0.05, t - lastT);
  lastT = t;

  for (const s of seeds) {
    s.x += s.vx * dt; s.y += s.vy * dt;
    if (s.x < 0) { s.x = 0; s.vx *= -1; }
    if (s.x > W) { s.x = W; s.vx *= -1; }
    if (s.y < 0) { s.y = 0; s.vy *= -1; }
    if (s.y > H) { s.y = H; s.vy *= -1; }
  }

  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.fillStyle = `rgb(${theme.surface.join(',')})`;
  ctx.fillRect(0, 0, W, H);

  for (let i = 0; i < seeds.length; i++) {
    const poly = computeCell(i);
    if (poly.length < 3) continue;
    const s = seeds[i];

    let maxR = 0;
    for (const p of poly) {
      const d = Math.hypot(p[0] - s.x, p[1] - s.y);
      if (d > maxR) maxR = d;
    }

    ctx.beginPath();
    ctx.moveTo(poly[0][0], poly[0][1]);
    for (let k = 1; k < poly.length; k++) ctx.lineTo(poly[k][0], poly[k][1]);
    ctx.closePath();

    const grad = ctx.createRadialGradient(s.x, s.y, 0, s.x, s.y, maxR);
    grad.addColorStop(0, rgba(s.color, 0.85));
    grad.addColorStop(1, rgba(s.color, 0.4));
    ctx.fillStyle = grad;
    ctx.fill();

    ctx.strokeStyle = rgba(theme.surface, 0.85);
    ctx.lineWidth = 2;
    ctx.stroke();
  }

  for (const s of seeds) {
    ctx.beginPath();
    ctx.arc(s.x, s.y, 2.5, 0, Math.PI * 2);
    ctx.fillStyle = rgba(s.color, 0.95);
    ctx.fill();
  }

  requestAnimationFrame(frame);
}

let clockVisible = true;
window.addEventListener('keydown', (e) => {
  if (e.key.toLowerCase() === 'c') {
    clockVisible = !clockVisible;
    clockEl.classList.toggle('hidden', !clockVisible);
    dateEl.classList.toggle('hidden', !clockVisible);
  }
});
hintEl.classList.add('show');
setTimeout(() => hintEl.classList.remove('show'), 4000);

window.addEventListener('load', () => {
  resize();
  loadTheme();
  startClock(clockEl, dateEl);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
