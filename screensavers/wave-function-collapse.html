<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>wave-function-collapse</title>
<style>
:root {
  --primary_rgb: 138 206 255;
  --secondary_rgb: 180 199 233;
  --tertiary_rgb: 186 196 250;
  --primary_container_rgb: 0 75 111;
  --surface_rgb: 8 12 18;
  --outline_rgb: 137 146 154;
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body {
  width: 100%; height: 100%; overflow: hidden;
  background: rgb(var(--surface_rgb));
  cursor: none;
  font-family: "Google Sans", "Segoe UI", system-ui, sans-serif;
}
body.show-cursor { cursor: default; }
canvas { display: block; width: 100vw; height: 100vh; }

#clock-wrap {
  position: fixed;
  left: clamp(20px, 2.5vw, 40px);
  bottom: clamp(16px, 2vw, 28px);
  padding: 18px 26px 14px;
  border-radius: 20px;
  background: radial-gradient(
    ellipse at 30% 70%,
    rgb(var(--surface_rgb) / .9) 0%,
    rgb(var(--surface_rgb) / .55) 55%,
    transparent 100%
  );
  pointer-events: none;
  transition: opacity .7s ease;
  z-index: 10;
}
#clock-wrap.hidden { opacity: 0; }

#clock {
  font-weight: 200;
  font-variant-numeric: tabular-nums;
  letter-spacing: -2px;
  font-size: clamp(40px, 5.5vw, 78px);
  color: rgb(var(--primary_rgb));
  text-shadow:
    0 0 2px rgb(var(--surface_rgb)),
    0 0 14px rgb(var(--surface_rgb) / .95),
    0 0 36px rgb(var(--primary_rgb) / .5),
    0 2px 14px rgba(0,0,0,.85);
  line-height: 1;
}
#clock .ampm {
  font-size: .26em;
  margin-left: 10px;
  opacity: .78;
  vertical-align: 22%;
  letter-spacing: 2px;
  font-weight: 400;
}
#date {
  margin-top: 8px;
  font-size: clamp(11px, 1.05vw, 14px);
  letter-spacing: 4px;
  text-transform: uppercase;
  color: rgb(var(--secondary_rgb));
  text-shadow:
    0 0 8px rgb(var(--surface_rgb) / .9),
    0 1px 8px rgba(0,0,0,.7);
  opacity: .95;
}

#hint {
  position: fixed; right: 28px; bottom: 24px; z-index: 10;
  font-size: 11px; letter-spacing: 1.5px;
  color: rgb(var(--outline_rgb) / .55);
  opacity: 0; transition: opacity 1s ease;
  text-transform: uppercase;
  pointer-events: none;
  text-shadow: 0 1px 8px rgb(var(--surface_rgb));
}
#hint.show { opacity: .7; }
</style>
<link rel="stylesheet" href="matugen-colors.css">
</head>
<body>
<canvas id="c"></canvas>
<div id="clock-wrap">
  <div id="clock">00:00<span class="ampm">AM</span></div>
  <div id="date">MON, JAN 1</div>
</div>
<div id="hint">C · toggle clock</div>

<script>
"use strict";

const canvas = document.getElementById("c");
const ctx = canvas.getContext("2d", { alpha: false, desynchronized: true });
const clockEl = document.getElementById("clock");
const dateEl  = document.getElementById("date");
const hintEl  = document.getElementById("hint");
const clockWrap = document.getElementById("clock-wrap");

let W = 0, H = 0, DPR = 1;
let theme = {};
let cell = 28;
let cols = 0, rows = 0;
let grid = [];        // each cell: Set of possible tile ids, or number if collapsed
let collapsed = 0;
let total = 0;
let phase = "collapse"; // collapse | hold | fade
let holdUntil = 0;
let fadeAlpha = 1;
let start = performance.now();
let cursorTimer;
let lastStep = 0;

// Edge codes: 0 empty, 1 line
// Tiles as [N, E, S, W] edge sockets + draw style
const TILES = [
  { id: 0, e: [0,0,0,0], kind: "empty" },
  { id: 1, e: [1,0,1,0], kind: "v" },      // vertical
  { id: 2, e: [0,1,0,1], kind: "h" },      // horizontal
  { id: 3, e: [1,1,0,0], kind: "ne" },     // corner
  { id: 4, e: [0,1,1,0], kind: "es" },
  { id: 5, e: [0,0,1,1], kind: "sw" },
  { id: 6, e: [1,0,0,1], kind: "wn" },
  { id: 7, e: [1,1,1,0], kind: "t_nes" },  // T junctions
  { id: 8, e: [0,1,1,1], kind: "t_esw" },
  { id: 9, e: [1,0,1,1], kind: "t_swn" },
  { id:10, e: [1,1,0,1], kind: "t_wne" },
  { id:11, e: [1,1,1,1], kind: "cross" },
];

const ALL = TILES.map(t => t.id);
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
const STEP_MS = reduceMotion ? 80 : 28;
const HOLD_MS = 3200;

function readRGB(name, fb = [160, 160, 160]) {
  const r = getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const p = r.split(/\s+/).map(Number);
  return (p.length === 3 && p.every(n => !isNaN(n))) ? p : fb;
}
function rgba(c, a = 1) {
  return `rgba(${c[0]},${c[1]},${c[2]},${a})`;
}

function loadTheme() {
  theme = {
    surface:   readRGB("--surface_rgb", [8, 12, 18]),
    primary:   readRGB("--primary_rgb", [138, 206, 255]),
    secondary: readRGB("--secondary_rgb", [180, 199, 233]),
    tertiary:  readRGB("--tertiary_rgb", [186, 196, 250]),
    container: readRGB("--primary_container_rgb", [0, 75, 111]),
    outline:   readRGB("--outline_rgb", [137, 146, 154])
  };
  document.body.style.background = rgba(theme.surface);
  clockEl.style.color = rgba(theme.primary, 1);
  dateEl.style.color  = rgba(theme.secondary, 0.95);
  hintEl.style.color  = rgba(theme.outline, 0.6);
}

function compatible(a, b, dir) {
  // dir: 0=N means a's N must match b's S
  const opp = (dir + 2) % 4;
  return TILES[a].e[dir] === TILES[b].e[opp];
}

function initGrid() {
  grid = new Array(cols * rows);
  for (let i = 0; i < grid.length; i++) {
    grid[i] = new Set(ALL);
  }
  collapsed = 0;
  total = cols * rows;
  phase = "collapse";
  fadeAlpha = 1;
}

function entropy(i) {
  const s = grid[i];
  if (typeof s === "number") return -1;
  return s.size;
}

function pickMinEntropy() {
  let best = [];
  let min = Infinity;
  for (let i = 0; i < grid.length; i++) {
    const e = entropy(i);
    if (e < 2) continue; // 0 = contradiction handled, 1 = already forced
    if (e < min) { min = e; best = [i]; }
    else if (e === min) best.push(i);
  }
  // also collapse forced singles
  for (let i = 0; i < grid.length; i++) {
    if (grid[i] instanceof Set && grid[i].size === 1) best.push(i);
  }
  if (!best.length) return -1;
  return best[(Math.random() * best.length) | 0];
}

function collapseOne() {
  // First collapse any size-1 cells
  for (let i = 0; i < grid.length; i++) {
    if (grid[i] instanceof Set && grid[i].size === 1) {
      const v = [...grid[i]][0];
      grid[i] = v;
      collapsed++;
      propagate(i);
      return true;
    }
  }

  const i = pickMinEntropy();
  if (i < 0) return false;

  const options = [...grid[i]];
  if (!options.length) {
    // contradiction → restart
    initGrid();
    return true;
  }
  const choice = options[(Math.random() * options.length) | 0];
  grid[i] = choice;
  collapsed++;
  propagate(i);
  return true;
}

function propagate(start) {
  const stack = [start];
  while (stack.length) {
    const i = stack.pop();
    const x = i % cols;
    const y = (i / cols) | 0;
    const tile = grid[i];
    const tileId = typeof tile === "number" ? tile : null;

    const neighbors = [
      [x, y - 1, 0], // N — constrain neighbor's S vs our N
      [x + 1, y, 1],
      [x, y + 1, 2],
      [x - 1, y, 3]
    ];

    for (const [nx, ny, dir] of neighbors) {
      if (nx < 0 || ny < 0 || nx >= cols || ny >= rows) continue;
      const ni = ny * cols + nx;
      if (typeof grid[ni] === "number") continue;

      const before = grid[ni].size;
      const next = new Set();
      for (const opt of grid[ni]) {
        // neighbor opt must be compatible with our tile(s)
        if (tileId !== null) {
          if (compatible(tileId, opt, dir)) next.add(opt);
        } else {
          // our cell still superposition — keep opt if any of ours fits
          for (const ours of grid[i]) {
            if (compatible(ours, opt, dir)) { next.add(opt); break; }
          }
        }
      }
      if (next.size === 0) {
        // contradiction
        initGrid();
        return;
      }
      if (next.size < before) {
        grid[ni] = next;
        stack.push(ni);
      }
    }
  }
}

function drawTile(id, x, y, alpha) {
  const t = TILES[id];
  const cx = x * cell + cell / 2;
  const cy = y * cell + cell / 2;
  const r = cell * 0.28;

  ctx.lineCap = "round";
  ctx.lineJoin = "round";
  ctx.lineWidth = Math.max(2, cell * 0.12);

  const colors = [theme.primary, theme.secondary, theme.tertiary];
  const col = colors[id % 3];

  if (t.kind === "empty") {
    ctx.beginPath();
    ctx.arc(cx, cy, 1.5, 0, Math.PI * 2);
    ctx.fillStyle = rgba(theme.outline, 0.15 * alpha);
    ctx.fill();
    return;
  }

  ctx.strokeStyle = rgba(col, 0.75 * alpha);
  ctx.beginPath();
  // draw edges that are “on”
  if (t.e[0]) { ctx.moveTo(cx, cy); ctx.lineTo(cx, cy - cell / 2); }
  if (t.e[1]) { ctx.moveTo(cx, cy); ctx.lineTo(cx + cell / 2, cy); }
  if (t.e[2]) { ctx.moveTo(cx, cy); ctx.lineTo(cx, cy + cell / 2); }
  if (t.e[3]) { ctx.moveTo(cx, cy); ctx.lineTo(cx - cell / 2, cy); }
  ctx.stroke();

  // node
  ctx.beginPath();
  ctx.arc(cx, cy, Math.max(2, cell * 0.08), 0, Math.PI * 2);
  ctx.fillStyle = rgba(col, 0.9 * alpha);
  ctx.fill();
}

function drawSuper(x, y, set, alpha) {
  const cx = x * cell + cell / 2;
  const cy = y * cell + cell / 2;
  const n = set.size;
  const a = (0.08 + (1 - n / ALL.length) * 0.25) * alpha;
  ctx.beginPath();
  ctx.arc(cx, cy, cell * 0.12, 0, Math.PI * 2);
  ctx.fillStyle = rgba(theme.outline, a);
  ctx.fill();
}

function resize() {
  W = innerWidth; H = innerHeight;
  DPR = Math.min(devicePixelRatio || 1, 2);
  canvas.width  = Math.floor(W * DPR);
  canvas.height = Math.floor(H * DPR);
  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

  cell = Math.max(22, Math.min(36, Math.floor(Math.min(W, H) / 28)));
  cols = Math.ceil(W / cell) + 1;
  rows = Math.ceil(H / cell) + 1;
  initGrid();
}
addEventListener("resize", resize, { passive: true });

function frame(now) {
  const t = now - start;

  if (phase === "collapse" && t - lastStep >= STEP_MS) {
    lastStep = t;
    // collapse several cells per tick for pace
    const n = reduceMotion ? 1 : 3;
    for (let k = 0; k < n; k++) {
      if (!collapseOne()) {
        phase = "hold";
        holdUntil = t + HOLD_MS;
        break;
      }
      if (collapsed >= total) {
        phase = "hold";
        holdUntil = t + HOLD_MS;
        break;
      }
    }
  } else if (phase === "hold" && t >= holdUntil) {
    phase = "fade";
    fadeAlpha = 1;
  } else if (phase === "fade") {
    fadeAlpha -= 0.02;
    if (fadeAlpha <= 0) {
      initGrid();
      phase = "collapse";
      fadeAlpha = 1;
    }
  }

  ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  ctx.fillStyle = rgba(theme.surface, phase === "fade" ? 0.25 : 1);
  if (phase !== "fade") ctx.fillRect(0, 0, W, H);
  else {
    ctx.fillStyle = rgba(theme.surface, 0.15);
    ctx.fillRect(0, 0, W, H);
  }

  const a = fadeAlpha;
  for (let y = 0; y < rows; y++) {
    for (let x = 0; x < cols; x++) {
      const i = y * cols + x;
      const cellVal = grid[i];
      if (typeof cellVal === "number") drawTile(cellVal, x, y, a);
      else if (cellVal instanceof Set) drawSuper(x, y, cellVal, a);
    }
  }

  requestAnimationFrame(frame);
}

addEventListener("pointermove", () => {
  document.body.classList.add("show-cursor");
  clearTimeout(cursorTimer);
  cursorTimer = setTimeout(() => document.body.classList.remove("show-cursor"), 2500);
}, { passive: true });

addEventListener("keydown", e => {
  if (e.key.toLowerCase() === "c") clockWrap.classList.toggle("hidden");
  if (e.key.toLowerCase() === "r") initGrid();
});

function fallbackClock() {
  function update() {
    const n = new Date();
    let h = n.getHours();
    const ap = h >= 12 ? "PM" : "AM";
    h = h % 12 || 12;
    clockEl.innerHTML =
      `${String(h).padStart(2,"0")}:${String(n.getMinutes()).padStart(2,"0")}` +
      `<span class="ampm">${ap}</span>`;
    dateEl.textContent = n.toLocaleDateString("en-US", {
      weekday: "short", month: "short", day: "numeric"
    }).toUpperCase();
  }
  update();
  setInterval(update, 1000);
}

addEventListener("load", () => {
  loadTheme();
  resize();
  const s = document.createElement("script");
  s.src = "clock-shared.js";
  s.onload = () => {
    try {
      if (typeof startClock === "function") startClock(clockEl, dateEl);
      else fallbackClock();
    } catch { fallbackClock(); }
  };
  s.onerror = fallbackClock;
  document.head.appendChild(s);
  hintEl.classList.add("show");
  setTimeout(() => hintEl.classList.remove("show"), 4000);
  requestAnimationFrame(frame);
});
</script>
</body>
</html>
